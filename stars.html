<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3460">
<link rel="icon" href="icon-192.png">
<title>Stars & SOTD Editor · Sing From Home</title>
<style>
:root{
  --bg:#f8fafc;--fg:#0f172a;--card:#ffffff;--ac:#0f3460;--ac-light:#e8eef7;
  --mut:#64748b;--bd:#cbd5e1;--btn-pri-bg:linear-gradient(135deg,#0f3460 0%,#1e4a7a 100%);
  --shadow:0 4px 18px -2px rgba(15,23,42,0.06),0 2px 6px -1px rgba(15,23,42,0.03);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0a0f1d;--fg:#f8fafc;--card:#141d33;--ac:#60a5fa;--ac-light:#1e293b;
    --mut:#94a3b8;--bd:#1e293b;--btn-pri-bg:linear-gradient(135deg,#1e40af 0%,#3b82f6 100%);
    --shadow:0 10px 30px -4px rgba(0,0,0,0.5);
    color-scheme:dark;
  }
}
html,body{margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);
  position:sticky;top:0;z-index:40;
}
h1{font-size:18px;font-weight:800;margin:0;color:var(--ac)}
.sub-fnd{font-size:10.5px;color:var(--mut)}
main{padding:10px;max-width:860px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
button{
  font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--bd);
  background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;
}
button.pri{background:var(--btn-pri-bg);color:#fff;border-color:transparent}
button.danger{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border-color:transparent}
button.warn{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;border-color:transparent}
input,select{
  font:inherit;font-size:13.5px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);
  border-radius:8px;padding:6px 8px;box-sizing:border-box;
}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m{color:var(--mut);font-size:12.5px}
.tbl{overflow-x:auto;margin-top:8px;border-radius:8px;border:1px solid var(--bd)}
.tbl table{border-collapse:separate;border-spacing:0;min-width:100%}
.tbl th,.tbl td{white-space:nowrap;padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;color:var(--mut);background:var(--bg)}
.tbl tr:last-child td{border-bottom:none}
.n{text-align:center}
#custom-modal{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,0.7);display:none;align-items:center;justify-content:center;padding:16px}
#custom-modal .box{background:var(--card);color:var(--fg);max-width:420px;width:100%;border-radius:12px;padding:18px;border:1px solid var(--bd)}
</style></head><body>
<header>
  <div>
    <h1>★ STARS & SOTD EDITOR</h1>
    <div class="sub-fnd">Standalone Superadmin Star Balance, Missing Day SOTD & SOTM Editor</div>
  </div>
  <div class="row">
    <button onclick="downloadEditorBackup()">Backup JSON</button>
    <button class="pri" onclick="location.href='index.html'">← Back to App</button>
  </div>
</header>
<main id="app"><p class="m">Loading Superadmin Star Editor…</p></main>
<div id="custom-modal"><div class="box" id="custom-modal-body"></div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const CFG = {
  firebase: {
    apiKey: "AIzaSyDe0qD1wnPQH5H9wewX59gj5D16aAYhIOU",
    authDomain: "sing-from-home.firebaseapp.com",
    projectId: "sing-from-home",
    appId: "1:848212321051:web:bb26a98a842eb16f21e9be"
  },
  superadmins: ["musicsnsounds@gmail.com"]
};

const app = initializeApp(CFG.firebase), auth = getAuth(app), fs = getFirestore(app);
const $ = s => document.querySelector(s);
const e = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd = k => k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(0,4);
const tdy = () => {const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

let PUB = null;
let searchFilter = '';

window.showNotice = (msg, title="Stars & SOTD Editor") => {
  $('#custom-modal-body').innerHTML = `<h3 style="margin:0 0 10px;color:var(--ac)">${e(title)}</h3><p style="margin:0 0 14px;white-space:pre-line">${e(msg)}</p><div style="text-align:right"><button class="pri" onclick="closeModal()">OK</button></div>`;
  $('#custom-modal').style.display = 'flex';
};
window.showConfirm = (msg, onOk, title="Confirm") => {
  $('#custom-modal-body').innerHTML = `<h3 style="margin:0 0 10px;color:var(--ac)">${e(title)}</h3><p style="margin:0 0 14px;white-space:pre-line">${e(msg)}</p><div style="text-align:right;display:flex;gap:8px;justify-content:flex-end"><button onclick="closeModal()">Cancel</button><button class="danger" id="ok_btn">Confirm</button></div>`;
  $('#ok_btn').onclick = () => { closeModal(); onOk(); };
  $('#custom-modal').style.display = 'flex';
};
window.closeModal = () => { $('#custom-modal').style.display = 'none'; };

onAuthStateChanged(auth, async u => {
  if (!u || !CFG.superadmins.includes((u.email||'').toLowerCase()) || !u.emailVerified) {
    $('#app').innerHTML = `<div class="c"><b>Superadmin Access Required</b><p class="m">Please sign in as Superadmin in the main app first.</p><button class="pri" onclick="location.href='index.html'">Back to Main App</button></div>`;
    return;
  }
  await loadData();
});

async function loadData() {
  const snap = await getDoc(doc(fs, 'pub', 'data'));
  PUB = snap.exists() ? snap.data() : { singers: [], sotd: [], som: {}, somd: {}, stars: {} };
  PUB.singers = PUB.singers || [];
  PUB.sotd = PUB.sotd || [];
  PUB.stars = PUB.stars || {};
  PUB.som = PUB.som || {};
  PUB.somd = PUB.somd || {};
  draw();
}

async function persistPub(msg) {
  PUB.ts = tdy();
  await setDoc(doc(fs, 'pub', 'data'), PUB);
  draw();
  if (msg) showNotice(msg);
}

window.adjustStars = async (singerName, delta) => {
  const sk = singerName.toUpperCase();
  PUB.stars[sk] = PUB.stars[sk] || { t: 0, d: [], m: {} };
  PUB.stars[sk].t = Math.max(0, (PUB.stars[sk].t || 0) + delta);
  await persistPub();
};

window.setExactStars = async (singerName) => {
  const inp = $(`#exact_${singerName.replace(/[^a-zA-Z0-9]/g, '_')}`);
  if (!inp) return;
  const val = Math.max(0, parseInt(inp.value || '0', 10) || 0);
  const sk = singerName.toUpperCase();
  PUB.stars[sk] = PUB.stars[sk] || { t: 0, d: [], m: {} };
  PUB.stars[sk].t = val;
  await persistPub(`Updated ${sk} genuine stars to ${val}.`);
};

window.addMissingSOTDEntry = async () => {
  const dt = ($('#ms_date').value || '').trim();
  const sg = ($('#ms_singer').value || '').trim().toUpperCase();
  const mode = $('#ms_mode').value || 'Score';
  const addStar = $('#ms_add_star').checked;

  if (!dt || !sg) { showNotice('Select a date and enter a singer name.'); return; }

  let dayRec = PUB.sotd.find(x => x.d === dt);
  if (!dayRec) {
    dayRec = { d: dt, l: [] };
    PUB.sotd.push(dayRec);
  }
  if (!dayRec.l.some(w => w.n === sg)) {
    dayRec.l.push({ n: sg, h: mode });
  }
  PUB.sotd.sort((a, b) => a.d.localeCompare(b.d));

  if (!PUB.singers.includes(sg)) {
    PUB.singers.push(sg);
    PUB.singers.sort();
  }

  PUB.stars[sg] = PUB.stars[sg] || { t: 0, d: [], m: {} };
  if (!PUB.stars[sg].d.includes(dt)) {
    PUB.stars[sg].d.push(dt);
    PUB.stars[sg].d.sort();
  }
  if (addStar && mode !== 'Special') {
    PUB.stars[sg].t = (PUB.stars[sg].t || 0) + 1;
  }

  $('#ms_singer').value = '';
  await persistPub(`Added ${sg} on ${fd(dt)} (${mode})${addStar && mode !== 'Special' ? ' and credited +1 star' : ''}.`);
};

window.removeSOTDEntry = (dt, singerName) => {
  showConfirm(`Remove ${singerName} from SOTD on ${fd(dt)}? (Use the star controls above if you also want to decrement their star count.)`, async () => {
    const dayRec = PUB.sotd.find(x => x.d === dt);
    if (dayRec) {
      dayRec.l = dayRec.l.filter(w => w.n !== singerName);
      if (!dayRec.l.length) {
        PUB.sotd = PUB.sotd.filter(x => x.d !== dt);
      }
    }
    if (PUB.stars[singerName] && Array.isArray(PUB.stars[singerName].d)) {
      PUB.stars[singerName].d = PUB.stars[singerName].d.filter(d => d !== dt);
    }
    await persistPub(`Removed ${singerName} from ${fd(dt)}.`);
  });
};

window.addNewSingerStarRecord = async () => {
  const sg = ($('#new_star_singer').value || '').trim().toUpperCase();
  const cnt = Math.max(0, parseInt($('#new_star_cnt').value || '1', 10) || 0);
  if (!sg) { showNotice('Enter singer name.'); return; }
  if (!PUB.singers.includes(sg)) {
    PUB.singers.push(sg);
    PUB.singers.sort();
  }
  PUB.stars[sg] = PUB.stars[sg] || { t: 0, d: [], m: {} };
  PUB.stars[sg].t = cnt;
  $('#new_star_singer').value = '';
  await persistPub(`Set ${sg} genuine stars to ${cnt}.`);
};

window.downloadEditorBackup = () => {
  const blob = new Blob([JSON.stringify({ kind: 'sfh-stars-backup', ts: tdy(), data: PUB }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `SFH_Stars_SOTD_Backup_${tdy()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

window.setSearch = (val) => {
  searchFilter = (val || '').trim().toUpperCase();
  draw();
};

function draw() {
  const allNames = new Set([...(PUB.singers || []), ...Object.keys(PUB.stars || {})]);
  (PUB.sotd || []).forEach(x => (x.l || []).forEach(w => allNames.add(w.n)));
  let sortedSingers = [...allNames].filter(Boolean).sort((a, b) => {
    const sa = (PUB.stars[a] && PUB.stars[a].t) || 0;
    const sb = (PUB.stars[b] && PUB.stars[b].t) || 0;
    return sb - sa || a.localeCompare(b);
  });
  if (searchFilter) {
    sortedSingers = sortedSingers.filter(n => n.includes(searchFilter));
  }

  const recentSOTD = (PUB.sotd || []).slice().sort((a, b) => b.d.localeCompare(a.d));

  $('#app').innerHTML = `
    <div class="c">
      <b>1. Add Missing-Day SOTD / Star Date</b>
      <p class="m" style="margin:2px 0 8px">Backfill a missing Singer of the Day record and optionally credit +1 star.</p>
      <div class="f">
        <input type="date" id="ms_date" value="${tdy()}">
        <input id="ms_singer" list="dl_singers" placeholder="Singer Name" style="text-transform:uppercase">
        <select id="ms_mode">
          <option value="Score">Score (+1 Star)</option>
          <option value="Quiz">Quiz (+1 Star)</option>
          <option value="Special">Special / Encouragement (No Star)</option>
        </select>
      </div>
      <div class="row" style="justify-content:space-between;margin-top:6px">
        <label class="row" style="font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="ms_add_star" checked> Also increment Genuine Star count (+1)
        </label>
        <button class="pri" onclick="addMissingSOTDEntry()">+ Add SOTD Record</button>
      </div>
      <datalist id="dl_singers">${[...allNames].sort().map(n => `<option value="${e(n)}">`).join('')}</datalist>
    </div>

    <div class="c">
      <div class="row" style="justify-content:space-between">
        <b>2. Direct Star Balance Manipulation (${sortedSingers.length})</b>
        <input placeholder="Filter singer..." value="${e(searchFilter)}" oninput="setSearch(this.value)" style="max-width:190px">
      </div>
      <div class="row" style="margin-top:8px">
        <input id="new_star_singer" list="dl_singers" placeholder="New singer name..." style="text-transform:uppercase;flex:1;min-width:160px">
        <input id="new_star_cnt" type="number" min="0" max="20" value="1" style="width:65px">
        <button class="pri" onclick="addNewSingerStarRecord()">Set Stars</button>
      </div>

      <div class="tbl"><table>
        <tr>
          <th>Singer Name</th>
          <th>Earned Dates</th>
          <th class="n">Stars Visual</th>
          <th class="n">Genuine Stars</th>
          <th style="text-align:center">Quick Adjust</th>
        </tr>
        ${sortedSingers.map(name => {
          const st = PUB.stars[name] || { t: 0, d: [] };
          const cur = st.t || 0;
          const sKey = name.replace(/[^a-zA-Z0-9]/g, '_');
          return `<tr>
            <td><b>${e(name)}</b></td>
            <td style="white-space:normal;min-width:140px;font-size:11.5px">${(st.d || []).map(fd).join(', ') || '<span class="m">-</span>'}</td>
            <td class="n" style="color:#f59e0b">${cur > 0 ? '★'.repeat(Math.min(cur, 10)) : '<span class="m">0</span>'}</td>
            <td class="n">
              <input id="exact_${sKey}" type="number" min="0" max="20" value="${cur}" style="width:58px;padding:3px 5px;text-align:center">
              <button style="padding:3px 6px;font-size:11px" onclick="setExactStars('${e(name)}')">Set</button>
            </td>
            <td style="text-align:center">
              <button onclick="adjustStars('${e(name)}', -1)">-1</button>
              <button class="pri" onclick="adjustStars('${e(name)}', 1)">+1</button>
            </td>
          </tr>`;
        }).join('')}
      </table></div>
    </div>

    <div class="c">
      <b>3. Edit / Remove SOTD History Entries (${recentSOTD.length} dates)</b>
      <div class="tbl"><table>
        <tr><th>Date</th><th>Declared SOTD Singer(s)</th><th style="text-align:center">Remove</th></tr>
        ${recentSOTD.map(row => `<tr>
          <td><b>${fd(row.d)}</b></td>
          <td>${(row.l || []).map(w => `<b>${e(w.n)}</b> <span class="m">(${e(w.h)})</span>`).join(', ')}</td>
          <td style="text-align:center">
            ${(row.l || []).map(w => `<button class="danger" style="padding:2px 6px;font-size:11px;margin:1px" onclick="removeSOTDEntry('${row.d}', '${e(w.n)}')">Del ${e(w.n.split(' ')[0])}</button>`).join('')}
          </td>
        </tr>`).join('')}
      </table></div>
    </div>
  `;
}
</script></body></html>
