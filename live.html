const DEFAULT_AUDIO_REACTIONS = [
  { id: 'applause_high', label: '👏 Applause High', builtin: 'applause_high', fileName: '', hasCustomAudio: false, cloudDocId: '' },
  { id: 'applause_low', label: '👏 Applause Low', builtin: 'applause_low', fileName: '', hasCustomAudio: false, cloudDocId: '' },
  { id: 'single_clap', label: '👏 Single Clap', builtin: 'single_clap', fileName: '', hasCustomAudio: false, cloudDocId: '' },
  { id: 'double_clap', label: '👏👏 Double Clap', builtin: 'double_clap', fileName: '', hasCustomAudio: false, cloudDocId: '' },
  { id: 'drum_roll', label: '🥁 Drum Roll', builtin: 'drum_roll', fileName: '', hasCustomAudio: false, cloudDocId: '' },
  { id: 'fanfare', label: '🎺 Fanfare', builtin: 'fanfare', fileName: '', hasCustomAudio: false, cloudDocId: '' }
];

let AUDIO_REACTIONS = DEFAULT_AUDIO_REACTIONS.map(x => ({ ...x }));
const SFX_AUDIO_CACHE = {}; // id -> dataUrl (in-memory for synchronous zero-latency playback)
let SFX_CTX = null;
let SFX_VOLUME = 0.85;
let SFX_MASTER_GAIN = null;
let SFX_ACTIVE_AUDIO = null;
let SFX_ACTIVE_NODES = [];
let SFX_ACTIVE_TIMERS = [];
let SFX_CURRENT_ID = '';

function openSfxIDB() {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open('sfh_settings_db', 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (_) {
      resolve(null);
    }
  });
}

async function idbGetSfxAudio(id) {
  const db = await openSfxIDB();
  if (!db) return null;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction('kv', 'readonly');
      const g = tx.objectStore('kv').get('sfx_audio_' + id);
      g.onsuccess = () => resolve(g.result || null);
      g.onerror = () => resolve(null);
    } catch (_) { resolve(null); }
  });
}

async function idbSetSfxAudio(id, dataUrl) {
  const db = await openSfxIDB();
  if (!db) return false;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction('kv', 'readwrite');
      const p = tx.objectStore('kv').put(dataUrl, 'sfx_audio_' + id);
      p.onsuccess = () => resolve(true);
      p.onerror = () => resolve(false);
    } catch (_) { resolve(false); }
  });
}

async function idbDelSfxAudio(id) {
  const db = await openSfxIDB();
  if (!db) return;
  return new Promise((resolve) => {
    try {
      const tx = db.transaction('kv', 'readwrite');
      const p = tx.objectStore('kv').delete('sfx_audio_' + id);
      p.onsuccess = () => resolve();
      p.onerror = () => resolve();
    } catch (_) { resolve(); }
  });
}

function normalizeAudioReactionList(rawList) {
  if (!Array.isArray(rawList) || !rawList.length) {
    return DEFAULT_AUDIO_REACTIONS.map(x => ({ ...x }));
  }
  return rawList
    .filter(x => x && x.id && x.label)
    .map(x => ({
      id: String(x.id).replace(/[^a-zA-Z0-9_-]/g, ''),
      label: String(x.label).trim().slice(0, 40),
      builtin: String(x.builtin || ''),
      fileName: String(x.fileName || ''),
      hasCustomAudio: Boolean(x.hasCustomAudio),
      cloudDocId: String(x.cloudDocId || ''),
      updatedAt: Number(x.updatedAt || 0)
    }))
    .filter(x => x.id && x.label);
}

async function preloadCustomSfxAudio() {
  for (const item of AUDIO_REACTIONS) {
    if (!item.hasCustomAudio) continue;
    try {
      let localData = await idbGetSfxAudio(item.id);
      if (localData && typeof localData === 'object' && localData.dataUrl) {
        if (!item.updatedAt || (localData.updatedAt || 0) >= item.updatedAt) {
          SFX_AUDIO_CACHE[item.id] = localData.dataUrl;
          continue;
        }
      } else if (typeof localData === 'string' && localData.startsWith('data:audio')) {
        SFX_AUDIO_CACHE[item.id] = localData;
        if (!item.cloudDocId) continue;
      }
      if (item.cloudDocId) {
        const snap = await getDoc(doc(fs, 'pub', item.cloudDocId)).catch(() => null);
        if (snap && snap.exists() && snap.data().dataUrl) {
          const dUrl = snap.data().dataUrl;
          SFX_AUDIO_CACHE[item.id] = dUrl;
          await idbSetSfxAudio(item.id, { dataUrl: dUrl, updatedAt: item.updatedAt || Date.now() });
        }
      }
    } catch (_) {}
  }
}

function loadAudioReactionsFromConfig(cloudList) {
  let chosen = null;
  if (Array.isArray(cloudList) && cloudList.length) {
    chosen = normalizeAudioReactionList(cloudList);
    try { localStorage.setItem('sfh_audio_reactions_v1', JSON.stringify(chosen)); } catch (_) {}
  } else {
    try {
      const saved = JSON.parse(localStorage.getItem('sfh_audio_reactions_v1') || 'null');
      if (Array.isArray(saved) && saved.length) chosen = normalizeAudioReactionList(saved);
    } catch (_) {}
  }
  AUDIO_REACTIONS = chosen || DEFAULT_AUDIO_REACTIONS.map(x => ({ ...x }));
  preloadCustomSfxAudio();
}

async function persistAudioReactionsConfig() {
  try { localStorage.setItem('sfh_audio_reactions_v1', JSON.stringify(AUDIO_REACTIONS)); } catch (_) {}
  if (IS_SUPER) {
    try {
      await setDoc(doc(fs, 'config', 'app'), { audioReactions: AUDIO_REACTIONS }, { merge: true });
      if (CONF_CACHE) CONF_CACHE.audioReactions = AUDIO_REACTIONS.map(x => ({ ...x }));
    } catch (err) {
      console.warn('Could not sync audio reactions config to cloud:', err);
    }
  }
}

function getSfxCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!SFX_CTX) SFX_CTX = new AC();
  if (SFX_CTX.state === 'suspended') SFX_CTX.resume().catch(() => {});
  return SFX_CTX;
}

function updateSfxButtonStates(activeId) {
  SFX_CURRENT_ID = activeId || '';
  document.querySelectorAll('.sfx-btn').forEach(btn => {
    btn.classList.toggle('playing', btn.dataset.sfx === SFX_CURRENT_ID);
  });
}

window.stopAudioReaction = () => {
  SFX_ACTIVE_TIMERS.forEach(t => clearTimeout(t));
  SFX_ACTIVE_TIMERS = [];
  if (SFX_ACTIVE_AUDIO) {
    try {
      SFX_ACTIVE_AUDIO.pause();
      SFX_ACTIVE_AUDIO.currentTime = 0;
    } catch (_) {}
    SFX_ACTIVE_AUDIO = null;
  }
  SFX_ACTIVE_NODES.forEach(n => {
    try { if (typeof n.stop === 'function') n.stop(); } catch (_) {}
    try { if (typeof n.disconnect === 'function') n.disconnect(); } catch (_) {}
  });
  SFX_ACTIVE_NODES = [];
  SFX_MASTER_GAIN = null;
  updateSfxButtonStates('');
};

window.setReactionVolume = (val) => {
  const v = Math.max(0, Math.min(1, parseFloat(val) || 0.85));
  SFX_VOLUME = v;
  if (SFX_ACTIVE_AUDIO) {
    try { SFX_ACTIVE_AUDIO.volume = v; } catch (_) {}
  }
  if (SFX_MASTER_GAIN && SFX_CTX) {
    try { SFX_MASTER_GAIN.gain.setValueAtTime(v, SFX_CTX.currentTime); } catch (_) {}
  }
  const lbl = $('#sfx_vol_lbl');
  if (lbl) lbl.textContent = Math.round(v * 100) + '%';
};

function createNoiseBuffer(ctx, durationSec) {
  const len = Math.floor(ctx.sampleRate * durationSec);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

function scheduleSingleClap(ctx, master, startTime, gainLevel, freq = 1350, q = 1.6, decay = 0.11) {
  const src = ctx.createBufferSource();
  src.buffer = createNoiseBuffer(ctx, decay + 0.05);
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(freq, startTime);
  bp.Q.setValueAtTime(q, startTime);

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, startTime);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, gainLevel), startTime + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + decay);

  src.connect(bp);
  bp.connect(g);
  g.connect(master);
  src.start(startTime);
  src.stop(startTime + decay + 0.03);
  SFX_ACTIVE_NODES.push(src, bp, g);
}

function playBuiltInSynth(builtinKind, activeId) {
  const ctx = getSfxCtx();
  if (!ctx) return;

  const master = ctx.createGain();
  master.gain.setValueAtTime(SFX_VOLUME, ctx.currentTime);
  master.connect(ctx.destination);
  SFX_MASTER_GAIN = master;
  SFX_ACTIVE_NODES.push(master);
  updateSfxButtonStates(activeId);

  const now = ctx.currentTime + 0.02;
  let totalDurMs = 600;

  if (builtinKind === 'single_clap') {
    scheduleSingleClap(ctx, master, now, 0.95, 1300, 1.5, 0.13);
    scheduleSingleClap(ctx, master, now + 0.012, 0.45, 2200, 2.0, 0.08);
    totalDurMs = 300;
  } else if (builtinKind === 'double_clap') {
    [0, 0.22].forEach(off => {
      scheduleSingleClap(ctx, master, now + off, 0.9, 1320, 1.5, 0.12);
      scheduleSingleClap(ctx, master, now + off + 0.012, 0.4, 2150, 2.0, 0.08);
    });
    totalDurMs = 550;
  } else if (builtinKind === 'applause_low' || builtinKind === 'applause_high') {
    const isHigh = builtinKind === 'applause_high';
    const dur = isHigh ? 3.8 : 2.5;
    const clapCount = isHigh ? 135 : 58;
    const peakGain = isHigh ? 0.34 : 0.18;

    const bed = ctx.createBufferSource();
    bed.buffer = createNoiseBuffer(ctx, dur + 0.1);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(isHigh ? 1450 : 1150, now);
    bp.Q.setValueAtTime(0.85, now);
    const bedG = ctx.createGain();
    bedG.gain.setValueAtTime(0.0001, now);
    bedG.gain.linearRampToValueAtTime(isHigh ? 0.32 : 0.13, now + 0.35);
    bedG.gain.setValueAtTime(isHigh ? 0.30 : 0.12, now + dur * 0.65);
    bedG.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    bed.connect(bp);
    bp.connect(bedG);
    bedG.connect(master);
    bed.start(now);
    bed.stop(now + dur + 0.05);
    SFX_ACTIVE_NODES.push(bed, bp, bedG);

    for (let i = 0; i < clapCount; i++) {
      const u = Math.random();
      const t = now + u * (dur - 0.18);
      const env = u < 0.14 ? (u / 0.14) : (u > 0.72 ? Math.max(0.08, (1 - u) / 0.28) : 1);
      const freq = 950 + Math.random() * 1450;
      const lvl = peakGain * env * (0.45 + Math.random() * 0.65);
      scheduleSingleClap(ctx, master, t, lvl, freq, 1.3 + Math.random() * 1.1, 0.075 + Math.random() * 0.055);
    }
    totalDurMs = Math.ceil(dur * 1000) + 120;
  } else if (builtinKind === 'drum_roll') {
    const dur = 2.6;
    const hits = 44;
    for (let i = 0; i < hits; i++) {
      const progress = i / (hits - 1);
      const t = now + progress * (dur - 0.35);
      const vol = 0.12 + progress * 0.62;
      scheduleSingleClap(ctx, master, t, vol, 260 + progress * 240, 1.2, 0.065);
      scheduleSingleClap(ctx, master, t, vol * 0.45, 2200, 1.8, 0.05);
    }
    const crashT = now + dur - 0.32;
    const crash = ctx.createBufferSource();
    crash.buffer = createNoiseBuffer(ctx, 1.1);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(3200, crashT);
    const cg = ctx.createGain();
    cg.gain.setValueAtTime(0.55, crashT);
    cg.gain.exponentialRampToValueAtTime(0.0001, crashT + 1.0);
    crash.connect(hp);
    hp.connect(cg);
    cg.connect(master);
    crash.start(crashT);
    crash.stop(crashT + 1.05);
    SFX_ACTIVE_NODES.push(crash, hp, cg);
    totalDurMs = Math.ceil((dur + 0.8) * 1000);
  } else if (builtinKind === 'fanfare') {
    const notes = [
      { f: 523.25, t: 0.00, d: 0.16 },
      { f: 659.25, t: 0.14, d: 0.16 },
      { f: 783.99, t: 0.28, d: 0.18 },
      { f: 1046.5, t: 0.44, d: 1.15 },
      { f: 783.99, t: 0.44, d: 1.15 },
      { f: 659.25, t: 0.44, d: 1.15 },
    ];
    notes.forEach(n => {
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n.f, now + n.t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now + n.t);
      g.gain.linearRampToValueAtTime(0.24, now + n.t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
      osc.connect(g);
      g.connect(master);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d + 0.04);
      SFX_ACTIVE_NODES.push(osc, g);
    });
    totalDurMs = 1700;
  }

  const endTimer = setTimeout(() => {
    if (SFX_CURRENT_ID === activeId) updateSfxButtonStates('');
  }, totalDurMs);
  SFX_ACTIVE_TIMERS.push(endTimer);
}

function playDataUrlAudio(dataUrl, reactionId, fallbackBuiltin) {
  try {
    const audio = new Audio(dataUrl);
    audio.volume = SFX_VOLUME;
    SFX_ACTIVE_AUDIO = audio;
    updateSfxButtonStates(reactionId);
    audio.onended = () => {
      if (SFX_ACTIVE_AUDIO === audio) SFX_ACTIVE_AUDIO = null;
      if (SFX_CURRENT_ID === reactionId) updateSfxButtonStates('');
    };
    audio.onerror = () => {
      if (SFX_ACTIVE_AUDIO === audio) SFX_ACTIVE_AUDIO = null;
      if (fallbackBuiltin) playBuiltInSynth(fallbackBuiltin, reactionId);
      else updateSfxButtonStates('');
    };
    const p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(() => {
        if (SFX_ACTIVE_AUDIO === audio) SFX_ACTIVE_AUDIO = null;
        if (fallbackBuiltin) playBuiltInSynth(fallbackBuiltin, reactionId);
        else updateSfxButtonStates('');
      });
    }
    return true;
  } catch (_) {
    return false;
  }
}

window.playAudioReaction = async (id) => {
  if (!IS_ADMIN && !IS_SUPER) return;
  const item = AUDIO_REACTIONS.find(x => x.id === id);
  if (!item) return;
  window.stopAudioReaction();

  if (item.hasCustomAudio) {
    let dataUrl = SFX_AUDIO_CACHE[item.id];
    if (!dataUrl) {
      const localData = await idbGetSfxAudio(item.id);
      if (localData && typeof localData === 'object' && localData.dataUrl) dataUrl = localData.dataUrl;
      else if (typeof localData === 'string') dataUrl = localData;
    }
    if (!dataUrl && item.cloudDocId) {
      try {
        const snap = await getDoc(doc(fs, 'pub', item.cloudDocId));
        if (snap.exists() && snap.data().dataUrl) {
          dataUrl = snap.data().dataUrl;
          await idbSetSfxAudio(item.id, { dataUrl, updatedAt: item.updatedAt || Date.now() });
        }
      } catch (_) {}
    }
    if (dataUrl) {
      SFX_AUDIO_CACHE[item.id] = dataUrl;
      if (playDataUrlAudio(dataUrl, item.id, item.builtin)) return;
    }
  }

  if (item.builtin) {
    playBuiltInSynth(item.builtin, item.id);
  } else {
    showNotice(`No MP3 sound uploaded yet for "${item.label}". Open Customize to upload an MP3 file.`);
  }
};

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(new Error('Failed to read MP3 file.'));
    reader.readAsDataURL(file);
  });
}

window.sfxUpdateLabel = async (id, val) => {
  if (!IS_SUPER) return;
  const item = AUDIO_REACTIONS.find(x => x.id === id);
  if (!item) return;
  const clean = String(val || '').trim().slice(0, 40);
  if (!clean) return;
  item.label = clean;
  await persistAudioReactionsConfig();
  draw();
};

window.sfxTriggerMp3Picker = (id) => {
  if (!IS_SUPER) return;
  const inp = document.getElementById('sfx_file_' + id);
  if (inp) {
    inp.value = '';
    inp.click();
  }
};

window.sfxUploadMp3 = async (id, fileInput) => {
  if (!IS_SUPER) return;
  const file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) return;
  const item = AUDIO_REACTIONS.find(x => x.id === id);
  if (!item) return;

  if (file.size > 5 * 1024 * 1024) {
    showNotice('MP3 file is too large (max 5 MB). Please choose a shorter audio clip.');
    return;
  }

  const statusEl = $('#sfx_cfg_status');
  if (statusEl) {
    statusEl.style.color = 'var(--ac)';
    statusEl.textContent = `Uploading "${file.name}"…`;
  }

  try {
    const dataUrl = await readFileAsDataUrl(file);
    const nowTs = Date.now();
    SFX_AUDIO_CACHE[id] = dataUrl;
    await idbSetSfxAudio(id, { dataUrl, updatedAt: nowTs });

    let syncedToCloud = false;
    const cloudDocId = 'sfx_' + id;
    if (dataUrl.length <= 920000) {
      try {
        await setDoc(doc(fs, 'pub', cloudDocId), {
          id,
          fileName: file.name,
          dataUrl,
          updatedAt: nowTs
        });
        syncedToCloud = true;
      } catch (cloudErr) {
        console.warn('Cloud MP3 sync warning:', cloudErr);
      }
    }

    item.hasCustomAudio = true;
    item.fileName = file.name;
    item.cloudDocId = syncedToCloud ? cloudDocId : '';
    item.updatedAt = nowTs;
    await persistAudioReactionsConfig();
    draw();
    window.openAudioReactionsCustomizer(
      syncedToCloud
        ? `✓ Uploaded "${file.name}" and synced to all Admin devices.`
        : `✓ Uploaded "${file.name}" on this device (keep MP3 under ~650 KB to sync to other devices).`
    );
  } catch (err) {
    if (statusEl) {
      statusEl.style.color = '#dc2626';
      statusEl.textContent = err?.message || 'Could not upload MP3 file.';
    }
  }
};

window.sfxRevertDefault = async (id) => {
  if (!IS_SUPER) return;
  const item = AUDIO_REACTIONS.find(x => x.id === id);
  if (!item) return;
  delete SFX_AUDIO_CACHE[id];
  await idbDelSfxAudio(id);
  if (item.cloudDocId) {
    try {
      await setDoc(doc(fs, 'pub', item.cloudDocId), { id, dataUrl: '', fileName: '', updatedAt: Date.now() });
    } catch (_) {}
  }
  item.hasCustomAudio = false;
  item.fileName = '';
  item.cloudDocId = '';
  item.updatedAt = Date.now();
  await persistAudioReactionsConfig();
  draw();
  window.openAudioReactionsCustomizer(`✓ Reverted "${item.label}" to default built-in sound.`);
};

window.sfxRemoveButton = async (id) => {
  if (!IS_SUPER) return;
  if (AUDIO_REACTIONS.length <= 1) {
    showNotice('Keep at least one audio reaction button.');
    return;
  }
  const idx = AUDIO_REACTIONS.findIndex(x => x.id === id);
  if (idx === -1) return;
  const removed = AUDIO_REACTIONS[idx];
  AUDIO_REACTIONS.splice(idx, 1);
  delete SFX_AUDIO_CACHE[id];
  await idbDelSfxAudio(id);
  await persistAudioReactionsConfig();
  draw();
  window.openAudioReactionsCustomizer(`Removed "${removed.label}".`);
};

window.sfxAddCustomButton = async () => {
  if (!IS_SUPER) return;
  const lblInp = $('#sfx_new_label');
  const fileInp = $('#sfx_new_file');
  const label = (lblInp ? lblInp.value : '').trim().slice(0, 40);
  const file = fileInp && fileInp.files && fileInp.files[0];
  if (!label) {
    const st = $('#sfx_cfg_status');
    if (st) { st.style.color = '#d97706'; st.textContent = 'Enter a button label first (e.g. 🎶 Wah Wah!).'; }
    return;
  }
  if (!file) {
    const st = $('#sfx_cfg_status');
    if (st) { st.style.color = '#d97706'; st.textContent = 'Please select an MP3 sound file for the new button.'; }
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    const st = $('#sfx_cfg_status');
    if (st) { st.style.color = '#dc2626'; st.textContent = 'MP3 file is too large (max 5 MB).'; }
    return;
  }
  const id = 'custom_' + Date.now();
  const newItem = { id, label, builtin: '', fileName: '', hasCustomAudio: false, cloudDocId: '', updatedAt: Date.now() };
  AUDIO_REACTIONS.push(newItem);
  await window.sfxUploadMp3(id, fileInp);
};

window.sfxResetAllDefaults = () => {
  if (!IS_SUPER) return;
  showConfirm('Reset all Audio Reaction buttons back to the 6 default built-in sounds?', async () => {
    for (const item of AUDIO_REACTIONS) {

      await idbDelSfxAudio(item.id);

    draw();

  }, 'Reset Audio Reactions');
};

    <div class="row" style="justify-content:space-between">
      <div>
        <h2>${onlineNow ? (IS_HOST ? 'Host Live Session' : 'Live Session') : 'Offline Practice Console'} · ${fd(LIVE.date)}</h2>
        <span class="m" style="font-size:12px">Schedule: <b>${e(formatScheduleText())}</b> · ${onlineNow ? 'Online (Session Time)' : 'Offline (Out of Session Time)'}</span>
      </div>
      <div class="row" style="gap:6px">
        <span class="${onlineNow ? 'badge-ok' : 'badge-late'}">${onlineNow ? 'ONLINE' : 'OFFLINE'}</span>
        <span class="badge-round">Round ${currentRound}</span>
      </div>
    </div>
    <div class="f" style="margin-top:8px">
      <label style="flex:1;min-width:160px;font-size:11.5px;font-weight:700;color:var(--mut)">Theme
        <input id="in_theme" value="${e(LIVE.theme || '')}" placeholder="${IS_HOST ? "Decide today's Session Theme (e.g. Golden Retro)" : 'Enter Session Theme (e.g. Golden Retro)'}" oninput="setSessionThemeHost('theme', this.value)" style="width:100%;margin-top:2px">
      </label>
      <label style="flex:1;min-width:160px;font-size:11.5px;font-weight:700;color:var(--mut)">Host${IS_HOST ? ' (Assigned)' : ''}
        <input id="in_host" ${IS_HOST ? 'readonly' : 'list="dl_known"'} value="${e(LIVE.host || '')}" placeholder="Enter Host Name (Default #1: MANOJ TIKARIYA)" ${IS_HOST ? '' : `oninput="setSessionThemeHost('host', this.value)" onchange="applyHostFirstPosition()" onblur="applyHostFirstPosition()"`} style="width:100%;margin-top:2px;text-transform:uppercase${IS_HOST ? ';opacity:0.85;cursor:not-allowed' : ''}">
      </label>
    </div>
    <div class="f" style="margin-top:8px">
      <input id="in_singer" list="dl_known" placeholder="Enter Singer Name" style="text-transform:uppercase;flex:2">
      <input id="in_singer_time" type="time" value="${to24HourInput('')}" oninput="onManualTimeInput()" onchange="onManualTimeInput()" title="Synced to live system clock (edit to set custom time)" style="max-width:125px">
      <datalist id="dl_known">
        ${KNOWN_SINGERS.map(s => `<option value="${e(s)}">`).join('')}
      </datalist>
      <button class="pri" onclick="addSinger()">Add</button>
    </div>
  </div>`;

  if (IS_ADMIN || IS_SUPER) {
    h += `<div class="c">
      <div class="row" style="justify-content:space-between">
        <b style="font-size:13.5px">🔊 Audio Reactions</b>
        <div class="row" style="gap:8px">
          <label style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut);font-weight:700">
            Vol <input type="range" min="0.1" max="1" step="0.05" value="${SFX_VOLUME}" oninput="setReactionVolume(this.value)" style="width:72px;padding:0;accent-color:var(--ac)">
            <span id="sfx_vol_lbl" style="min-width:30px;text-align:right">${Math.round(SFX_VOLUME * 100)}%</span>
          </label>
          ${IS_SUPER ? `<button style="padding:3px 8px;font-size:11.5px" onclick="openAudioReactionsCustomizer()" title="Customize reaction buttons & upload MP3 sounds">⚙️ Customize</button>` : ''}
        </div>
      </div>
      <div class="sfx-grid">
        ${AUDIO_REACTIONS.map(item => `
          <button class="sfx-btn ${item.hasCustomAudio ? 'custom-mp3' : ''} ${SFX_CURRENT_ID === item.id ? 'playing' : ''}" data-sfx="${e(item.id)}" onclick="playAudioReaction('${e(item.id)}')" title="${item.hasCustomAudio ? 'Custom MP3: ' + e(item.fileName || 'Uploaded') : 'Default sound'}">${e(item.label)}${item.hasCustomAudio ? ' <span style="font-size:10px;opacity:0.75">🎵</span>' : ''}</button>
        `).join('')}
        <button class="sfx-stop" onclick="stopAudioReaction()">⏹ Stop</button>
      </div>
    </div>`;
  }

  const reservedFirst = getReservedFirstSinger();
  const prevSotdMeta = getPreviousSessionSotdInfo();

  h += `<div class="c">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <b>Singing Order & Performance Sheet</b>
      <div class="row">
        <button class="${currentRound===1?'on':''}" onclick="setRound(1)" title="Round 1">1</button>
        <button class="${currentRound===2?'on':''}" onclick="setRound(2)" title="Round 2">2</button>
        <button class="${currentRound===3?'on':''}" onclick="setRound(3)" title="Round 3">3</button>
      </div>
    </div>

    ${LIVE.singers.length ? `
      <div class="tbl"><table>
        <tr>
          <th class="col-src" title="Z = Zoom, M = Manual">Src</th>
          <th class="col-ord">#</th>
          <th>Singer</th>
          <th>Time</th>
          <th class="n">Status</th>
          <th title="Song Title (Round ${currentRound})">Song</th>
          <th>ID</th>
          ${IS_SUPER ? `<th style="min-width:155px" title="5-Star Scoring (Max ${getMaxStarPoints()} pts)">Stars</th>` : ''}
          <th style="text-align:center">Action</th>
        </tr>
        ${LIVE.singers.map((s, idx) => {
          const p = getOrCreatePerf(s.name, currentRound);
          const sKey = currentRound + '_' + s.name.replace(/[^a-zA-Z0-9]/g, '_');
          const safeSinger = e(s.name).replace(/'/g, "\\'");
          const isEligible = s.eligible;
          const isPrevSotd = prevSotdMeta.winners.has(canonSinger(s.name));
          const isHostFirst = idx === 0 && canonSinger(s.name) === reservedFirst;
          const pts = calcStarPoints(p.stars);
          const hasMeta = hasMetaFields(p.meta);
          const isAiLoading = !!AUTO_META_INFLIGHT[sKey];
          const lateTip = !isEligible ? `Late ${s.joinTime || ''}`.trim() : '';

          return `<tr>
            <td class="col-src">${s.viaZoomBtn ? `<span class="badge-src-z" title="Auto-queued via Start Zoom">Z</span>` : `<span class="badge-src-m" title="${isHostFirst ? 'Reserved Position #1 (Host / MANOJ TIKARIYA)' : 'Manually entered'}">${isHostFirst ? 'H' : 'M'}</span>`}</td>
            <td class="col-ord"><b>${idx + 1}</b></td>
            <td><b class="${!isEligible ? 'singer-late' : ''}"${lateTip ? ` title="${e(lateTip)}"` : ''}>${e(s.name)}</b>${isHostFirst ? `<span class="badge-ok" style="font-size:10px;padding:1px 5px;margin-left:5px" title="Position #1 reserved for Host / MANOJ TIKARIYA">Host #1</span>` : ''}</td>
            <td><input type="time" value="${to24HourInput(s.joinTime)}" onchange="updateSingerJoinTime(${idx}, this.value)" style="padding:3px 5px;font-size:12px;width:105px" title="Click to edit arrival time"></td>
            <td class="n">${isPrevSotd ? `<span class="badge-late" title="Won SOTD on ${e(fd(prevSotdMeta.date))} — no repeat today">Prev SOTD</span>` : (isEligible ? '<span class="badge-st-e" title="SOTD Eligible">E</span>' : `<span class="badge-st-i" title="Late ${e(s.joinTime || '')} (&gt;${formatCutoffTime()})">I</span>`)}</td>
            <td>
              <div style="display:flex;align-items:center;white-space:nowrap">
                <div class="song-ac-wrap">
                  <input id="sg_${sKey}" autocomplete="off" value="${e(p.song || '')}" placeholder="Type song..." style="width:195px;text-transform:uppercase" oninput="onSongInput('${safeSinger}', ${currentRound}, true)" onfocus="onSongInput('${safeSinger}', ${currentRound}, true)" onblur="onSongBlur('${safeSinger}', ${currentRound})" onkeydown="if(event.key==='Escape')closeAllSongDropdowns();if(event.key==='Enter'){closeAllSongDropdowns();onSongBlur('${safeSinger}', ${currentRound});}">
                </div>
                <button id="ai_btn_${sKey}" class="btn-meta ${isAiLoading ? 'loading' : (hasMeta ? 'filled' : '')}" style="margin-left:6px" onclick="openMeta('${safeSinger}', ${currentRound})" title="${e(formatMetaTooltip(p.meta))}">${isAiLoading ? 'AI…' : 'AI'}</button>
              </div>
            </td>
            <td id="id_${sKey}">
              ${p.song ? `<b>${p.songId}</b>` : '<span class="m">-</span>'}
            </td>
            ${IS_SUPER ? `<td>
              <div class="score-box" title="★1: Ready (1pt) | ★2: <=30s (1pt) | ★3: Clean (1pt) [★1+2=4, ★2+3=4.5, ★1+3=5, ★1+2+3=6] | ★4: Good (1pt) | ★5: Better (2pts) [★4+5=5]">
                ${[0,1,2,3,4].map(sIdx => `<span id="star_${sKey}_${sIdx}" class="score-star ${p.stars[sIdx]?'active':''}" onclick="toggleStar('${safeSinger}', ${currentRound}, ${sIdx})">★</span>`).join('')}
              </div>
              <span id="score_txt_${sKey}" class="m" style="font-size:11px;margin-left:4px">(${pts} pts)</span>
            </td>` : ''}
            <td style="text-align:center">
              <button onclick="removeSinger(${idx})" title="Remove singer from queue" style="padding:3px 9px;font-weight:700">R</button>
            </td>
          </tr>`;
        }).join('')}
      </table></div>
    ` : `<p class="m">Waiting for singers to tap Start Zoom in the app, or add singers manually above.</p>`}
    
    
  </div>`;

  h += `<div class="c" id="sotd_section_card">${renderSOTDHTML()}</div>`;

  // Always-On SOTM Judge Panel & 30s Blind Voting Card (Superadmin Only)
  if (IS_SUPER) {
    h += `<div class="c" id="sotm_always_on_panel">${renderSOTMPanelHTML()}</div>`;
  }

  if (IS_SUPER) {
    h += `<div class="c">
      <b>5-Star Point & Bonus Logic Reference (Superadmin Only)</b>
      <div class="m" style="margin-top:4px;line-height:1.6">
        • <b>★1 Ready on Turn:</b> ${STAR_SCORING.s1} pt &nbsp;|&nbsp; <b>★2 Start ≤ 30 sec:</b> ${STAR_SCORING.s2} pt &nbsp;|&nbsp; <b>★3 Cleanliness (No Noise):</b> ${STAR_SCORING.s3} pt<br>
        • <b>Group A Combos:</b> <b>★1+★2 = ${STAR_SCORING.s1+STAR_SCORING.s2+STAR_SCORING.b12} pts</b> (+${STAR_SCORING.b12}) &nbsp;|&nbsp; <b>★2+★3 = ${STAR_SCORING.s2+STAR_SCORING.s3+STAR_SCORING.b23} pts</b> (+${STAR_SCORING.b23}) &nbsp;|&nbsp; <b>★1+★3 = ${STAR_SCORING.s1+STAR_SCORING.s3+STAR_SCORING.b13} pts</b> (+${STAR_SCORING.b13}) &nbsp;|&nbsp; <b>★1+★2+★3 = ${STAR_SCORING.s1+STAR_SCORING.s2+STAR_SCORING.s3+STAR_SCORING.b123} pts</b> (+${STAR_SCORING.b123})<br>
        • <b>★4 Good Singing:</b> ${STAR_SCORING.s4} pt &nbsp;|&nbsp; <b>★5 Better Singing:</b> ${STAR_SCORING.s5} pts &nbsp;→&nbsp; <b>★4+★5 = ${STAR_SCORING.s4+STAR_SCORING.s5+STAR_SCORING.b45} pts</b> (+${STAR_SCORING.b45})
      </div>
    </div>`;
  }

  $('#app').innerHTML = h;
  if (PARTICIPANT_PREVIEW_OPEN) {
    renderLiveParticipantPreview();
  }
}
</script></body></html>
