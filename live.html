// ==============================================================================
// NEW 5-STAR POINT & BONUS LOGIC:
// Star 1: Ready On Turn = 1 pt
// Star 2: Starting song within <= 30 sec = 1 pt
//         -> Star 1 + Star 2 = 1 + 1 + 2 bonus = 4 pts
// Star 3: Cleanliness (No Noise) = 1 pt
//         -> Star 1 + Star 2 + Star 3 = 1 + 1 + 1 + 3 bonus = 6 pts
// Star 4: Good Singing = 1 pt
// Star 5: Better Singing = 2 pts
//         -> Star 4 + Star 5 = 1 + 2 + 2 bonus = 5 pts
// Total combined = (Group A: Readiness/Timing/Cleanliness up to 6 pts) + (Group B: Singing Quality up to 5 pts) = max 11 pts
// ==============================================================================
let STAR_SCORING = {
  s1: 1, s2: 1, s3: 1, s4: 1, s5: 2,
  b12: 2, b23: 2.5, b13: 3, b123: 3, b45: 2
};

function getMaxStarPoints() {
  const sc = STAR_SCORING;
  const maxA = Math.max(
    sc.s1, sc.s2, sc.s3,
    sc.s1 + sc.s2 + sc.b12,
    sc.s2 + sc.s3 + sc.b23,
    sc.s1 + sc.s3 + sc.b13,
    sc.s1 + sc.s2 + sc.s3 + sc.b123
  );
  const maxB = Math.max(sc.s4, sc.s5, sc.s4 + sc.s5 + sc.b45);
  return parseFloat((maxA + maxB).toFixed(2));
}

function calcStarPoints(stars) {
  const s = Array.isArray(stars) ? stars : [false, false, false, false, false];
  const s1 = !!s[0], s2 = !!s[1], s3 = !!s[2], s4 = !!s[3], s5 = !!s[4];
  const sc = STAR_SCORING;

  let groupA = (s1 ? sc.s1 : 0) + (s2 ? sc.s2 : 0) + (s3 ? sc.s3 : 0);
  if (s1 && s2 && s3) {
    groupA += sc.b123;
  } else if (s1 && s3) {
    groupA += sc.b13;
  } else if (s2 && s3) {
    groupA += sc.b23;
  } else if (s1 && s2) {
    groupA += sc.b12;
  }

  let groupB = (s4 ? sc.s4 : 0) + (s5 ? sc.s5 : 0);
  if (s4 && s5) {
    groupB += sc.b45;
  }

  return parseFloat((groupA + groupB).toFixed(2));
}

// Schedule evaluation
let SCHEDULE = { days: [1,2,3,4,5], startTime: "20:30", endTime: "23:30", cutoffMins: 15, forceLiveOverride: false };
let lastScheduleMode = null;

function isWithinLiveSchedule(now = new Date()) {
  if (SCHEDULE.forceLiveOverride) return true;
  const day = now.getDay();
  if (!SCHEDULE.days.includes(day)) return false;
  const [sh, sm] = (SCHEDULE.startTime || "20:30").split(':').map(Number);
  const [eh, em] = (SCHEDULE.endTime || "23:30").split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const startMins = sh * 60 + sm;
  const endMins = eh * 60 + em;
  return curMins >= startMins && curMins <= endMins;
}

function isBeforeCutoff(now = new Date()) {
  if (SCHEDULE.forceLiveOverride) return true;
  const [sh, sm] = (SCHEDULE.startTime || "20:30").split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const cutoffLimit = sh * 60 + sm + (SCHEDULE.cutoffMins ?? 15);
  return curMins <= cutoffLimit;
}

function formatCutoffTime() {
  const [sh, sm] = (SCHEDULE.startTime || "20:20").split(':').map(Number);
  const totalMins = sh * 60 + sm + (SCHEDULE.cutoffMins ?? 26);
  const hh = Math.floor(totalMins / 60) % 24;
  const mm = totalMins % 60;
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 || 12;
  return `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
}
function formatScheduleText() {
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const sortedDays = [...SCHEDULE.days].sort();
  let dayLabel = sortedDays.map(d => dayNames[d]).join(', ');
  if (JSON.stringify(sortedDays) === JSON.stringify([1,2,3,4,5])) dayLabel = 'Mon–Fri';
  const [hh, mm] = SCHEDULE.startTime.split(':').map(Number);
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 || 12;
  return `${dayLabel} ${h12}:${String(mm).padStart(2,'0')} ${ampm} onwards`;
}

    });

}

async function getBackupDirHandleFromIDB() {
  try {
    return await new Promise((resolve) => {
      const req = indexedDB.open('sfh_settings_db', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => {
        const db = req.result;
        const tx = db.transaction('kv', 'readonly');
        const g = tx.objectStore('kv').get('backupDirHandle');
        g.onsuccess = () => resolve(g.result || null);
        g.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

function resolveCanonicalSingerName(rawName) {
  const clean = (rawName || '').trim().toUpperCase();
  if (!clean) return '';
  if (KNOWN_SINGERS.includes(clean)) return clean;
  const prefixMatches = KNOWN_SINGERS.filter(k => k.startsWith(clean + ' '));
  if (prefixMatches.length === 1) return prefixMatches[0];
  return clean;
}

let syncTimer = null;
let SESSION_ENDED = false;
function syncToFirestore() {
  if (SESSION_ENDED) return;
  if (!isWithinLiveSchedule() && LIVE.singers.length === 0) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    if (SESSION_ENDED) return;
    try {
      await setDoc(doc(fs, 'live', 'session'), {
        date: LIVE.date,
        currentRound: currentRound,
        singers: LIVE.singers,
        performances: LIVE.performances,
        sotdList: SOTD_LIST,
        sotdVote: SOTD_30S_VOTE && SOTD_30S_VOTE.active ? {
          active: true,

          song: SOTD_30S_VOTE.song,
          endsAt: SOTD_30S_VOTE.endsAt || (Date.now() + SOTD_30S_VOTE.remaining * 1000)
        } : null,
        sotmVote: SOTM_PANEL && SOTM_PANEL.activeBlindVote ? {
          active: true,
          singer: SOTM_PANEL.activeBlindVote.singer,
          endsAt: SOTM_PANEL.activeBlindVote.endsAt || (Date.now() + SOTM_PANEL.activeBlindVote.remaining * 1000)
        } : null,
        updatedAt: Date.now(),
        active: true

    } catch (err) {
      console.warn('Live cloud sync warning:', err);
    }
  }, 120);
}

function saveLocal(){

// Real-Time Listener for Singers Entering via "Start Zoom" Button on App
let zoomEntriesUnsub = null;
let plansEntriesUnsub = null;
function mergeZoomEntryIntoQueue(singerRaw, entryTime, eligible, tsVal) {
  const canonical = resolveCanonicalSingerName(singerRaw);
  if (!canonical) return false;
  if (!LIVE.singers.some(s => s.name === canonical)) {
    LIVE.singers.push({
      name: canonical,
      joinTime: entryTime || curTime(),
      eligible: eligible !== false,
      viaZoomBtn: true,
      _ts: tsVal || Date.now()
    });
    getOrCreatePerf(canonical, 1);
    getOrCreatePerf(canonical, 2);
    getOrCreatePerf(canonical, 3);
    return true;
  }
  return false;
}

function tallyLivePlanBallots(planDocs) {
  // Tally 30s SOTD ballots from participants/judges
  if (SOTD_30S_VOTE && SOTD_30S_VOTE.singer) {
    const remoteScores = [];
    planDocs.forEach(d => {
      const b = d.sotdBallots && d.sotdBallots[SOTD_30S_VOTE.singer];
      if (b && typeof b.score === 'number') remoteScores.push(b.score);
    });
    SOTD_30S_VOTE.remoteVotes = remoteScores;
    drawSOTDSection();
  }
  // Tally 30s SOTM blind ballots if active or configured
  if (SOTM_PANEL && Array.isArray(SOTM_PANEL.finalists)) {
    const voterSet = new Set();
    const sumBySinger = {};
    planDocs.forEach(d => {
      if (d.sotmBallots && typeof d.sotmBallots === 'object') {
        Object.entries(d.sotmBallots).forEach(([target, b]) => {
          if (b && typeof b.score === 'number') {
            voterSet.add(b.uid || b.voter || d.uid);
            sumBySinger[target] = (sumBySinger[target] || 0) + b.score;
          }
        });
      }
    });
    if (voterSet.size > 0) {
      SOTM_PANEL.votersCount = voterSet.size;
      SOTM_PANEL.finalists.forEach(f => {
        if (sumBySinger[f.name] !== undefined) f.audience = sumBySinger[f.name];
      });
      drawSOTMPanel();
    }
  }
}

async function listenToZoomButtonEntries() {
  if (zoomEntriesUnsub) { zoomEntriesUnsub(); zoomEntriesUnsub = null; }
  if (plansEntriesUnsub) { plansEntriesUnsub(); plansEntriesUnsub = null; }

  const qPlans = query(collection(fs, 'plans'), where('date', '==', LIVE.date));
  const qZoom = query(collection(fs, 'zoom_entries'), where('date', '==', LIVE.date));

  // Immediate one-time fetch so entries pressed before live.html opened appear right away
  try {
    const [pSnap, zSnap] = await Promise.all([getDocs(qPlans), getDocs(qZoom).catch(() => ({ docs: [] }))]);
    const combined = [];
    pSnap.docs.forEach(docSnap => {
      const d = docSnap.data();
      if (d.zoomEntered && d.singer) {
        combined.push({ singer: d.singer, entryTime: d.zoomEntryTime, eligible: d.zoomEligible, ts: d.zoomTs || d.ts || 0 });
      }
    });
    zSnap.docs.forEach(docSnap => {
      const d = docSnap.data();
      if (d.singer) {
        combined.push({ singer: d.singer, entryTime: d.entryTime, eligible: d.eligible, ts: d.ts || 0 });
      }
    });
    combined.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    let changed = false;
    combined.forEach(ent => {
      if (mergeZoomEntryIntoQueue(ent.singer, ent.entryTime, ent.eligible, ent.ts)) changed = true;
    });
    if (changed) { saveLocal(); draw(); }
  } catch (initZErr) {}

  plansEntriesUnsub = onSnapshot(qPlans, snap => {
    const docsData = snap.docs.map(d => d.data());
    const zoomDocs = docsData.filter(d => d.zoomEntered && d.singer).sort((a, b) => (a.zoomTs || a.ts || 0) - (b.zoomTs || b.ts || 0));
    let changed = false;
    zoomDocs.forEach(ent => {
      if (mergeZoomEntryIntoQueue(ent.singer, ent.zoomEntryTime, ent.zoomEligible, ent.zoomTs || ent.ts)) changed = true;
    });
    if (changed) { saveLocal(); draw(); }
    tallyLivePlanBallots(docsData);
  }, err => console.warn('Plans auto-queue listener:', err));

  zoomEntriesUnsub = onSnapshot(qZoom, snap => {
    const entries = snap.docs.map(d => d.data()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    let changed = false;
    entries.forEach(ent => {
      if (mergeZoomEntryIntoQueue(ent.singer, ent.entryTime, ent.eligible, ent.ts)) changed = true;
    });
    if (changed) { saveLocal(); draw(); }
  }, () => {});
}

async function init(){
  try {
    const cfgSnap = await getDoc(doc(fs, 'config', 'app'));
    if (cfgSnap.exists()) {
      CONF_CACHE = cfgSnap.data();
      if (CONF_CACHE.schedule) {
        SCHEDULE = { ...SCHEDULE, ...CONF_CACHE.schedule };
      }
      if (CONF_CACHE.starScoring) {
        STAR_SCORING = { ...STAR_SCORING, ...CONF_CACHE.starScoring };
      }
    }
  } catch (ce) {}

  lastScheduleMode = isWithinLiveSchedule();
  LIVE = { date: tdy(), singers: [], performances: [] };
  SOTD_LIST = [];
  currentRound = 1;
  loadLocal();

  try {
    const pubData = await getDoc(doc(fs, 'pub', 'data'));
    if(pubData.exists()){
      PUB_CACHE = pubData.data();
      KNOWN_SINGERS = PUB_CACHE.singers || [];
    }
  } catch(e) {}

  // Load saved SOTM Judge Panel state if present in Firestore
  try {
    const sotmPanelSnap = await getDoc(doc(fs, 'vote', 'sotm_panel'));
    if (sotmPanelSnap.exists()) {
      SOTM_PANEL = { ...SOTM_PANEL, ...sotmPanelSnap.data() };
    }
  } catch (pe) {}

  try {
    const ix = await getDoc(doc(fs, 'pub', 'idx'));
    if(ix.exists()){
      const ms = Object.keys(ix.data().months || {}).sort();
      const ds = await Promise.all(ms.map(m => getDoc(doc(fs, 'pub', 'songs_' + m))));
      ALL_SONGS = [].concat(...ds.map(d => d.exists() ? JSON.parse(d.data().json || '[]') : []));
    } else {
      const b = await getDoc(doc(fs, 'pub', 'songs'));
      if(b.exists()){
        ALL_SONGS = b.data().json ? JSON.parse(b.data().json) : (b.data().list || []);
      }
    }
    const existingIds = new Set(ALL_SONGS.map(r => r[0]));
    NOV16_SONGS.forEach(row => {
      if (!existingIds.has(row[0])) ALL_SONGS.push(row);
    });
    ALL_SONGS.sort(cmpBySongId);

    MAX_ID_NUM = 0;
    ALL_SONGS.forEach(r => {
      let num = parseSongNum(r[0]);
      if(num > 143 && String(r[0]).includes('0144')) num = 143;
      if(num > MAX_ID_NUM) MAX_ID_NUM = num;
    });
  } catch(x) {}

  // Only restore today's published songs into queue if live/session was NOT explicitly ended
  let wasExplicitlyEnded = false;
  try {
    const liveSessSnap = await getDoc(doc(fs, 'live', 'session'));
    if (liveSessSnap.exists() && liveSessSnap.data().date === LIVE.date && liveSessSnap.data().endedAt) {
      wasExplicitlyEnded = true;
    }
  } catch (_le) {}

  if (isWithinLiveSchedule() && !wasExplicitlyEnded) {
    const todayPubSongs = ALL_SONGS.filter(r => r[1] === LIVE.date);
    todayPubSongs.forEach(r => {
      const [sId, dt, sName, sTitle] = r;
      if (!LIVE.singers.some(s => s.name === sName)) {
        LIVE.singers.push({ name: sName, joinTime: 'Queued', eligible: true });
      }
      let existing = LIVE.performances.find(p => p.songId === sId);
      if (!existing) {
        LIVE.performances.push({
          round: 1,
          singer: sName,
          song: sTitle,
          songId: sId,
          stars: [false, false, false, false, false],
          repeatCount: Math.max(0, checkRepeat(sTitle) - 1),
          meta: {}
        });
      }
    });
  }

  listenToZoomButtonEntries();
  draw();
}

function getNextSongId(){
  if (!isWithinLiveSchedule()) {
    PRACTICE_COUNTER++;
    return 'P-' + String(PRACTICE_COUNTER).padStart(4, '0');
  }
  let highest = MAX_ID_NUM;
  ALL_SONGS.forEach(r => {
    const num = parseSongNum(r[0]);
    if(num > highest) highest = num;
  });
  LIVE.performances.forEach(p => {
    const num = parseSongNum(p.songId);
    if(num > highest) highest = num;
  });
  return 'S-' + String(highest + 1).padStart(4, '0');
}

function checkRepeat(songTitle){
  if(!songTitle) return 0;
  const t = songTitle.trim().toUpperCase();
  let cnt = 0;
  ALL_SONGS.forEach(r => { if(String(r[3]||'').trim().toUpperCase() === t) cnt++; });
  if (!isWithinLiveSchedule()) {
    LIVE.performances.forEach(r => { if(String(r.song||'').trim().toUpperCase() === t) cnt++; });
  }
  return cnt;
}

function getOrCreatePerf(singerName, round) {
  let p = LIVE.performances.find(x => x.singer === singerName && x.round === round);
  if (!p) {

      singer: singerName,
      song: '',
      songId: '',
      stars: [false, false, false, false, false],
      repeatCount: 0,
      meta: {}
    };
    LIVE.performances.push(p);
  }
  return p;
}

function parseManualTime24ToDate(hhmm) {
  const now = new Date();
  if (!hhmm || !hhmm.includes(':')) return now;
  const [h, m] = hhmm.split(':').map(Number);
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
}

function format12HourTime(dt) {
  return dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
}

function to24HourInput(joinTimeStr) {
  if (!joinTimeStr) {
    const n = new Date();
    return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }
  const m = String(joinTimeStr).trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
  if (!m) {
    const n = new Date();
    return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }
  let hh = parseInt(m[1], 10);
  const mm = m[2];
  const ap = (m[3] || '').toLowerCase();
  if (ap === 'pm' && hh < 12) hh += 12;
  if (ap === 'am' && hh === 12) hh = 0;
  return String(hh).padStart(2, '0') + ':' + mm;
}

let UNIQUE_SONG_CATALOG = [];
function getUniqueSongCatalog() {
  if (UNIQUE_SONG_CATALOG.length !== ALL_SONGS.length) {
    const map = new Map();
    ALL_SONGS.forEach(r => {
      const t = (r[3] || '').trim().toUpperCase();
      if (!t) return;
      map.set(t, (map.get(t) || 0) + 1);
    });
    UNIQUE_SONG_CATALOG = [...map.entries()]
      .map(([title, count]) => ({ title, count }))
      .sort((a, b) => a.title.localeCompare(b.title));
  }
  return UNIQUE_SONG_CATALOG;
}

window.onSongInput = (singerName, round, showDrop = true) => {
  const sIdSanitized = round + '_' + singerName.replace(/[^a-zA-Z0-9]/g, '_');
  const songInp = $('#sg_' + sIdSanitized);
  const dropEl = $('#ac_' + sIdSanitized);
  const p = getOrCreatePerf(singerName, round);

  const song = (songInp.value || '').trim().toUpperCase();
  const repEl = $('#rep_' + sIdSanitized);
  const idEl = $('#id_' + sIdSanitized);

  if(!song){
    p.song = '';
    p.songId = '';
    p.repeatCount = 0;
    if(repEl) repEl.innerHTML = '';
    if(idEl) idEl.innerHTML = '<span class="m">-</span>';
    if(dropEl) dropEl.style.display = 'none';
    saveLocal();
    drawSOTDSection();
    return;
  }

  // Render lightweight non-blocking song suggestions when typing
  if (dropEl && showDrop) {
    const matches = getUniqueSongCatalog()
      .filter(item => item.title.includes(song) && item.title !== song)
      .slice(0, 8);
    if (matches.length) {
      dropEl.innerHTML = matches.map(m =>
        `<div class="song-ac-item" onmousedown="event.preventDefault();pickSongSuggestion('${e(singerName)}', ${round}, '${e(m.title).replace(/'/g, "\\'")}')">` +
          `<span>${e(m.title)}</span>` +
          `<span class="m" style="font-size:10.5px;white-space:nowrap">${m.count}x</span>` +
        `</div>`
      ).join('');
      dropEl.style.display = 'block';
    } else {
      dropEl.style.display = 'none';
    }
  }

  const rep = checkRepeat(song);
  p.song = song;
  p.repeatCount = rep;
  if (!p.songId) {
    p.songId = getNextSongId();
  }

  if(repEl){
    repEl.innerHTML = rep > 0 ? `<span style="color:#dc2626;font-weight:700;margin-left:6px">(${rep})</span>` : '';
  }
  if(idEl){
    idEl.innerHTML = `<b>${p.songId}</b>`;
  }

  saveLocal();
  drawSOTDSection();
};

function getRankedSOTDCandidates() {
  // Superadmin sees ALL singers in queue (even ineligible/late after cutoff); standard Admin sees eligible singers
  const pool = IS_SUPER ? LIVE.singers : LIVE.singers.filter(s => s.eligible);
  return pool.map(s => {
    const perfs = LIVE.performances.filter(p => p.singer === s.name && p.song);
    const count = perfs.length;
    const totalPts = perfs.reduce((sum, p) => sum + calcStarPoints(p.stars), 0);
    const avg = count > 0 ? (totalPts / count) : 0;
    return {
      name: s.name,
      eligible: s.eligible,
      songsSung: count,
      totalPts,
      avgPts: parseFloat(avg.toFixed(1))
    };
  }).sort((a, b) => b.totalPts - a.totalPts || b.avgPts - a.avgPts || b.songsSung - a.songsSung);
}

function getSOTMComputedStandings() {
  return SOTM_PANEL.finalists.map(f => {
    const jTotal = (parseFloat(f.sur)||0) + (parseFloat(f.taal)||0) + (parseFloat(f.sel)||0) + (parseFloat(f.perf)||0);
    const aud = parseFloat(f.audience) || 0;
    const gTotal = parseFloat((jTotal + aud).toFixed(1));
    return {
      ...f,
      judgeTotal: parseFloat(jTotal.toFixed(1)),
      grandTotal: gTotal
    };
  }).sort((a, b) => b.grandTotal - a.grandTotal || b.judgeTotal - a.judgeTotal);
}

  try {

window.triggerSOTM30sVote = (singerName) => {
  if (sotmBlindInterval) clearInterval(sotmBlindInterval);
  SOTM_PANEL.activeBlindVote = { singer: singerName, remaining: 30, endsAt: Date.now() + 30000 };
  syncToFirestore();
  drawSOTMPanel();
  sotmBlindInterval = setInterval(() => {
    if (!SOTM_PANEL.activeBlindVote) return;
    SOTM_PANEL.activeBlindVote.remaining--;
    if (SOTM_PANEL.activeBlindVote.remaining <= 0) {
      clearInterval(sotmBlindInterval);
      sotmBlindInterval = null;
      SOTM_PANEL.activeBlindVote = null;
      syncToFirestore();
    }
    drawSOTMPanel();
  }, 1000);
};

async function buildAndSaveMasterBackup(songsSnapshot, pDataSnapshot, sotmSnapshot) {
  const now = new Date();
  const stamp = LIVE.date + '_' + String(now.getHours()).padStart(2,'0') + '-' + String(now.getMinutes()).padStart(2,'0');
  const fileName = `SFH_Master_Backup_${stamp}.json`;

  const masterObj = {
    kind: 'sfh-master-backup',
    version: 'v29',
    generatedAt: now.toISOString(),
    ts: LIVE.date + ' ' + curTime(),
    songs: songsSnapshot.slice().sort(cmpBySongId),
    singers: pDataSnapshot.singers || KNOWN_SINGERS,
    sotd: pDataSnapshot.sotd || [],
    som: pDataSnapshot.som || {},
    somd: pDataSnapshot.somd || {},
    stars: pDataSnapshot.stars || {},
    holidays: CONF_CACHE.holidays || [],
    schedule: SCHEDULE,
    starScoring: STAR_SCORING,
    sotmResult: sotmSnapshot || null
  };

  const jsonStr = JSON.stringify(masterObj, null, 2);

  if (!backupDirHandle) backupDirHandle = await getBackupDirHandleFromIDB();
  if (backupDirHandle) {
    try {
      let perm = await backupDirHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await backupDirHandle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        const fileHandle = await backupDirHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(jsonStr);
        await writable.close();
        return `${backupDirHandle.name}/${fileName}`;
      }
    } catch (e) {}
  }

  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  return fileName;
}

async function commitSessionDataToFirestore() {
  const performed = LIVE.performances.filter(p => p.song).slice().sort(cmpBySongId);
  const mo = LIVE.date.slice(0, 7);

  const mDocRef = doc(fs, 'pub', 'songs_' + mo);
  const mDoc = await getDoc(mDocRef);
  let mSongs = mDoc.exists() ? JSON.parse(mDoc.data().json || '[]') : [];

  mSongs = mSongs.filter(r => r[1] !== LIVE.date);
  performed.forEach(p => {
    mSongs.push([p.songId, LIVE.date, p.singer, p.song]);
  });
  mSongs.sort(cmpBySongId);

  await setDoc(mDocRef, {
    json: JSON.stringify(mSongs),
    n: mSongs.length,
    ts: LIVE.date
  });

  const dataDocRef = doc(fs, 'pub', 'data');
  const dataDoc = await getDoc(dataDocRef);
  let pData = dataDoc.exists() ? dataDoc.data() : {singers:[], sotd:[], stars:{}};

  let sotdArr = pData.sotd || [];
  sotdArr = sotdArr.filter(x => x.d !== LIVE.date);
  if(SOTD_LIST.length){
    sotdArr.push({
      d: LIVE.date,
      l: SOTD_LIST.map(x => ({n: x.n, h: x.h}))
    });
  }

  let starsObj = pData.stars || {};
  SOTD_LIST.forEach(sWinner => {
    const sk = sWinner.n.toUpperCase();
    starsObj[sk] = starsObj[sk] || {t: 0, d: [], m: {}};
    if(!starsObj[sk].d.includes(LIVE.date)){
      starsObj[sk].d.push(LIVE.date);
      starsObj[sk].t = (starsObj[sk].t || 0) + 1;
    }
  });

  LIVE.singers.forEach(s => {
    if(!pData.singers.includes(s.name)) pData.singers.push(s.name);
  });
  pData.singers.sort();
  pData.sotd = sotdArr;
  pData.stars = starsObj;
  pData.ts = LIVE.date;

  const fullSongs = ALL_SONGS.filter(r => r[1] !== LIVE.date);
  performed.forEach(p => fullSongs.push([p.songId, LIVE.date, p.singer, p.song]));
  fullSongs.sort(cmpBySongId);

  await setDoc(dataDocRef, pData);
  return { performed, pData, fullSongs };
}

window.endSession = async () => {
  const hasLiveEntries = LIVE.singers.length > 0 || SOTD_LIST.length > 0;
  if (!isWithinLiveSchedule() && !hasLiveEntries) {
    SESSION_ENDED = true;
    clearTimeout(syncTimer);
    try { sessionStorage.removeItem('sfh_practice_session'); } catch(x){}
    try { localStorage.removeItem('sfh_live_session_' + LIVE.date); } catch(x){}
    try { await setDoc(doc(fs, 'live', 'session'), { date: LIVE.date, active: false, endedAt: Date.now(), updatedAt: Date.now() }); } catch(e){}
    window.location.href = 'index.html';
    return;
  }

  showConfirm("End & Publish today's live session?\n\n• Permanently publishes all songs, stars & SOTDs\n• Closes the live banner on Home & saves Master Backup JSON\n• Returns you to Home screen", async () => {
    try {
      SESSION_ENDED = true;
      clearTimeout(syncTimer);
      if (sotdTimerInterval) { clearInterval(sotdTimerInterval); sotdTimerInterval = null; }
      if (sotmBlindInterval) { clearInterval(sotmBlindInterval); sotmBlindInterval = null; }

      const { performed, pData, fullSongs } = await commitSessionDataToFirestore();

      await setDoc(doc(fs, 'live', 'session'), {
        date: LIVE.date,
        active: false,
        singers: [],
        performances: [],
        sotdList: [],
        sotdVote: null,
        sotmVote: null,
        endedAt: Date.now(),
        updatedAt: Date.now()
      });

      try { localStorage.removeItem('sfh_live_session_' + LIVE.date); } catch(x){}
      try { sessionStorage.removeItem('sfh_practice_session'); } catch(x){}

      let sotmSnapData = null;
      try {
        const ss = await getDoc(doc(fs, 'pub', 'sotm'));
        if (ss.exists()) sotmSnapData = ss.data();
      } catch (e) {}

      const backupFileName = await buildAndSaveMasterBackup(fullSongs, pData, sotmSnapData);

      const finalists = Object.entries(pData.stars || {}).filter(([n, o]) => (o.t || 0) >= 4).map(([n]) => n);
      const waText =
        `🎶 *SING FROM HOME — ${fd(LIVE.date)}* 🎶\n` +
        `_A project of B. S. Tikariya Cultural Foundation ®_\n\n` +
        (SOTD_LIST.length ? `🏆 *Singer(s) of the Day:* ${SOTD_LIST.map(w => `*${w.n}*${w.h !== 'Score' ? ' ('+w.h+')' : ''}`).join(', ')}\n\n` : '') +
        `🎤 *Songs Performed (${performed.length}):*\n` +
        performed.map((p, i) => `${i+1}. *${p.singer}* — ${p.song} (${p.songId})`).join('\n') +
        (finalists.length ? `\n\n⭐ *4-Star SOTM Finalists:* ${finalists.join(', ')}` : '') +
        `\n\n_Conducted by Tikariya's School of Music_`;

      LIVE = { date: LIVE.date, singers: [], performances: [] };
      SOTD_LIST = [];

      const m = $('#custom-modal');
      $('#custom-modal-body').innerHTML = `
        <h3>✅ Session Ended & Published</h3>
        <p class="m" style="margin:6px 0">Live session closed. Offline Master Backup saved as:<br><b>${e(backupFileName)}</b></p>
        <label style="display:block;font-size:12px;font-weight:700;margin-top:8px">WhatsApp Group Summary (Ready to Share):</label>
        <textarea id="wa_summary_box" rows="6" style="width:100%;margin-top:4px;font-size:12.5px">${e(waText)}</textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
          <button onclick="copyWhatsAppSummary()">Copy Summary</button>
          <button class="pri" onclick="window.location.href='index.html'">Done → Home</button>
        </div>
      `;
      m.style.display = 'flex';
    } catch(err) {
      SESSION_ENDED = false;
      showNotice("Error ending session: " + (err.code || err.message), "Error");
    }
  }, "End & Publish Session");
};
