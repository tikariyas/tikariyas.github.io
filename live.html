const parseSongNum = id => {

};

const cmpBySongId = (a, b) => {
  const idA = Array.isArray(a) ? a[0] : (a.songId || a[0] || '');
  const idB = Array.isArray(b) ? b[0] : (b.songId || b[0] || '');
  return parseSongNum(idA) - parseSongNum(idB);
};

// Schedule evaluation: Automatically detects Live Production vs Off-Schedule Practice Window
let SCHEDULE = { days: [1,2,3,4,5], startTime: "20:30", endTime: "23:30", cutoffMins: 15, forceLiveOverride: false };
let lastScheduleMode = null;

function isWithinLiveSchedule(now = new Date()) {
  if (SCHEDULE.forceLiveOverride) return true;
  const day = now.getDay();
  if (!SCHEDULE.days.includes(day)) return false;
  const [sh, sm] = (SCHEDULE.startTime || "20:30").split(':').map(Number);
  const [eh, em] = (SCHEDULE.endTime || "23:30").split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const startMins = sh * 60 + sm;
  const endMins = eh * 60 + em;
  return curMins >= startMins && curMins <= endMins;
}

function isBeforeCutoff(now = new Date()) {
  if (SCHEDULE.forceLiveOverride) return true;
  const [sh, sm] = (SCHEDULE.startTime || "20:30").split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const cutoffLimit = sh * 60 + sm + (SCHEDULE.cutoffMins ?? 15);
  return curMins <= cutoffLimit;
}

function formatScheduleText() {
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const sortedDays = [...SCHEDULE.days].sort();
  let dayLabel = sortedDays.map(d => dayNames[d]).join(', ');
  if (JSON.stringify(sortedDays) === JSON.stringify([1,2,3,4,5])) dayLabel = 'Mon–Fri';
  const [hh, mm] = SCHEDULE.startTime.split(':').map(Number);
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 || 12;
  return `${dayLabel} ${h12}:${String(mm).padStart(2,'0')} ${ampm} onwards`;
}

function updateClock(){
  const d = new Date();
  const el = $('#live-clock');
  if(el) el.textContent = d.toLocaleTimeString('en-IN', {hour12:true, hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const liveNow = isWithinLiveSchedule(d);
  if (lastScheduleMode !== null && lastScheduleMode !== liveNow) {
    lastScheduleMode = liveNow;
    init();
  }
}

let U=null, IS_SUPER=false, IS_ADMIN=false, KNOWN_SINGERS=[], ALL_SONGS=[], MAX_ID_NUM=209;
let CONF_CACHE = {};
let PUB_CACHE = null;
let currentRound = 1;
let SOTD_LIST = [];
let songListTab = 'today';
let songArchivesExpanded = false;
let selectedSingerFilter = '';
let searchSongKeyword = '';
let PRACTICE_COUNTER = 0;
let backupDirHandle = null;

async function getBackupDirHandleFromIDB() {
  try {
    return await new Promise((resolve) => {
      const req = indexedDB.open('sfh_settings_db', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => {
        const db = req.result;
        const tx = db.transaction('kv', 'readonly');
        const g = tx.objectStore('kv').get('backupDirHandle');
        g.onsuccess = () => resolve(g.result || null);
        g.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

getBackupDirHandleFromIDB().then(h => { if (h) backupDirHandle = h; }); // Optional Desktop File System Access folder handle

let LIVE = {
  date: tdy(),
  singers: [],
  performances: []
};

// Fuzzy singer name resolver (e.g., "SHEETAL" -> "SHEETAL PONALA" if unique match in KNOWN_SINGERS)
function resolveCanonicalSingerName(rawName) {
  const clean = (rawName || '').trim().toUpperCase();
  if (!clean) return '';
  if (KNOWN_SINGERS.includes(clean)) return clean;
  const prefixMatches = KNOWN_SINGERS.filter(k => k.startsWith(clean + ' '));
  if (prefixMatches.length === 1) return prefixMatches[0];
  return clean;
}

let syncTimer = null;
function syncToFirestore() {
  if (!isWithinLiveSchedule()) return; // Off-schedule practice never touches live cloud state
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await setDoc(doc(fs, 'live', 'session'), {
        date: LIVE.date,
        currentRound: currentRound,
        singers: LIVE.singers,
        performances: LIVE.performances,
        sotdList: SOTD_LIST,
        updatedAt: Date.now(),
        active: true
      });
    } catch (err) {
      console.warn('Live cloud sync warning:', err);
    }
  }, 120);
}

let permSyncTimer = null;
function persistLockedSongToPub(perf) {
  if (!isWithinLiveSchedule() || !perf || !perf.song || !perf.songId || !perf.locked) return;

  const idx = ALL_SONGS.findIndex(r => r[0] === perf.songId);
  const tuple = [perf.songId, LIVE.date, perf.singer, perf.song];
  if (idx >= 0) ALL_SONGS[idx] = tuple;
  else ALL_SONGS.push(tuple);
  ALL_SONGS.sort(cmpBySongId);

  clearTimeout(permSyncTimer);
  permSyncTimer = setTimeout(async () => {
    try {
      const mo = LIVE.date.slice(0, 7);
      const mDocRef = doc(fs, 'pub', 'songs_' + mo);
      const mDoc = await getDoc(mDocRef);
      let mSongs = mDoc.exists() ? JSON.parse(mDoc.data().json || '[]') : [];

      const lockedToday = LIVE.performances.filter(p => p.song && p.songId && p.locked);
      lockedToday.forEach(lp => {
        const existingIdx = mSongs.findIndex(r => r[0] === lp.songId);
        const row = [lp.songId, LIVE.date, lp.singer, lp.song];
        if (existingIdx >= 0) mSongs[existingIdx] = row;
        else mSongs.push(row);
      });
      mSongs.sort(cmpBySongId);

      await setDoc(mDocRef, {
        json: JSON.stringify(mSongs),
        n: mSongs.length,
        ts: LIVE.date
      });
    } catch (err) {
      console.warn('Permanent Song Lock sync warning:', err);
    }
  }, 300);
}

function saveLocal(){

function loadLocal(){

        if(parsed.PRACTICE_COUNTER) PRACTICE_COUNTER = parsed.PRACTICE_COUNTER;
      }
    }catch(x){}
    return;
  }
  try{
    const d = localStorage.getItem('sfh_live_session_'+LIVE.date);
    if(d){
      const parsed = JSON.parse(d);
      if(parsed.LIVE) LIVE = parsed.LIVE;
      if(parsed.currentRound) currentRound = parsed.currentRound;
      if(parsed.SOTD_LIST) SOTD_LIST = parsed.SOTD_LIST;
    }
  }catch(x){}
}

async function init(){
  try {
    const cfgSnap = await getDoc(doc(fs, 'config', 'app'));
    if (cfgSnap.exists()) {
      CONF_CACHE = cfgSnap.data();
      if (CONF_CACHE.schedule) {
        SCHEDULE = { ...SCHEDULE, ...CONF_CACHE.schedule };
      }
    }
  } catch (ce) {}

  lastScheduleMode = isWithinLiveSchedule();
  LIVE = { date: tdy(), singers: [], performances: [] };
  SOTD_LIST = [];
  currentRound = 1;
  loadLocal();

  try {
    const pubData = await getDoc(doc(fs, 'pub', 'data'));
    if(pubData.exists()){
      PUB_CACHE = pubData.data();
      KNOWN_SINGERS = PUB_CACHE.singers || [];
    }
  } catch(e) {
    console.warn("Singer directory fetch bypassed:", e);
  }

  try {
    const ix = await getDoc(doc(fs, 'pub', 'idx'));
    if(ix.exists()){
      const ms = Object.keys(ix.data().months || {}).sort();
      const ds = await Promise.all(ms.map(m => getDoc(doc(fs, 'pub', 'songs_' + m))));
      ALL_SONGS = [].concat(...ds.map(d => d.exists() ? JSON.parse(d.data().json || '[]') : []));
    } else {
      const b = await getDoc(doc(fs, 'pub', 'songs'));
      if(b.exists()){
        ALL_SONGS = b.data().json ? JSON.parse(b.data().json) : (b.data().list || []);
      }
    }
    const existingIds = new Set(ALL_SONGS.map(r => r[0]));
    NOV16_SONGS.forEach(row => {
      if (!existingIds.has(row[0])) ALL_SONGS.push(row);
    });
    ALL_SONGS.sort(cmpBySongId);

    MAX_ID_NUM = 0;
    ALL_SONGS.forEach(r => {
      let num = parseSongNum(r[0]);
      if(num > 143 && String(r[0]).includes('0144')) num = 143;
      if(num > MAX_ID_NUM) MAX_ID_NUM = num;
    });
  } catch(x) {
    console.warn("Songs catalog fetch bypassed:", x);
  }

  // In Live Production Mode, load any already-locked songs for today so they stay locked across reloads
  if (isWithinLiveSchedule()) {
    const todayPubSongs = ALL_SONGS.filter(r => r[1] === LIVE.date);
    todayPubSongs.forEach(r => {
      const [sId, dt, sName, sTitle] = r;
      if (!LIVE.singers.some(s => s.name === sName)) {
        LIVE.singers.push({ name: sName, joinTime: 'Locked', eligible: true });
      }
      let existing = LIVE.performances.find(p => p.songId === sId);
      if (!existing) {
        LIVE.performances.push({
          round: 1,
          singer: sName,
          song: sTitle,
          songId: sId,
          locked: true,
          stars: [false, false, false, false, false],
          repeatCount: Math.max(0, checkRepeat(sTitle) - 1),
          meta: {}
        });
      } else {
        existing.locked = true;
      }
    });
  }

  draw();
}

function getNextSongId(){
  if (!isWithinLiveSchedule()) {
    PRACTICE_COUNTER++;
    return 'P-' + String(PRACTICE_COUNTER).padStart(4, '0');
  }
  let highest = MAX_ID_NUM;
  ALL_SONGS.forEach(r => {
    const num = parseSongNum(r[0]);
    if(num > highest) highest = num;
  });
  LIVE.performances.forEach(p => {
    const num = parseSongNum(p.songId);
    if(num > highest) highest = num;
  });
  return 'S-' + String(highest + 1).padStart(4, '0');
}

function checkRepeat(songTitle){
  if(!songTitle) return 0;
  const t = songTitle.trim().toUpperCase();
  let cnt = 0;
  ALL_SONGS.forEach(r => { if(String(r[3]||'').trim().toUpperCase() === t) cnt++; });
  if (!isWithinLiveSchedule()) {
    LIVE.performances.forEach(r => { if(String(r.song||'').trim().toUpperCase() === t) cnt++; });
  }
  return cnt;
}

function getOrCreatePerf(singerName, round) {
  let p = LIVE.performances.find(x => x.singer === singerName && x.round === round);
  if (!p) {
    p = {
      round,
      singer: singerName,
      song: '',
      songId: '',
      locked: false,
      stars: [false, false, false, false, false],
      repeatCount: 0,
      meta: {}
    };
    LIVE.performances.push(p);
  }
  return p;
}

window.addSinger = () => {
  if(LIVE.singers.length >= 59){
    showNotice('Session capacity reached.');
    return;
  }
  const inp = $('#in_singer');
  const name = resolveCanonicalSingerName(inp.value);
  if(!name){ showNotice('Please enter or select singer name.'); return; }
  if(LIVE.singers.some(s => s.name === name)){ showNotice('Singer already in session.'); return; }

  LIVE.singers.push({
    name,
    joinTime: curTime(),
    eligible: isBeforeCutoff(new Date())
  });

  getOrCreatePerf(name, 1);
  getOrCreatePerf(name, 2);
  getOrCreatePerf(name, 3);

  inp.value = '';
  saveLocal();
  draw();
};

  const s = LIVE.singers[idx];
  if (!s) return;
  const hasLockedSong = LIVE.performances.some(p => p.singer === s.name && p.locked && p.songId);
  if (hasLockedSong && isWithinLiveSchedule()) {
    showNotice(`Cannot remove ${s.name} because they have a permanently locked Song ID.\n\nYou must individually delete their locked song(s) one by one first.`, "Locked Song Protection");
    return;
  }

  showConfirm('Remove ' + s.name + ' from today\'s singing order?', () => {
    const name = s.name;
    LIVE.singers.splice(idx, 1);
    LIVE.performances = LIVE.performances.filter(p => p.singer !== name);
    saveLocal();
    draw();
  });
};

window.onSongInput = (singerName, round) => {
  const sIdSanitized = round + '_' + singerName.replace(/[^a-zA-Z0-9]/g, '_');
  const songInp = $('#sg_' + sIdSanitized);
  const p = getOrCreatePerf(singerName, round);

  if (p.locked && isWithinLiveSchedule()) {
    songInp.value = p.song;
    return;
  }

  const song = (songInp.value || '').trim().toUpperCase();
  const repEl = $('#rep_' + sIdSanitized);
  const idEl = $('#id_' + sIdSanitized);

  if(!song){
    p.song = '';
    p.repeatCount = 0;

    if(idEl) idEl.innerHTML = '<span class="m">-</span>';
    saveLocal();
    drawSOTDSection();
    renderSongListSection();
    return;
  }

  const rep = checkRepeat(song);
  p.song = song;
  p.repeatCount = rep;
  if (!p.songId) {
    p.songId = getNextSongId();
  }

  if(repEl){

  if(idEl){

  drawSOTDSection();
  renderSongListSection();
};

// Generates complete timestamped Master Backup JSON (SFH_Master_Backup_YYYY-MM-DD_HH-MM.json)
async function buildAndSaveMasterBackup(songsSnapshot, pDataSnapshot, sotmSnapshot) {
  const now = new Date();
  const stamp = LIVE.date + '_' + String(now.getHours()).padStart(2,'0') + '-' + String(now.getMinutes()).padStart(2,'0');
  const fileName = `SFH_Master_Backup_${stamp}.json`;

  const masterObj = {
    kind: 'sfh-master-backup',
    version: 'v25',
    generatedAt: now.toISOString(),
    ts: LIVE.date + ' ' + curTime(),
    songs: songsSnapshot.slice().sort(cmpBySongId),
    singers: pDataSnapshot.singers || KNOWN_SINGERS,
    sotd: pDataSnapshot.sotd || [],
    som: pDataSnapshot.som || {},
    somd: pDataSnapshot.somd || {},
    stars: pDataSnapshot.stars || {},
    holidays: CONF_CACHE.holidays || [],
    schedule: SCHEDULE,
    sotmResult: sotmSnapshot || null
  };

  const jsonStr = JSON.stringify(masterObj, null, 2);

  // If user linked a desktop directory handle in Rules tab, write directly to that folder
  if (!backupDirHandle) backupDirHandle = await getBackupDirHandleFromIDB();
  if (backupDirHandle) {
    try {
      let perm = await backupDirHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await backupDirHandle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        const fileHandle = await backupDirHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(jsonStr);
        await writable.close();
        return `${backupDirHandle.name}/${fileName}`;
      }
    } catch (e) {
      console.warn("Directory write fallback to standard download:", e);
    }
  }

  // Standard cross-platform offline download (Android Chrome + Desktop)
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);
  return fileName;
}

// Automatic End-of-Week Attendance Evaluation (runs on last scheduled day of week, e.g. Friday)
async function runAutomaticWeeklyAttendanceIfEndOfWeek(allSongsList, pData) {
  const todayObj = new Date(LIVE.date + 'T00:00:00');
  const todayDay = todayObj.getDay();
  const maxSchedDay = Math.max(...SCHEDULE.days);
  if (todayDay !== maxSchedDay) return 0; // Only evaluate at the end of the scheduled week

  // Compute Monday of current week
  const diff = todayObj.getDate() - todayDay + (todayDay === 0 ? -6 : 1);
  const monDate = new Date(new Date(todayObj).setDate(diff));
  const weekDates = [];
  for (let i = 0; i < 5; i++) {
    const dt = new Date(monDate.getFullYear(), monDate.getMonth(), monDate.getDate() + i);
    weekDates.push(dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'));
  }

  const holidays = Array.isArray(CONF_CACHE.holidays) ? CONF_CACHE.holidays : [];
  const weekHolidays = weekDates.filter(d => holidays.includes(d));
  const requiredDays = Math.max(1, 3 - weekHolidays.length);

  // Detect first ever appearance date for new-joiner mid-week exemption
  const firstDateMap = {};
  allSongsList.forEach(r => {
    const sg = String(r[2]||'').trim().toUpperCase();
    const dt = String(r[1]||'');
    if (sg && dt && (!firstDateMap[sg] || dt < firstDateMap[sg])) firstDateMap[sg] = dt;
  });

  // Load approved users to deliver automated inbox messages
  let usersList = [];
  try {
    const uSnap = await getDocs(collection(fs, 'users'));
    usersList = uSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {}

  const starsObj = pData.stars || {};
  let deductedCount = 0;

  for (const [singerName, starObj] of Object.entries(starsObj)) {
    const curStars = starObj.t || 0;
    if (curStars <= 0) continue;

    const attended = new Set();
    allSongsList.forEach(r => {
      if (String(r[2]||'').trim().toUpperCase() === singerName && weekDates.includes(r[1])) {
        attended.add(r[1]);
      }
    });

    const firstDate = firstDateMap[singerName] || '';
    const isNewJoiner = firstDate && weekDates.includes(firstDate) && firstDate > weekDates[0];

    if (attended.size < requiredDays && !isNewJoiner) {
      const nextStars = Math.max(0, curStars - 1);
      starsObj[singerName].t = nextStars;
      deductedCount++;

      const userRec = usersList.find(u => String(u.singer||'').trim().toUpperCase() === singerName);
      if (userRec) {
        try {
          await addDoc(collection(fs, 'msgs'), {
            title: 'Weekly Attendance & Star Update',
            body: `Hello ${singerName},\n\nPer the SING FROM HOME attendance rule (minimum ${requiredDays} session(s) required this week), you attended ${attended.size} session(s).\n\n1 star has been deducted (${curStars} ★ → ${nextStars} ★). Attend at least 3 sessions next week to keep your stars safe!`,
            to: userRec.id,
            toName: singerName,
            ts: Date.now()
          });
        } catch (me) {}
      }
    }
  }

  pData.stars = starsObj;
  return deductedCount;
}

      showNotice("Error saving session: " + (err.code || err.message), "Error");
    }
  }, "End & Publish Session");
};

function getRankedSOTDCandidates() {
  const eligibleSingers = LIVE.singers.filter(s => s.eligible);
  return eligibleSingers.map(s => {
    const perfs = LIVE.performances.filter(p => p.singer === s.name && p.song);
    const count = perfs.length;
    const totalStars = perfs.reduce((sum, p) => sum + (p.stars || []).filter(Boolean).length, 0);
    const avg = count > 0 ? (totalStars / count) : 0;
    return {
      name: s.name,
      songsSung: count,
      totalStars,
      avgStars: parseFloat(avg.toFixed(1))
    };
  }).sort((a, b) => b.totalStars - a.totalStars || b.avgStars - a.avgStars || b.songsSung - a.songsSung);
}

function getAllArchiveSongs() {
  const t = LIVE.date;
  const hist = ALL_SONGS.filter(r => r[1] !== t);
  const todayLive = isWithinLiveSchedule()
    ? LIVE.performances.filter(p => p.song).map(p => [p.songId, t, p.singer, p.song])
    : ALL_SONGS.filter(r => r[1] === t);
  return [...hist, ...todayLive].sort(cmpBySongId);
}

window.downloadSongListPDF = async () => {
  if(!window.html2canvas || !window.jspdf){
    showNotice('PDF engine loading, please wait a moment.');
    return;
  }

  const renderSlot = document.getElementById('pdf-render-slot');
  const tableContent = document.getElementById('song_list_table_wrap');
  if(!tableContent){ return; }

  let title = "Song List";
  if(songListTab === 'today') title = `Songs Performed Today (${fd(LIVE.date)})`;
  if(songListTab === 'month') title = `Songs Performed in Month (${LIVE.date.slice(0,7)})`;
  if(songListTab === 'singer') title = `Song Record: ${selectedSingerFilter || 'All'}`;
  if(songListTab === 'unique') title = `Unique Song List (No Repetition)`;
  if(songListTab === 'all') title = `Full Master Song Directory`;

  renderSlot.innerHTML = `
    <div style="text-align:center;border-bottom:2px solid #0f3460;padding-bottom:10px;margin-bottom:12px">
      <h2 style="margin:0;font-size:20px;color:#0f3460">SING FROM HOME</h2>
      <p style="margin:3px 0;font-size:12px;color:#475569">A project of B. S. Tikariya Cultural Foundation ® (CIN: U88900MH2025NPL454435)</p>
      <p style="margin:2px 0;font-size:13px"><b>${e(title)}</b> | Sorted by Song ID | Generated: ${curTime()}</p>
    </div>
    ${tableContent.innerHTML}
  `;

  try {
    const canvas = await window.html2canvas(renderSlot, { scale: 2, useCORS: true, logging: false });
    const imgData = canvas.toDataURL('image/png');
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfWidth = 210;
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    pdf.save(`SFH_${songListTab.toUpperCase()}_Songs_${LIVE.date}.pdf`);
  } catch(err) {
    showNotice('PDF export failed: ' + err.message);
  } finally {
    renderSlot.innerHTML = '';
  }
};

  else if (songListTab === 'month') {

      <div class="tbl" id="song_list_table_wrap"><table>

          <th class="col-ord">#</th>
          <th>Song ID</th>
          <th>Date</th>
          <th>Singer Name</th>
          <th>Song Title</th>
        </tr>
        ${monthRows.map((r, i) => `
          <tr>
            <td class="col-ord"><b>${i + 1}</b></td>
            <td><b>${e(r[0])}</b></td>
            <td><span class="m">${fd(r[1])}</span></td>
            <td><b>${e(r[2])}</b></td>
            <td><b>${e(r[3])}</b></td>
          </tr>
        `).join('')}
      </table></div>
    ` : '<p class="m">No songs recorded for this month yet.</p>';
  }
  else if (songListTab === 'singer') {
    const allSingers = [...new Set(allArchive.map(r => r[2]))].filter(Boolean).sort();

    subControls = `
      <div class="row" style="margin-bottom:8px">
        <select onchange="setSongSingerFilter(this.value)" style="min-width:200px">
          ${allSingers.map(s => `<option value="${e(s)}" ${s===selectedSingerFilter?'selected':''}>${e(s)}</option>`).join('')}
        </select>
        <span class="m">Total performed: <b>${allArchive.filter(r => r[2] === selectedSingerFilter).length}</b></span>
      </div>
    `;

    const singerRows = allArchive.filter(r => r[2] === selectedSingerFilter).slice().sort(cmpBySongId);
    tableHTML = singerRows.length ? `
      <div class="tbl" id="song_list_table_wrap"><table>
        <tr>
          <th class="col-ord">#</th>
          <th>Song ID</th>
          <th>Date</th>
          <th>Song Title</th>
        </tr>
        ${singerRows.map((r, i) => `
          <tr>
            <td class="col-ord"><b>${i + 1}</b></td>

          </tr>
        `).join('')}
      </table></div>
    ` : '<p class="m">No songs found for this singer.</p>';
  }
  else if (songListTab === 'unique') {
    const uniqueMap = new Map();
    allArchive.forEach(r => {
      const title = (r[3] || '').trim().toUpperCase();
      if(!title) return;
      if(!uniqueMap.has(title)) {
        uniqueMap.set(title, { title: r[3], count: 0, firstId: r[0], singers: [] });
      }
      const item = uniqueMap.get(title);
      item.count++;
      item.singers.push({ singer: r[2], id: r[0], date: r[1] });
    });

    const uniqueList = Array.from(uniqueMap.values()).sort((a,b) => parseSongNum(a.firstId) - parseSongNum(b.firstId));

    tableHTML = uniqueList.length ? `
      <p class="m" style="margin:2px 0 6px">Showing <b>${uniqueList.length}</b> distinct songs (sorted by Song ID).</p>

            <td><b>${e(u.title)}</b></td>
            <td style="text-align:center"><b>${u.count}x</b></td>
            <td style="font-size:12px">
              ${u.singers.map(s => `<span><b>${e(s.singer)}</b> (${e(s.id)})</span>`).join(', ')}
            </td>
          </tr>

      </div>
    `;

    let filtered = allArchive.slice().sort(cmpBySongId);
    if(searchSongKeyword){
      filtered = filtered.filter(r => String(r[3]||'').toUpperCase().includes(searchSongKeyword) || String(r[2]||'').toUpperCase().includes(searchSongKeyword) || String(r[0]||'').toUpperCase().includes(searchSongKeyword));
    }

    tableHTML = filtered.length ? `
      <p class="m" style="margin:2px 0 6px">Showing <b>${filtered.length}</b> songs sorted by Song ID.</p>
      <div class="tbl" id="song_list_table_wrap"><table>
        <tr>
          <th class="col-ord">#</th>
          <th>Song ID</th>
          <th>Date</th>
          <th>Singer Name</th>
          <th>Song Title</th>
        </tr>
        ${filtered.map((r, i) => `
          <tr>
            <td class="col-ord"><b>${i + 1}</b></td>
            <td><b>${e(r[0])}</b></td>
            <td><span class="m">${fd(r[1])}</span></td>
            <td><b>${e(r[2])}</b></td>
            <td><b>${e(r[3])}</b></td>
          </tr>
        `).join('')}
      </table></div>
    ` : '<p class="m">No matching songs found.</p>';
  }

  container.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <b>Song Archives & Performance Lists</b>
      <div class="row">
        ${songListTab !== 'all' ? `<button onclick="downloadSongListPDF()" style="font-size:11.5px;padding:4px 8px">Export PDF</button>` : ''}
        <button onclick="toggleSongArchives()" style="font-size:11.5px;padding:4px 8px">Hide ▲</button>

    </div>

    <div class="song-nav">
      <button class="${songListTab==='today'?'on':''}" onclick="setSongTab('today')">Today</button>

      <button class="${songListTab==='unique'?'on':''}" onclick="setSongTab('unique')">Unique</button>
      <button class="${songListTab==='all'?'on':''}" onclick="setSongTab('all')">All</button>
    </div>

    ${subControls}
    ${tableHTML}
  `;
}
