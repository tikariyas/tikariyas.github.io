<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

  ["S-0204", "2026-11-16", "SHEETAL PONALA", "AAYE HO MERI ZINDAGI ME"],
  ["S-0205", "2026-11-16", "SHEETAL PONALA", "TU CHAND HAI POONAM KA"],
  ["S-0206", "2026-11-16", "SANDHYA G", "TERE SANG PYAR MAI NAHI TODNA"],
  ["S-0207", "2026-11-16", "SANDHYA G", "MERE NAINA SAWAN BHADON"],
  ["S-0208", "2026-11-16", "SURESH GHADSING", "E MERI ZOHRA ZABEE"],
  ["S-0209", "2026-11-16", "SURESH GHADSING", "TUMKO MERE DIL NE"]
];

const app = initializeApp(CFG.firebase), auth = getAuth(app), fs = getFirestore(app);
const $ = s => document.querySelector(s);
const e = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd = k => k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(0,4);
const tdy = () => {const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const curTime = () => new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true});

const parseSongNum = id => {
  if (!id) return 0;
  const num = parseInt(String(id).replace(/\D/g, ''), 10);
  return isNaN(num) ? 0 : num;
};

const cmpBySongId = (a, b) => {
  const idA = Array.isArray(a) ? a[0] : (a.songId || a[0] || '');
  const idB = Array.isArray(b) ? b[0] : (b.songId || b[0] || '');
  return parseSongNum(idA) - parseSongNum(idB);
};

// ==============================================================================
// NEW 5-STAR POINT & BONUS LOGIC:
// Star 1: Ready On Turn = 1 pt
// Star 2: Starting song within <= 30 sec = 1 pt
//         -> Star 1 + Star 2 = 1 + 1 + 2 bonus = 4 pts
// Star 3: Cleanliness (No Noise) = 1 pt
//         -> Star 1 + Star 2 + Star 3 = 1 + 1 + 1 + 3 bonus = 6 pts
// Star 4: Good Singing = 1 pt
// Star 5: Better Singing = 2 pts
//         -> Star 4 + Star 5 = 1 + 2 + 2 bonus = 5 pts
// Total combined = (Group A: Readiness/Timing/Cleanliness up to 6 pts) + (Group B: Singing Quality up to 5 pts) = max 11 pts
// ==============================================================================
let STAR_SCORING = {
  s1: 1, s2: 1, s3: 1, s4: 1, s5: 2,
  b12: 2, b23: 2.5, b13: 3, b123: 3, b45: 2
};

function getMaxStarPoints() {
  const sc = STAR_SCORING;
  const maxA = Math.max(
    sc.s1, sc.s2, sc.s3,
    sc.s1 + sc.s2 + sc.b12,
    sc.s2 + sc.s3 + sc.b23,
    sc.s1 + sc.s3 + sc.b13,
    sc.s1 + sc.s2 + sc.s3 + sc.b123
  );
  const maxB = Math.max(sc.s4, sc.s5, sc.s4 + sc.s5 + sc.b45);
  return parseFloat((maxA + maxB).toFixed(2));
}

function calcStarPoints(stars) {
  const s = Array.isArray(stars) ? stars : [false, false, false, false, false];
  const s1 = !!s[0], s2 = !!s[1], s3 = !!s[2], s4 = !!s[3], s5 = !!s[4];
  const sc = STAR_SCORING;

  let groupA = (s1 ? sc.s1 : 0) + (s2 ? sc.s2 : 0) + (s3 ? sc.s3 : 0);
  if (s1 && s2 && s3) {
    groupA += sc.b123;
  } else if (s1 && s3) {
    groupA += sc.b13;
  } else if (s2 && s3) {
    groupA += sc.b23;
  } else if (s1 && s2) {
    groupA += sc.b12;
  }

  let groupB = (s4 ? sc.s4 : 0) + (s5 ? sc.s5 : 0);
  if (s4 && s5) {
    groupB += sc.b45;
  }

  return parseFloat((groupA + groupB).toFixed(2));
}

// Schedule evaluation
let SCHEDULE = { days: [1,2,3,4,5], startTime: "20:30", endTime: "23:30", cutoffMins: 15, forceLiveOverride: false };
let lastScheduleMode = null;
let lastAdminWindowMode = null;

function isWithinLiveSchedule(now = new Date()) {
  if (SCHEDULE.forceLiveOverride) return true;
  const day = now.getDay();
  const prevDay = (day + 6) % 7;
  const [sh, sm] = (SCHEDULE.startTime || "20:20").split(':').map(Number);
  const [eh, em] = (SCHEDULE.endTime || "23:30").split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const startMins = sh * 60 + sm;
  let endMins = eh * 60 + em;
  // If endTime is earlier than or equal to startTime (e.g., 23:50 to 00:30 or 23:30), allow at least 2 hours past start across midnight
  if (endMins <= startMins) {
    endMins = Math.max(endMins + 1440, startMins + 120);
  }
  if (SCHEDULE.days.includes(day) && curMins >= startMins && curMins <= endMins) {
    return true;
  }
  if (SCHEDULE.days.includes(prevDay) && (curMins + 1440) >= startMins && (curMins + 1440) <= endMins) {
    return true;
  }
  return false;
}

function isWithinAdminLiveWindow(now = new Date()) {
  if (SCHEDULE.forceLiveOverride) return true;
  const day = now.getDay();
  const prevDay = (day + 6) % 7;
  const nextDay = (day + 1) % 7;
  const [sh, sm] = (SCHEDULE.startTime || "20:20").split(':').map(Number);
  const [eh, em] = (SCHEDULE.endTime || "23:30").split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const startMins = sh * 60 + sm;
  const openMins = startMins - 5;
  let endMins = eh * 60 + em;
  if (endMins <= startMins) {
    endMins = Math.max(endMins + 1440, startMins + 120);
  }
  if (openMins >= 0) {
    if (SCHEDULE.days.includes(day) && curMins >= openMins && curMins <= endMins) return true;
  } else {
    // Session starts within 5 mins after midnight: allow last 5 mins of previous day
    if (SCHEDULE.days.includes(nextDay) && curMins >= (1440 + openMins)) return true;
    if (SCHEDULE.days.includes(day) && curMins >= 0 && curMins <= endMins) return true;
  }
  if (SCHEDULE.days.includes(prevDay) && (curMins + 1440) >= openMins && (curMins + 1440) <= endMins) {
    return true;
  }
  return false;
}

function formatAdminOpenTime() {
  const [sh, sm] = (SCHEDULE.startTime || "20:20").split(':').map(Number);
  const openTotal = ((sh * 60 + sm - 5) + 1440) % 1440;
  const hh = Math.floor(openTotal / 60);
  const mm = openTotal % 60;
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 || 12;
  return `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
}

function isBeforeCutoff(now = new Date()) {
  if (SCHEDULE.forceLiveOverride) return true;
  const [sh, sm] = (SCHEDULE.startTime || "20:20").split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const startMins = sh * 60 + sm;
  const elapsedMins = curMins >= startMins ? (curMins - startMins) : (curMins + 1440 - startMins);
  return elapsedMins >= 0 && elapsedMins <= (SCHEDULE.cutoffMins ?? 26);
}

function formatCutoffTime() {
  const [sh, sm] = (SCHEDULE.startTime || "20:20").split(':').map(Number);
  const totalMins = sh * 60 + sm + (SCHEDULE.cutoffMins ?? 26);
  const hh = Math.floor(totalMins / 60) % 24;
  const mm = totalMins % 60;
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 || 12;
  return `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
}
function formatScheduleText() {
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const sortedDays = [...SCHEDULE.days].sort();
  let dayLabel = sortedDays.map(d => dayNames[d]).join(', ');
  if (JSON.stringify(sortedDays) === JSON.stringify([1,2,3,4,5])) dayLabel = 'Mon–Fri';
  const [hh, mm] = SCHEDULE.startTime.split(':').map(Number);
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 || 12;
  return `${dayLabel} ${h12}:${String(mm).padStart(2,'0')} ${ampm} onwards`;
}

function syncSOTMFinalistsFromFourStars(forceSync = false) {
  const removedSet = getRemovedSingersSet();
  const starsMap = (PUB_CACHE && PUB_CACHE.stars) || {};
  const fourStarNames = Object.entries(starsMap)
    .filter(([nm, info]) => !removedSet.has(canonSinger(nm)) && (info && (info.t || 0)) >= 4)
    .map(([nm]) => canonSinger(nm))
    .filter(Boolean)
    .sort();
  if (forceSync || !SOTM_PANEL.finalists || !SOTM_PANEL.finalists.length) {
    SOTM_PANEL.finalists = fourStarNames.map(nm => {
      const existing = (SOTM_PANEL.finalists || []).find(x => x.name === nm);
      return existing || { name: nm, sur: 0, taal: 0, sel: 0, perf: 0, audience: 0 };
    });
  }
}

const DEFAULT_SINGER_ALIASES = {
  'NANDU GHADSING': 'SURESH GHADSING'
};

function getSingerAliases() {
  const map = { ...DEFAULT_SINGER_ALIASES };
  const saved = (CONF_CACHE && CONF_CACHE.singerAliases) || {};
  Object.entries(saved).forEach(([k, v]) => {
    const fk = String(k || '').trim().toUpperCase();
    const fv = String(v || '').trim().toUpperCase();
    if (fk && fv && fk !== fv) map[fk] = fv;
  });
  return map;
}

function getRemovedSingersSet() {
  const list = (CONF_CACHE && Array.isArray(CONF_CACHE.removedSingers)) ? CONF_CACHE.removedSingers : [];
  return new Set(list.map(x => String(x || '').trim().toUpperCase()).filter(Boolean));
}

function canonSinger(rawName) {
  let cur = String(rawName || '').trim().toUpperCase();
  if (!cur) return '';
  const aliases = getSingerAliases();
  for (let i = 0; i < 5 && aliases[cur]; i++) {
    cur = aliases[cur];
  }
  return cur;
}

function resolveCanonicalSingerName(rawName) {
  const clean = canonSinger(rawName);
  if (!clean) return '';
  if (KNOWN_SINGERS.includes(clean)) return clean;
  const prefixMatches = KNOWN_SINGERS.filter(k => k.startsWith(clean + ' '));
  if (prefixMatches.length === 1) return canonSinger(prefixMatches[0]);
  return clean;
}

const isOnlineSessionTime = (now = new Date()) => isWithinLiveSchedule(now) || isWithinAdminLiveWindow(now);

const FAMILY_IGNORE_TOKENS = new Set(['JI','MR','MRS','MS','DR','SHRI','SMT','KUMARI','DEVI','KUMAR','SINGH','LAL','RAM','BHAI','BEN','BAI','SON','DAUGHTER','SINGER','GUEST','HOST']);
function extractFamilyTokens(rawName) {
  const parts = canonSinger(rawName).replace(/[^A-Z\s]/g, ' ').split(/\s+/).filter(Boolean);
  if (parts.length < 2) return [];
  const last = parts[parts.length - 1];
  if (last.length < 3 || FAMILY_IGNORE_TOKENS.has(last)) return [];
  return [last];
}
function isSelfOrFamily(voterRaw, candRaw, voterPhone = '', candPhone = '') {
  const v = canonSinger(voterRaw);
  const c = canonSinger(candRaw);
  if (!v || !c) return false;
  if (v === c) return true;
  const groups = (CONF_CACHE && Array.isArray(CONF_CACHE.familyGroups)) ? CONF_CACHE.familyGroups : [];
  for (const grp of groups) {
    if (!Array.isArray(grp)) continue;
    const normGrp = grp.map(x => canonSinger(x)).filter(Boolean);
    if (normGrp.includes(v) && normGrp.includes(c)) return true;
  }
  const vp = String(voterPhone || '').replace(/\D/g, '').slice(-10);
  const cp = String(candPhone || '').replace(/\D/g, '').slice(-10);
  if (vp.length === 10 && cp.length === 10 && vp === cp) return true;
  const vt = extractFamilyTokens(v);
  const ct = extractFamilyTokens(c);
  if (vt.length && ct.length && vt.some(t => ct.includes(t))) return true;
  return false;
}

// Reserved 1st position in singing queue: active Host (if set) or MANOJ TIKARIYA
const DEFAULT_RESERVED_FIRST = 'MANOJ TIKARIYA';
function getReservedFirstSinger() {
  const h = canonSinger(LIVE && LIVE.host ? LIVE.host : '');
  return h || DEFAULT_RESERVED_FIRST;
}

function hasPerfActivity(singerName) {
  const cn = canonSinger(singerName);
  return (LIVE.performances || []).some(p =>
    canonSinger(p.singer) === cn &&
    ((p.song && String(p.song).trim()) || (Array.isArray(p.stars) && p.stars.some(Boolean)))
  );
}

function enforceReservedFirstPosition(forceEnsure = false) {
  const firstSinger = getReservedFirstSinger();
  if (!firstSinger) return false;
  if (!Array.isArray(LIVE.singers)) LIVE.singers = [];
  if (!LIVE.singers.length && !forceEnsure) return false;

  let changed = false;

  // Clean up any unused auto-reserved placeholder from an earlier host/default
  for (let i = LIVE.singers.length - 1; i >= 0; i--) {
    const s = LIVE.singers[i];
    if (s && s.reservedFirst && !s.viaZoomBtn && !s.manualAdded && canonSinger(s.name) !== firstSinger && !hasPerfActivity(s.name)) {
      LIVE.singers.splice(i, 1);
      changed = true;
    }
  }

  const idx = LIVE.singers.findIndex(s => s && canonSinger(s.name) === firstSinger);
  if (idx > 0) {
    const [entry] = LIVE.singers.splice(idx, 1);
    entry.reservedFirst = true;
    LIVE.singers.unshift(entry);
    changed = true;
  } else if (idx === 0) {
    if (!LIVE.singers[0].reservedFirst) {
      LIVE.singers[0].reservedFirst = true;
      changed = true;
    }
  } else {
    const dismissed = canonSinger(LIVE._firstSlotDismissed || '');
    if (dismissed !== firstSinger && (LIVE.singers.length > 0 || forceEnsure)) {
      LIVE.singers.unshift({
        name: firstSinger,
        joinTime: 'Host #1',
        eligible: true,
        reservedFirst: true
      });
      getOrCreatePerf(firstSinger, 1);
      getOrCreatePerf(firstSinger, 2);
      getOrCreatePerf(firstSinger, 3);
      changed = true;
    }
  }
  return changed;
}

// Real-Time Listener for Singers Entering via "Start Zoom" Button on App
let zoomEntriesUnsub = null;
let plansEntriesUnsub = null;
function mergeZoomEntryIntoQueue(singerRaw, entryTime, eligible, tsVal) {
  const canonical = resolveCanonicalSingerName(singerRaw);
  if (!canonical) return false;
  const existing = LIVE.singers.find(s => canonSinger(s.name) === canonical);
  if (!existing) {
    LIVE.singers.push({
      name: canonical,
      joinTime: entryTime || curTime(),
      eligible: eligible !== false,
      viaZoomBtn: true,
      _ts: tsVal || Date.now()
    });
    getOrCreatePerf(canonical, 1);
    getOrCreatePerf(canonical, 2);
    getOrCreatePerf(canonical, 3);
    enforceReservedFirstPosition();
    return true;
  }
  if (existing.reservedFirst && !existing.viaZoomBtn) {
    existing.joinTime = entryTime || curTime();
    existing.eligible = eligible !== false;
    existing.viaZoomBtn = true;
    existing._ts = tsVal || Date.now();
    enforceReservedFirstPosition();
    return true;
  }
  return false;
}

function tallyLivePlanBallots(planDocs) {
  const counts = {};
  (LIVE.singers || []).forEach(s => { if (s && s.name) counts[canonSinger(s.name)] = 0; });
  if (SOTD_30S_VOTE && Array.isArray(SOTD_30S_VOTE.candidates)) {
    SOTD_30S_VOTE.candidates.forEach(c => { if (c && c.name) counts[canonSinger(c.name)] = 0; });
  }
  let totalBallots = 0;
  const countedVoters = new Set();
  const ballotLog = [];
  planDocs.forEach(d => {
    const voter = canonSinger(d.singer || '');
    const pick = canonSinger(d.sotdPick || '');
    const voterKey = d.uid || voter;
    const bTs = d.sotdBallotTs || d.upd || d.ts || 0;
    if (!pick) return;
    if (counts[pick] === undefined) {
      ballotLog.push({ voter: voter || d.email || 'Participant', pick, ts: bTs, counted: false, status: 'Not in active list' });
      return;
    }
    if (voterKey && countedVoters.has(voterKey)) {
      ballotLog.push({ voter: voter || d.email || 'Participant', pick, ts: bTs, counted: false, status: 'Duplicate' });
      return;
    }
    if (voter && isSelfOrFamily(voter, pick, d.phone || '', '')) {
      ballotLog.push({ voter: voter || d.email || 'Participant', pick, ts: bTs, counted: false, status: 'Excluded' });
      return;
    }
    if (voterKey) countedVoters.add(voterKey);
    counts[pick]++;
    totalBallots++;
    ballotLog.push({ voter: voter || d.email || 'Participant', pick, ts: bTs, counted: true, status: 'Counted' });
  });
  ballotLog.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  SOTD_30S_VOTE.ballotLog = ballotLog;
  if (Object.keys(counts).length || ballotLog.length) {
    SOTD_30S_VOTE.remoteCounts = counts;
    SOTD_30S_VOTE.totalRemoteBallots = totalBallots;
    drawSOTDSection();
  }
  if (SOTM_PANEL && Array.isArray(SOTM_PANEL.finalists)) {
    const voterSet = new Set();
    const sumBySinger = {};
    const judgeAccum = {};
    planDocs.forEach(d => {
      if (d.sotmBallots && typeof d.sotmBallots === 'object') {
        Object.entries(d.sotmBallots).forEach(([target, b]) => {
          if (b && typeof b.score === 'number') {
            voterSet.add(b.uid || b.voter || d.uid);
            sumBySinger[target] = (sumBySinger[target] || 0) + b.score;
          }
        });
      }
      if (d.sotmJudgeScores && typeof d.sotmJudgeScores === 'object') {
        Object.entries(d.sotmJudgeScores).forEach(([targetRaw, sc]) => {
          const target = canonSinger(targetRaw);
          if (!target || !sc) return;
          if (!judgeAccum[target]) judgeAccum[target] = { sur: 0, taal: 0, sel: 0, perf: 0, count: 0 };
          judgeAccum[target].sur += Number(sc.sur) || 0;
          judgeAccum[target].taal += Number(sc.taal) || 0;
          judgeAccum[target].sel += Number(sc.sel) || 0;
          judgeAccum[target].perf += Number(sc.perf) || 0;
          judgeAccum[target].count++;
        });
      }
    });
    let sotmChanged = false;
    if (voterSet.size > 0) {
      SOTM_PANEL.votersCount = voterSet.size;
      SOTM_PANEL.finalists.forEach(f => {
        if (sumBySinger[f.name] !== undefined) f.audience = sumBySinger[f.name];
      });
      sotmChanged = true;
    }
    if (Object.keys(judgeAccum).length > 0) {
      SOTM_PANEL.finalists.forEach(f => {
        const acc = judgeAccum[canonSinger(f.name)];
        if (acc && acc.count > 0) {
          f.sur = parseFloat((acc.sur / acc.count).toFixed(1));
          f.taal = parseFloat((acc.taal / acc.count).toFixed(1));
          f.sel = parseFloat((acc.sel / acc.count).toFixed(1));
          f.perf = parseFloat((acc.perf / acc.count).toFixed(1));
        }
      });
      sotmChanged = true;
    }
    if (sotmChanged) drawSOTMPanel();
  }
}

async function listenToZoomButtonEntries() {
  if (zoomEntriesUnsub) { zoomEntriesUnsub(); zoomEntriesUnsub = null; }
  if (plansEntriesUnsub) { plansEntriesUnsub(); plansEntriesUnsub = null; }
  // Keep off-schedule practice isolated from real participant Zoom clicks, while allowing the 5-min pre-session & live window
  if (!isWithinAdminLiveWindow()) return;

  const qPlans = query(collection(fs, 'plans'), where('date', '==', LIVE.date));
  const qZoom = query(collection(fs, 'zoom_entries'), where('date', '==', LIVE.date));

  try {
    const [pSnap, zSnap] = await Promise.all([getDocs(qPlans), getDocs(qZoom).catch(() => ({ docs: [] }))]);
    const combined = [];
    pSnap.docs.forEach(docSnap => {
      const d = docSnap.data();
      const zts = d.zoomTs || d.ts || 0;
      if (d.zoomEntered && d.singer && zts > SESSION_CLEARED_AT) {
        combined.push({ singer: d.singer, entryTime: d.zoomEntryTime, eligible: d.zoomEligible, ts: zts });
      }
    });
    zSnap.docs.forEach(docSnap => {
      const d = docSnap.data();
      const zts = d.ts || 0;
      if (d.singer && zts > SESSION_CLEARED_AT) {
        combined.push({ singer: d.singer, entryTime: d.entryTime, eligible: d.eligible, ts: zts });
      }
    });
    combined.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    let changed = false;
    combined.forEach(ent => {
      if (mergeZoomEntryIntoQueue(ent.singer, ent.entryTime, ent.eligible, ent.ts)) changed = true;
    });
    if (changed) { saveLocal(); draw(); }
  } catch (initZErr) {}

  plansEntriesUnsub = onSnapshot(qPlans, snap => {
    const docsData = snap.docs.map(d => d.data());
    const zoomDocs = docsData
      .filter(d => d.zoomEntered && d.singer && (d.zoomTs || d.ts || 0) > SESSION_CLEARED_AT)
      .sort((a, b) => (a.zoomTs || a.ts || 0) - (b.zoomTs || b.ts || 0));
    let changed = false;
    zoomDocs.forEach(ent => {
      if (mergeZoomEntryIntoQueue(ent.singer, ent.zoomEntryTime, ent.zoomEligible, ent.zoomTs || ent.ts)) changed = true;
    });
    if (changed) { saveLocal(); draw(); }
    tallyLivePlanBallots(docsData);
  }, err => console.warn('Plans auto-queue listener:', err));

  zoomEntriesUnsub = onSnapshot(qZoom, snap => {
    const entries = snap.docs
      .map(d => d.data())
      .filter(d => (d.ts || 0) > SESSION_CLEARED_AT)
      .sort((a, b) => (a.ts || 0) - (b.ts || 0));
    let changed = false;
    entries.forEach(ent => {
      if (mergeZoomEntryIntoQueue(ent.singer, ent.entryTime, ent.eligible, ent.ts)) changed = true;
    });
    if (changed) { saveLocal(); draw(); }
  }, () => {});
}

    if (cfgSnap.exists()) {
      CONF_CACHE = cfgSnap.data();
      if (CONF_CACHE.schedule) {
        SCHEDULE = { ...SCHEDULE, ...CONF_CACHE.schedule };
      }
      if (CONF_CACHE.starScoring) {
        STAR_SCORING = { ...STAR_SCORING, ...CONF_CACHE.starScoring };
      }
    }
  } catch (ce) {}

  lastScheduleMode = isWithinLiveSchedule();
  lastAdminWindowMode = isWithinAdminLiveWindow();
  LIVE = { date: tdy(), theme: '', host: '', singers: [], performances: [], sotdExtras: {}, sotdVoteWeight: 1, sotdVoteExcluded: [] };
  SOTD_LIST = [];
  currentRound = 1;

  if (!IS_SUPER && !isWithinAdminLiveWindow()) {
    if (zoomEntriesUnsub) { zoomEntriesUnsub(); zoomEntriesUnsub = null; }
    if (plansEntriesUnsub) { plansEntriesUnsub(); plansEntriesUnsub = null; }
    draw();
    return;
  }

  let wasExplicitlyEnded = false;
  let latestMeta = null;
  try {
    const liveSessSnap = await getDoc(doc(fs, 'live', 'session'));
    const lsDoc = liveSessSnap.exists() ? liveSessSnap.data() : null;
    const cfgLsDoc = (CONF_CACHE && CONF_CACHE.liveSession) ? CONF_CACHE.liveSession : null;
    latestMeta = [lsDoc, cfgLsDoc].filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || null;
    if (latestMeta && latestMeta.date === LIVE.date) {
      SESSION_CLEARED_AT = Math.max(SESSION_CLEARED_AT, latestMeta.sessionClearedAt || latestMeta.endedAt || 0);
      if (latestMeta.active === false && (latestMeta.endedAt || latestMeta.sessionClearedAt)) {
        wasExplicitlyEnded = true;
        try { localStorage.removeItem('sfh_live_session_' + LIVE.date); } catch(_x){}
        try { sessionStorage.removeItem('sfh_practice_session'); } catch(_x){}
      }
    }
    // Auto-clear any stale active live banner in Firestore when outside the live schedule
    if (!isWithinLiveSchedule() && latestMeta && latestMeta.active === true) {
      await writeLivePayloadEverywhere({
        date: latestMeta.date || LIVE.date,
        active: false,
        practice: false,
        singers: [],
        performances: [],
        sotdList: [],
        sotdVote: null,
        sotmVote: null,
        sessionClearedAt: Date.now(),
        endedAt: Date.now(),
        updatedAt: Date.now()
      });
    }
  } catch (_initMetaErr) {}

  if (!wasExplicitlyEnded) {
    loadLocal();
  }

  try {
    const removedSet = getRemovedSingersSet();
    const pubData = await getDoc(doc(fs, 'pub', 'data'));
    if(pubData.exists()){
      PUB_CACHE = pubData.data();
      KNOWN_SINGERS = [...new Set((PUB_CACHE.singers || []).map(canonSinger).filter(nm => nm && !removedSet.has(nm)))].sort();
      SONG_META_ARCHIVE = { ...(PUB_CACHE.songMeta || {}) };
      const savedMeta = (PUB_CACHE.sessionMeta && PUB_CACHE.sessionMeta[LIVE.date]) || null;
      if (savedMeta) {
        if (!LIVE.theme && savedMeta.theme) LIVE.theme = savedMeta.theme;
        if (!LIVE.host && savedMeta.host) LIVE.host = savedMeta.host;
      }
      if (!SOTD_LIST.length && !wasExplicitlyEnded && Array.isArray(PUB_CACHE.sotd)) {
        const pubTodaySotd = PUB_CACHE.sotd.find(x => x && x.d === LIVE.date && Array.isArray(x.l) && x.l.length);
        if (pubTodaySotd) {
          SOTD_LIST = pubTodaySotd.l.map(w => typeof w === 'string' ? { n: canonSinger(w), h: 'Score', reason: '' } : { n: canonSinger(w.n), h: w.h || 'Score', reason: w.reason || '' }).filter(w => w.n);
        }
      }
    }
  } catch(e) {}
  if (latestMeta && latestMeta.date === LIVE.date && !wasExplicitlyEnded) {
    if (!LIVE.theme && latestMeta.theme) LIVE.theme = latestMeta.theme;
    if (!LIVE.host && latestMeta.host) LIVE.host = latestMeta.host;
    if (!SOTD_LIST.length && Array.isArray(latestMeta.sotdList) && latestMeta.sotdList.length) {
      SOTD_LIST = latestMeta.sotdList.map(w => ({ n: canonSinger(w.n), h: w.h || 'Score', reason: w.reason || '' })).filter(w => w.n);
    }
  }
  if (IS_HOST && HOST_SINGER_NAME) {
    LIVE.host = HOST_SINGER_NAME;
  }

  // Load saved SOTM Judge Panel state if present in Firestore
  try {
    const sotmPanelSnap = await getDoc(doc(fs, 'vote', 'sotm_panel'));
    if (sotmPanelSnap.exists()) {
      SOTM_PANEL = { ...SOTM_PANEL, ...sotmPanelSnap.data() };
    }
    if (CONF_CACHE && Array.isArray(CONF_CACHE.sotmJudges)) {
      SOTM_PANEL.judges = CONF_CACHE.sotmJudges.map(j => String(j || '').trim().toUpperCase()).filter(Boolean);
    } else if (!Array.isArray(SOTM_PANEL.judges)) {
      SOTM_PANEL.judges = [];
    }
  } catch (pe) {}

  try {
    const ix = await getDoc(doc(fs, 'pub', 'idx'));
    if(ix.exists()){
      const ms = Object.keys(ix.data().months || {}).sort();
      const ds = await Promise.all(ms.map(m => getDoc(doc(fs, 'pub', 'songs_' + m))));
      ALL_SONGS = [].concat(...ds.map(d => d.exists() ? JSON.parse(d.data().json || '[]') : []));
    } else {
      const b = await getDoc(doc(fs, 'pub', 'songs'));
      if(b.exists()){
        ALL_SONGS = b.data().json ? JSON.parse(b.data().json) : (b.data().list || []);
      }
    }
    const existingIds = new Set(ALL_SONGS.map(r => r[0]));
    NOV16_SONGS.forEach(row => {
      if (!existingIds.has(row[0])) ALL_SONGS.push(row);
    });
    const removedSetSongs = getRemovedSingersSet();
    ALL_SONGS = ALL_SONGS
      .map(r => [r[0], r[1], canonSinger(r[2]), r[3]])
      .filter(r => !removedSetSongs.has(r[2]));
    ALL_SONGS.sort(cmpBySongId);

    MAX_ID_NUM = 0;
    ALL_SONGS.forEach(r => {
      let num = parseSongNum(r[0]);
      if(num > 143 && String(r[0]).includes('0144')) num = 143;
      if(num > MAX_ID_NUM) MAX_ID_NUM = num;
    });
  } catch(x) {}

  // Normalize any loaded singers/performances/SOTDs through singer aliases
  if (Array.isArray(LIVE.singers) && LIVE.singers.length) {
    const seenS = new Set();
    LIVE.singers = LIVE.singers.filter(s => {
      s.name = canonSinger(s.name);
      if (!s.name || seenS.has(s.name)) return false;
      seenS.add(s.name);
      return true;
    });
  }
  if (Array.isArray(LIVE.performances)) {
    LIVE.performances.forEach(p => { p.singer = canonSinger(p.singer); });
  }
  if (Array.isArray(SOTD_LIST)) {
    SOTD_LIST.forEach(w => { w.n = canonSinger(w.n); });
  }

  if (isWithinLiveSchedule() && !wasExplicitlyEnded) {
    const todayPubSongs = ALL_SONGS.filter(r => r[1] === LIVE.date);
    todayPubSongs.forEach(r => {
      const [sId, dt, sName, sTitle] = r;
      if (!LIVE.singers.some(s => s.name === sName)) {
        LIVE.singers.push({ name: sName, joinTime: 'Queued', eligible: true });
      }
      let existing = LIVE.performances.find(p => p.songId === sId);
      if (!existing) {
        const archivedMeta = SONG_META_ARCHIVE[String(sTitle || '').trim().toUpperCase()] || {};
        LIVE.performances.push({
          round: 1,
          singer: sName,
          song: sTitle,
          songId: sId,
          stars: [false, false, false, false, false],
          repeatCount: Math.max(0, checkRepeat(sTitle) - 1),
          meta: { ...archivedMeta },
          _metaSong: hasMetaFields(archivedMeta) ? String(sTitle || '').trim().toUpperCase() : ''
        });
      }
    });
  }

  (LIVE.performances || []).forEach(p => {
    const sk = String(p.song || '').trim().toUpperCase();
    if (sk && !hasMetaFields(p.meta) && hasMetaFields(SONG_META_ARCHIVE[sk])) {
      p.meta = { ...SONG_META_ARCHIVE[sk] };
      p._metaSong = sk;
    }
  });

  if (LIVE.singers.length > 0) {
    enforceReservedFirstPosition();
  }

  listenToZoomButtonEntries();
  draw();
}

function getNextSongId(){
  if (!isWithinLiveSchedule()) {
    const usedPractice = new Set();
    LIVE.performances.forEach(p => {
      if (p.song && p.songId && String(p.songId).startsWith('P-')) {
        const num = parseSongNum(p.songId);
        if (num > 0) usedPractice.add(num);
      }
    });
    let nextP = 1;
    while (usedPractice.has(nextP)) nextP++;
    PRACTICE_COUNTER = Math.max(PRACTICE_COUNTER, nextP);
    return 'P-' + String(nextP).padStart(4, '0');
  }
  let baseMax = MAX_ID_NUM;
  ALL_SONGS.forEach(r => {
    // Only lock IDs from previous dates; today's IDs come from active LIVE.performances so deleted IDs reuse immediately
    if (r[1] !== LIVE.date) {
      const num = parseSongNum(r[0]);
      if (num > baseMax) baseMax = num;
    }
  });
  const usedToday = new Set();
  LIVE.performances.forEach(p => {
    if (p.song && p.songId) {
      const num = parseSongNum(p.songId);
      if (num > 0) usedToday.add(num);
    }
  });
  let candidate = baseMax + 1;
  while (usedToday.has(candidate)) candidate++;
  return 'S-' + String(candidate).padStart(4, '0');
}

function checkRepeat(songTitle){
  if(!songTitle) return 0;
  const t = songTitle.trim().toUpperCase();
  let cnt = 0;
  ALL_SONGS.forEach(r => { if(String(r[3]||'').trim().toUpperCase() === t) cnt++; });
  if (!isWithinLiveSchedule()) {
    LIVE.performances.forEach(r => { if(String(r.song||'').trim().toUpperCase() === t) cnt++; });
  }
  return cnt;
}

function getOrCreatePerf(singerName, round) {

      songId: '',
      stars: [false, false, false, false, false],

function parseManualTime24ToDate(hhmm) {
  const now = new Date();
  if (!hhmm || !hhmm.includes(':')) return now;
  const [h, m] = hhmm.split(':').map(Number);
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
}

function format12HourTime(dt) {
  return dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
}

function to24HourInput(joinTimeStr) {
  if (!joinTimeStr) {
    const n = new Date();
    return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }
  const m = String(joinTimeStr).trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
  if (!m) {
    const n = new Date();
    return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }
  let hh = parseInt(m[1], 10);
  const mm = m[2];
  const ap = (m[3] || '').toLowerCase();
  if (ap === 'pm' && hh < 12) hh += 12;
  if (ap === 'am' && hh === 12) hh = 0;
  return String(hh).padStart(2, '0') + ':' + mm;
}

window.updateSingerJoinTime = (idx, hhmm) => {
  const s = LIVE.singers[idx];
  if (!s || !hhmm) return;
  const dt = parseManualTime24ToDate(hhmm);
  s.joinTime = format12HourTime(dt);
  s.eligible = isBeforeCutoff(dt);
  saveLocal();
  draw();
};

window.addSinger = () => {
  if(LIVE.singers.length >= 59){
    showNotice('Session capacity reached.');
    return;
  }
  const inp = $('#in_singer');
  const timeInp = $('#in_singer_time');
  const name = resolveCanonicalSingerName(inp.value);
  if(!name){ showNotice('Please enter or select singer name.'); return; }

  const entryDt = (timeInp && timeInp.value) ? parseManualTime24ToDate(timeInp.value) : new Date();
  const existing = LIVE.singers.find(s => canonSinger(s.name) === name);
  if (existing) {
    if (existing.reservedFirst && !existing.viaZoomBtn && !existing.manualAdded) {
      existing.joinTime = format12HourTime(entryDt);
      existing.eligible = isBeforeCutoff(entryDt);
      existing.manualAdded = true;
      inp.value = '';
      saveLocal();
      draw();
      return;
    }
    showNotice('Singer already in session.');
    return;
  }

  if (canonSinger(LIVE._firstSlotDismissed || '') === name) {
    LIVE._firstSlotDismissed = '';
  }

  LIVE.singers.push({
    name,
    joinTime: format12HourTime(entryDt),
    eligible: isBeforeCutoff(entryDt),
    manualAdded: true
  });

  getOrCreatePerf(name, 1);
  getOrCreatePerf(name, 2);
  getOrCreatePerf(name, 3);
  enforceReservedFirstPosition();

  inp.value = '';
  saveLocal();
  draw();
};

window.removeSinger = (idx) => {
  const s = LIVE.singers[idx];
  if (!s) return;
  showConfirm('Remove ' + s.name + " from today's singing order?", async () => {
    const name = s.name;
    if (canonSinger(name) === getReservedFirstSinger()) {
      LIVE._firstSlotDismissed = canonSinger(name);
    }
    LIVE.singers.splice(idx, 1);
    LIVE.performances = LIVE.performances.filter(p => p.singer !== name);
    try { localStorage.setItem('sfh_live_session_'+LIVE.date, JSON.stringify({LIVE, currentRound, SOTD_LIST})); } catch(x){}
    draw();
    await pushLiveSessionNow();
  });
};

let UNIQUE_SONG_CATALOG = [];
function getUniqueSongCatalog() {
  const map = new Map();
  ALL_SONGS.forEach(r => {
    const t = (r[3] || '').trim().toUpperCase();
    if (!t) return;
    map.set(t, (map.get(t) || 0) + 1);
  });
  (LIVE.performances || []).forEach(p => {
    const t = (p.song || '').trim().toUpperCase();
    if (t && !map.has(t)) map.set(t, 1);
  });
  UNIQUE_SONG_CATALOG = [...map.entries()]
    .map(([title, count]) => ({ title, count }))
    .sort((a, b) => a.title.localeCompare(b.title));
  return UNIQUE_SONG_CATALOG;
}

function hasMetaFields(m) {
  return !!(m && ['orig', 'comp', 'lyr', 'mov', 'yr', 'act'].some(k => String(m[k] || '').trim()));
}

function cleanMetaObj(m) {
  const src = m || {};
  return {
    orig: String(src.orig || '').trim(),
    comp: String(src.comp || '').trim(),
    lyr: String(src.lyr || '').trim(),
    mov: String(src.mov || '').trim(),
    yr: String(src.yr || '').trim(),
    act: String(src.act || '').trim()
  };
}

function formatMetaTooltip(m) {
  if (!hasMetaFields(m)) return 'AI Song Metadata (Auto-fills when song is entered; click to view/edit)';
  const parts = [];
  if (m.mov || m.yr) parts.push(`${m.mov || ''}${m.mov && m.yr ? ' (' + m.yr + ')' : (m.yr || '')}`.trim());
  if (m.orig) parts.push(`Singer: ${m.orig}`);
  if (m.comp) parts.push(`Music: ${m.comp}`);
  if (m.lyr) parts.push(`Lyrics: ${m.lyr}`);
  if (m.act) parts.push(`Actor: ${m.act}`);
  return 'AI Metadata Saved — ' + parts.join(' | ');
}

let STATIC_HOST_NO_API = false;

function stripWikiHtml(html) {
  return String(html || '')
    .replace(/<sup[\s\S]*?<\/sup>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<(?:br|li|p|div)[^>]*>/gi, ', ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ').replace(/&#\d+;/g, ' ').replace(/&quot;/g, '"')
    .replace(/\b(?:Songs|Score)\s*:\s*/gi, '')
    .replace(/\s*\([^)]*(?:soundtrack|film|song|composer|singer|actor|lyricist|lyrics|score|songs)[^)]*\)/gi, '')
    .replace(/\s*,\s*(?:,\s*)+/g, ', ')
    .replace(/\s*,\s*/g, ', ')
    .replace(/\s+/g, ' ')
    .replace(/^[\s,•–-]+|[\s,•–-]+$/g, '');
}

function parseWikiInfoboxHtml(html) {
  const boxM = String(html || '').match(/<table[^>]*class="[^"]*infobox[^"]*"[\s\S]*?<\/table>/i);
  if (!boxM) return null;
  const rows = {};
  const headers = [];
  const trRe = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  let m;
  while ((m = trRe.exec(boxM[0])) !== null) {
    const th = m[1].match(/<th[^>]*>([\s\S]*?)<\/th>/i);
    const td = m[1].match(/<td[^>]*>([\s\S]*?)<\/td>/i);
    if (th && td) {
      const k = stripWikiHtml(th[1]).toLowerCase();
      const v = stripWikiHtml(td[1]);
      if (k && v) rows[k] = v;
    } else if (th) {
      headers.push(stripWikiHtml(th[1]));
    }
  }
  rows._headers = headers.join(' | ');
  return rows;
}

async function fetchWikiInfobox(pageTitle) {
  try {
    const url = 'https://en.wikipedia.org/w/api.php?action=parse&page=' + encodeURIComponent(pageTitle) + '&prop=text&section=0&redirects=1&format=json&origin=*';
    const r = await fetch(url);
    if (!r.ok) return null;
    const j = await r.json();
    const html = j && j.parse && j.parse.text && j.parse.text['*'];
    return html ? parseWikiInfoboxHtml(html) : null;
  } catch (_) {
    return null;
  }
}

async function fetchPublicSongMetadata(songTitle) {
  const title = String(songTitle || '').trim();
  const meta = { orig: '', comp: '', lyr: '', mov: '', yr: '', act: '' };
  if (!title) return meta;
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const titleNorm = norm(title);

  const [itRes, wpRes] = await Promise.all([
    fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(title) + '&entity=song&country=IN&limit=8').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(title + ' song') + '&srlimit=5&format=json&origin=*').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);

  const hits = (wpRes?.query?.search || []).filter(h => !/\((?:tv series|television|serial)\)/i.test(h.title));
  for (const hit of hits.slice(0, 3)) {
    const box = await fetchWikiInfobox(hit.title);
    if (!box) continue;
    const hdr = box._headers || '';
    const isSongBox = Boolean(
      box['artist'] || box['composer(s)'] || box['composer'] || box['lyricist(s)'] || box['lyricist'] ||
      box['songwriter(s)'] || box['album'] || /\b(?:song|single)\s+by\b/i.test(hdr)
    );
    if (!isSongBox) continue;
    const byMatch = hdr.match(/\b(?:song|single)\s+by\s+([^|]+?)(?:\s+from\s+the\s+(?:album|film)\s+([^|]+))?(?:\||$)/i);
    meta.orig = box['artist'] || box['singer(s)'] || box['singer'] || (byMatch && byMatch[1] ? byMatch[1].trim() : '') || meta.orig;
    meta.comp = box['composer(s)'] || box['composer'] || box['music'] || meta.comp;
    meta.lyr = box['lyricist(s)'] || box['lyricist'] || box['songwriter(s)'] || meta.lyr;
    meta.mov = box['film'] || box['album'] || (byMatch && byMatch[2] ? byMatch[2].trim() : '') || meta.mov;
    const yrM = String(box['released'] || box['recorded'] || '').match(/\b(19\d{2}|20\d{2})\b/);
    if (yrM) meta.yr = yrM[1];
    break;
  }

  const itAll = (itRes?.results || []).filter(x => !/\b(remix|drill|lofi|lo-fi|cover|karaoke|instrumental|mashup)\b/i.test((x.trackName || '') + ' ' + (x.collectionName || '')));
  const bestIt = itAll.find(x => norm(x.trackName).includes(titleNorm) || titleNorm.includes(norm(x.trackName).slice(0, 8))) || itAll[0];
  if (bestIt) {
    if (!meta.orig && bestIt.artistName) meta.orig = String(bestIt.artistName).trim();
    if (!meta.mov) {
      const fromMatch = String(bestIt.trackName || '').match(/\(From\s+["'\u201c]([^"'\u201d]+)["'\u201d]\)/i);
      const albClean = String(bestIt.collectionName || '').replace(/\s*\([^)]*(?:Soundtrack|Motion Picture|EP|Single)[^)]*\)/gi, '').trim();
      meta.mov = (fromMatch && fromMatch[1]) ? fromMatch[1].trim() : albClean;
    }
    if (!meta.yr && bestIt.releaseDate) {
      const y = String(bestIt.releaseDate).slice(0, 4);
      if (/^(19|20)\d{2}$/.test(y)) meta.yr = y;
    }
  }

  if (meta.mov && (!meta.act || !meta.comp || !meta.yr)) {
    const mvSrch = await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(meta.mov + ' film ' + (meta.yr || '')) + '&srlimit=4&format=json&origin=*').then(r => r.ok ? r.json() : null).catch(() => null);
    const mvHits = (mvSrch?.query?.search || []).filter(h => !/\((?:tv series|television|serial|soundtrack)\)/i.test(h.title));
    for (const mh of mvHits.slice(0, 2)) {
      const mbox = await fetchWikiInfobox(mh.title);
      if (!mbox || (!mbox['directed by'] && !mbox['starring'])) continue;
      if (!meta.act && mbox['starring']) {
        meta.act = mbox['starring'].split(',').map(x => x.trim()).filter(Boolean).slice(0, 3).join(', ');
      }
      if (!meta.comp && mbox['music by']) meta.comp = mbox['music by'].split(',').map(x => x.trim()).filter(Boolean).slice(0, 3).join(', ');
      if (!meta.yr && (mbox['release date'] || mbox['release dates'])) {
        const my = String(mbox['release date'] || mbox['release dates']).match(/\b(19\d{2}|20\d{2})\b/);
        if (my) meta.yr = my[1];
      }
      break;
    }
  }
  return cleanMetaObj(meta);
}

async function fetchSongMetadataSmart(songTitle, force = false) {
  if (!STATIC_HOST_NO_API) {
    try {
      const resp = await fetch('/api/song-metadata', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ songTitle, force }),
      });
      const ct = resp.headers.get('content-type') || '';
      if (resp.status === 405 || resp.status === 404 || (!ct.includes('application/json') && !resp.ok)) {
        STATIC_HOST_NO_API = true;
      } else {
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data && data.meta) {
          return { meta: cleanMetaObj(data.meta), source: 'ai' };
        }
        if (resp.status === 429) {
          const waitSec = Math.max(15, Number(data.retryAfterSec) || 45);
          AI_COOLDOWN_UNTIL = Date.now() + waitSec * 1000;
        }
      }
    } catch (_) {}
  }
  const fallbackMeta = await fetchPublicSongMetadata(songTitle);
  return { meta: fallbackMeta, source: 'public' };
}

async function runAutoMetaAI(singerName, round) {
  const sKey = round + '_' + singerName.replace(/[^a-zA-Z0-9]/g, '_');
  const p = getOrCreatePerf(singerName, round);
  const songTitle = String(p.song || '').trim().toUpperCase();
  if (!songTitle || songTitle.length < 3) return;

  // Instant fill from permanent archive if already known
  if (hasMetaFields(SONG_META_ARCHIVE[songTitle])) {
    p.meta = cleanMetaObj(SONG_META_ARCHIVE[songTitle]);
    p._metaSong = songTitle;
    saveLocal();
    updateRowAiButton(singerName, round, 'filled');
    return;
  }

  if (p._metaSong === songTitle && hasMetaFields(p.meta)) {
    updateRowAiButton(singerName, round, 'filled');
    return;
  }
  // AI metadata collection starts only during session time (Online)
  if (!isOnlineSessionTime()) return;
  if (AUTO_META_INFLIGHT[sKey] === songTitle) return;

  AUTO_META_INFLIGHT[sKey] = songTitle;
  updateRowAiButton(singerName, round, 'loading');

  try {
    const { meta: aiMeta } = await fetchSongMetadataSmart(songTitle, false);

    // Ensure the user has not changed the song title while waiting
    if (String(p.song || '').trim().toUpperCase() !== songTitle) return;

    if (hasMetaFields(aiMeta)) {
      p.meta = aiMeta;
      p._metaSong = songTitle;
      saveLocal();
      persistSongMetaEntry(songTitle, aiMeta);
      updateRowAiButton(singerName, round, 'filled');

      if (OPEN_META_CTX && OPEN_META_CTX.singerName === singerName && OPEN_META_CTX.round === round) {
        ['orig', 'comp', 'lyr', 'mov', 'yr', 'act'].forEach(k => {
          const inp = $('#meta_' + k);
          if (inp && !inp.value.trim() && aiMeta[k]) inp.value = aiMeta[k];
        });
        const statusEl = $('#meta_ai_status');
        if (statusEl) {
          statusEl.style.color = '#15803d';
          statusEl.textContent = '✓ Automatically filled and archived song metadata.';
        }
      }
    } else {
      p._metaSong = songTitle;
      updateRowAiButton(singerName, round, 'idle');
    }
  } catch (err) {
    console.warn('Auto AI metadata lookup warning:', err?.message || err);
    updateRowAiButton(singerName, round, hasMetaFields(p.meta) ? 'filled' : 'idle');
  } finally {
    if (AUTO_META_INFLIGHT[sKey] === songTitle) {
      delete AUTO_META_INFLIGHT[sKey];
    }
  }
}

function scheduleAutoMetaAI(singerName, round, immediate = false) {
  const sKey = round + '_' + singerName.replace(/[^a-zA-Z0-9]/g, '_');
  if (AUTO_META_TIMERS[sKey]) {
    clearTimeout(AUTO_META_TIMERS[sKey]);
    delete AUTO_META_TIMERS[sKey];
  }
  const p = getOrCreatePerf(singerName, round);
  const songTitle = String(p.song || '').trim().toUpperCase();
  if (!songTitle || songTitle.length < 3) return;

  if (hasMetaFields(SONG_META_ARCHIVE[songTitle])) {
    p.meta = { ...SONG_META_ARCHIVE[songTitle] };
    p._metaSong = songTitle;
    saveLocal();
    updateRowAiButton(singerName, round, 'filled');
    return;
  }

  if (!isOnlineSessionTime()) return;
  if (immediate) {
    runAutoMetaAI(singerName, round);
  }
}

window.onSongInput = (singerName, round, showDrop = true) => {
  const sIdSanitized = round + '_' + singerName.replace(/[^a-zA-Z0-9]/g, '_');
  const songInp = $('#sg_' + sIdSanitized);
  const fl = document.getElementById('floating-song-ac');
  const p = getOrCreatePerf(singerName, round);

  const song = (songInp.value || '').trim().toUpperCase();
  const idEl = $('#id_' + sIdSanitized);

  if(!song){
    p.song = '';
    p.songId = '';
    p.repeatCount = 0;
    p.meta = {};
    p._metaSong = '';
    if (AUTO_META_TIMERS[sIdSanitized]) {
      clearTimeout(AUTO_META_TIMERS[sIdSanitized]);
      delete AUTO_META_TIMERS[sIdSanitized];
    }
    updateRowAiButton(singerName, round, 'idle');
    if(idEl) idEl.innerHTML = '<span class="m">-</span>';
    if(fl) fl.style.display = 'none';
    saveLocal();
    drawSOTDSection();
    return;
  }

  // Render floating fixed-position song suggestions (never clipped by table scroll!)
  if (fl && showDrop && songInp) {
    const catalog = getUniqueSongCatalog();
    const starts = catalog.filter(item => item.title.startsWith(song) && item.title !== song);
    const contains = catalog.filter(item => !item.title.startsWith(song) && item.title.includes(song) && item.title !== song);
    const matches = [...starts, ...contains].slice(0, 10);
    if (matches.length) {
      const rect = songInp.getBoundingClientRect();
      fl.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 280)) + 'px';
      fl.style.top = (rect.bottom + 2) + 'px';
      fl.style.width = Math.max(240, rect.width + 45) + 'px';
      fl.innerHTML = matches.map(m =>
        `<div class="song-ac-item" onmousedown="event.preventDefault();pickSongSuggestion('${e(singerName).replace(/'/g, "\\'")}', ${round}, '${e(m.title).replace(/'/g, "\\'")}')">` +
          `<span>${e(m.title)}</span>` +
          `<span class="m" style="font-size:10.5px;white-space:nowrap">${m.count}x</span>` +
        `</div>`
      ).join('');
      fl.style.display = 'block';
    } else {
      fl.style.display = 'none';
    }
  }

  const prevSong = String(p.song || '').trim().toUpperCase();
  const rep = checkRepeat(song);
  p.song = song;
  p.repeatCount = rep;
  if (!p.songId) {
    p.songId = getNextSongId();
  }

  if (prevSong !== song) {
    if (hasMetaFields(SONG_META_ARCHIVE[song])) {
      p.meta = { ...SONG_META_ARCHIVE[song] };
      p._metaSong = song;
      updateRowAiButton(singerName, round, 'filled');
    } else if (p._metaSong && p._metaSong !== song) {
      p.meta = {};
      p._metaSong = '';
      updateRowAiButton(singerName, round, 'idle');
    }
  }

  if(idEl){
    idEl.innerHTML = `<b>${p.songId}</b>`;
  }

  saveLocal();
  drawSOTDSection();
};

window.fetchSongMetaAI = async (singerName, round, overwriteAll = true) => {
  const p = getOrCreatePerf(singerName, round);
  const songTitle = (p.song || '').trim().toUpperCase();
  const statusEl = $('#meta_ai_status');
  const btnEl = $('#btn_meta_ai');

  if (!songTitle) {
    if (statusEl) {
      statusEl.style.color = '#d97706';
      statusEl.textContent = 'Enter a song title first so AI can look up its details.';
    }
    return;
  }

  if (!isOnlineSessionTime()) {
    if (statusEl) {
      statusEl.style.color = '#d97706';
      statusEl.textContent = 'Offline mode (out of session time): AI metadata collection starts during session time only.';
    }
    return;
  }

  if (btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = 'AI Loading…';
  }
  if (statusEl) {
    statusEl.style.color = 'var(--ac)';
    statusEl.textContent = `Fetching metadata for "${songTitle}" with AI…`;
  }
  updateRowAiButton(singerName, round, 'loading');

  try {
    const { meta: aiMeta } = await fetchSongMetadataSmart(songTitle, overwriteAll);
    const fields = ['orig', 'comp', 'lyr', 'mov', 'yr', 'act'];
    let filledCount = 0;
    fields.forEach(k => {
      const inp = $('#meta_' + k);
      if (!inp) return;
      const val = aiMeta[k];
      if (val && (overwriteAll || !inp.value.trim())) {
        inp.value = val;
        filledCount++;
      }
    });
    if (filledCount > 0) {
      p.meta = cleanMetaObj({
        orig: ($('#meta_orig')?.value || aiMeta.orig),
        comp: ($('#meta_comp')?.value || aiMeta.comp),
        lyr: ($('#meta_lyr')?.value || aiMeta.lyr),
        mov: ($('#meta_mov')?.value || aiMeta.mov),
        yr: ($('#meta_yr')?.value || aiMeta.yr),
        act: ($('#meta_act')?.value || aiMeta.act),
      });
      p._metaSong = songTitle;
      saveLocal();
      persistSongMetaEntry(songTitle, p.meta);
      updateRowAiButton(singerName, round, 'filled');
    } else {
      updateRowAiButton(singerName, round, hasMetaFields(p.meta) ? 'filled' : 'idle');
    }
    if (statusEl) {
      statusEl.style.color = filledCount > 0 ? '#15803d' : '#d97706';
      statusEl.textContent = filledCount > 0
        ? `✓ AI filled & saved ${filledCount} field${filledCount === 1 ? '' : 's'} to archives.`
        : 'AI could not find verified details for this title. You can enter them manually.';
    }
  } catch (err) {
    updateRowAiButton(singerName, round, hasMetaFields(p.meta) ? 'filled' : 'idle');
    if (statusEl) {
      statusEl.style.color = '#dc2626';
      statusEl.textContent = err?.message || 'Could not fetch AI metadata right now.';
    }
  } finally {
    if (btnEl) {
      btnEl.disabled = false;
      btnEl.textContent = '✨ Refresh AI';
    }
  }
};

// ==============================================================================
// 1-MINUTE STAR-ELIGIBLE SOTD VOTING PANEL
// ==============================================================================
function getSotdExcludedSet() {
  const arr = (LIVE && Array.isArray(LIVE.sotdVoteExcluded)) ? LIVE.sotdVoteExcluded : [];
  return new Set(arr.map(x => canonSinger(x)).filter(Boolean));
}

function hasGivenStarsForSinger(singerName) {
  const cn = canonSinger(singerName);
  if (!cn) return false;
  return (LIVE.performances || []).some(p =>
    canonSinger(p.singer) === cn &&
    Array.isArray(p.stars) &&
    p.stars.some(Boolean)
  );
}

function shouldEnforceStarEligibility() {
  if (IS_SUPER) return true;
  return (LIVE.performances || []).some(p => Array.isArray(p.stars) && p.stars.some(Boolean));
}

function computeSingerSotdMetrics(s, voteWeight) {
  const perfs = LIVE.performances.filter(p => p.singer === s.name && p.song);
  const starPerfs = LIVE.performances.filter(p => p.singer === s.name && Array.isArray(p.stars) && p.stars.some(Boolean));
  const count = perfs.length;
  const starRoundCount = new Set([...perfs.map(p => p.round), ...starPerfs.map(p => p.round)]).size;
  const starTotalPts = parseFloat(starPerfs.reduce((sum, p) => sum + calcStarPoints(p.stars), 0).toFixed(2));
  const starAvgPts = starRoundCount > 0 ? parseFloat((starTotalPts / starRoundCount).toFixed(2)) : 0;
  const ex = getSotdExtra(s.name);
  const opinionPts = parseFloat(ex.opinion) || 0;
  const quizPts = parseFloat(ex.quiz) || 0;
  const votes = getSotdVotesFor(s.name);
  const votePts = parseFloat((votes * voteWeight).toFixed(2));
  const finalScore = parseFloat((starAvgPts + opinionPts + quizPts + votePts).toFixed(2));
  return {
    name: s.name,
    eligible: s.eligible,
    joinTime: s.joinTime || '',
    songsSung: count,
    starRounds: starRoundCount,
    starTotalPts,
    starPts: starAvgPts,
    totalPts: starTotalPts,
    avgPts: starAvgPts,
    opinionPts,
    quizPts,
    votes,
    votePts,
    finalScore
  };
}

function getPreviousSessionSotdInfo() {
  const arr = (PUB_CACHE && Array.isArray(PUB_CACHE.sotd)) ? PUB_CACHE.sotd : [];
  const todayKey = String(LIVE.date || tdy());
  const prevEntries = arr
    .filter(x => x && x.d && String(x.d) < todayKey && Array.isArray(x.l) && x.l.length > 0)
    .sort((a, b) => String(b.d).localeCompare(String(a.d)));
  if (!prevEntries.length) return { date: '', winners: new Set(), names: [] };
  const prev = prevEntries[0];
  const names = prev.l
    .map(w => canonSinger(typeof w === 'string' ? w : (w && w.n)))
    .filter(Boolean);
  return { date: prev.d, winners: new Set(names), names };
}

function isPreviousDaySotd(singerName) {
  const cn = canonSinger(singerName);
  if (!cn) return false;
  return getPreviousSessionSotdInfo().winners.has(cn);
}

function getAllActiveSOTDCandidates(includeExcluded = false) {
  const voteWeight = getSotdVoteWeight();
  const excluded = includeExcluded ? new Set() : getSotdExcludedSet();
  const requireStars = shouldEnforceStarEligibility();
  return (LIVE.singers || [])
    .filter(s => s && s.name && !isPreviousDaySotd(s.name) && !excluded.has(canonSinger(s.name)) && (!requireStars || hasGivenStarsForSinger(s.name)))
    .map(s => computeSingerSotdMetrics(s, voteWeight));
}

function getSotdExtra(singerName) {
  if (!LIVE.sotdExtras || typeof LIVE.sotdExtras !== 'object') LIVE.sotdExtras = {};

function getSotdVoteWeight() {
  const w = parseFloat(LIVE.sotdVoteWeight);
  return (!isNaN(w) && w >= 0) ? w : 1;
}

function getSotdVotesFor(singerName) {
  const rem = (SOTD_30S_VOTE && SOTD_30S_VOTE.remoteCounts && SOTD_30S_VOTE.remoteCounts[singerName]) || 0;
  const loc = (SOTD_30S_VOTE && SOTD_30S_VOTE.localCounts && SOTD_30S_VOTE.localCounts[singerName]) || 0;
  return rem + loc;
}

window.onSotdExtraInput = (singerName, field, rawVal) => {
  if (!IS_SUPER) return;
  const ex = getSotdExtra(singerName);
  ex[field] = parseFloat(rawVal) || 0;
  saveLocal();
  const sKey = singerName.replace(/[^a-zA-Z0-9]/g, '_');
  const totEl = document.getElementById('sotd_final_' + sKey);
  if (totEl) {
    const rec = getRankedSOTDCandidates().find(x => x.name === singerName);
    if (rec) totEl.textContent = rec.finalScore + ' pts';
  }
};

window.setSotdExtra = (singerName, field, rawVal) => {
  if (!IS_SUPER) return;
  const ex = getSotdExtra(singerName);
  ex[field] = parseFloat(rawVal) || 0;
  saveLocal();
  drawSOTDSection();
};

window.bumpSotdQuiz = (singerName, delta) => {
  if (!IS_SUPER) return;
  const ex = getSotdExtra(singerName);
  ex.quiz = Math.max(0, parseFloat(((parseFloat(ex.quiz) || 0) + delta).toFixed(2)));
  saveLocal();
  drawSOTDSection();
};

window.setSotdVoteWeight = (rawVal) => {
  if (!IS_SUPER) return;
  const w = parseFloat(rawVal);
  LIVE.sotdVoteWeight = (!isNaN(w) && w >= 0) ? w : 1;
  saveLocal();
  drawSOTDSection();
};

window.startSOTD30sVote = async () => {
  if (!IS_SUPER && !IS_HOST) return;
  const allActive = getAllActiveSOTDCandidates();
  if (!allActive.length) {
    showNotice(shouldEnforceStarEligibility()
      ? 'Give stars (5-star system) to at least one singer above first — only starred singers are eligible for SOTD & the 1-Min Vote Card.'
      : 'Add active singers to the queue first so SOTD voting can begin.');
    return;
  }
  if (sotdTimerInterval) clearInterval(sotdTimerInterval);
  // Preserve already-tallied votes if reopened for participants who have not voted yet
  const prevLocal = (SOTD_30S_VOTE && SOTD_30S_VOTE.localCounts) ? { ...SOTD_30S_VOTE.localCounts } : {};
  const prevRemote = (SOTD_30S_VOTE && SOTD_30S_VOTE.remoteCounts) ? { ...SOTD_30S_VOTE.remoteCounts } : {};
  const localCounts = {};
  const remoteCounts = {};
  allActive.forEach(c => {
    localCounts[c.name] = prevLocal[c.name] || 0;
    remoteCounts[c.name] = prevRemote[c.name] || 0;
  });
  SOTD_30S_VOTE = {
    active: true,
    candidates: allActive.map(c => ({ name: c.name, totalPts: c.starPts, avgPts: c.avgPts, finalScore: c.finalScore })),
    remaining: 60,
    endsAt: Date.now() + 60000,
    localCounts,
    remoteCounts,
    totalRemoteBallots: Object.values(remoteCounts).reduce((a, b) => a + b, 0)
  };
  drawSOTDSection();
  await pushLiveSessionNow();
  sotdTimerInterval = setInterval(async () => {
    SOTD_30S_VOTE.remaining--;
    if (SOTD_30S_VOTE.remaining <= 0) {
      clearInterval(sotdTimerInterval);
      sotdTimerInterval = null;
      SOTD_30S_VOTE.active = false;
      SOTD_30S_VOTE.remaining = 0;
      await pushLiveSessionNow();
    }
    const card = document.getElementById('sotd_section_card');
    const activeEl = document.activeElement;
    if (SOTD_30S_VOTE.active && card && activeEl && card.contains(activeEl) && activeEl.tagName === 'INPUT') {
      const badge = document.getElementById('sotd_timer_badge');
      if (badge) badge.textContent = `⏳ ${SOTD_30S_VOTE.remaining}s left`;
    } else {
      drawSOTDSection();
    }
  }, 1000);
};

window.stopSOTD30sVote = async () => {
  if (!IS_SUPER && !IS_HOST) return;
  if (sotdTimerInterval) clearInterval(sotdTimerInterval);
  sotdTimerInterval = null;
  SOTD_30S_VOTE.active = false;
  drawSOTDSection();
  await pushLiveSessionNow();
};

window.recordSOTD30sJudgePick = (singerName) => {
  if (!SOTD_30S_VOTE.localCounts) SOTD_30S_VOTE.localCounts = {};
  SOTD_30S_VOTE.localCounts[singerName] = (SOTD_30S_VOTE.localCounts[singerName] || 0) + 1;
  drawSOTDSection();
};

window.toggleSOTDWinner = (name, modeLabel = 'Score') => {
  const cn = canonSinger(name);
  if (!cn) return;
  const idx = SOTD_LIST.findIndex(x => canonSinger(x.n) === cn);
  if (idx >= 0) {
    SOTD_TOUCHED = true;
    SOTD_LIST.splice(idx, 1);
  } else {
    if (isPreviousDaySotd(cn)) {
      const prevInfo = getPreviousSessionSotdInfo();
      showNotice(`${cn} won SOTD in the previous session (${fd(prevInfo.date)}) and cannot repeat on the next day.`);
      return;
    }
    SOTD_TOUCHED = true;
    SOTD_LIST.push({ n: cn, h: modeLabel, reason: '' });
  }
  saveLocal();
  drawSOTDSection();
};

window.addSOTD = () => {
  const selVal = $('#sotd_winner') ? $('#sotd_winner').value : '';
  const overrideInp = $('#sotd_override_singer') ? ($('#sotd_override_singer').value || '').trim().toUpperCase() : '';
  const isOverride = Boolean(IS_SUPER && overrideInp);
  const winner = isOverride ? resolveCanonicalSingerName(overrideInp) : canonSinger(selVal);
  const mode = $('#sotd_mode') ? $('#sotd_mode').value : 'score';
  const reason = $('#sotd_reason') ? $('#sotd_reason').value.trim() : '';
  if(!winner){ showNotice('Please choose or enter an SOTD singer.'); return; }
  if(SOTD_LIST.some(x => canonSinger(x.n) === winner)){ showNotice('This singer is already declared SOTD today.'); return; }

  const modeLabel = mode === 'score' ? 'Score' : (mode === 'special' ? 'Special' : 'Quiz');
  const commitAdd = () => {
    SOTD_TOUCHED = true;
    SOTD_LIST.push({ n: winner, h: modeLabel, reason });
    if ($('#sotd_winner')) $('#sotd_winner').value = '';
    if ($('#sotd_reason')) $('#sotd_reason').value = '';
    if ($('#sotd_override_singer')) $('#sotd_override_singer').value = '';
    saveLocal();
    drawSOTDSection();
  };

  if (isPreviousDaySotd(winner)) {
    const prevInfo = getPreviousSessionSotdInfo();
    if (!isOverride) {
      showNotice(`${winner} won SOTD in the previous session (${fd(prevInfo.date)}) and cannot repeat on the next day.`);
      return;
    }
    showConfirm(`${winner} won SOTD in the previous session (${fd(prevInfo.date)}). Normally SOTD cannot repeat on the next day — still declare via Superadmin Override?`, commitAdd, 'Override No-Repeat Rule');
    return;
  }

  commitAdd();
};

window.removeSOTD = (idx) => {
  SOTD_TOUCHED = true;
  SOTD_LIST.splice(idx, 1);
  saveLocal();
  drawSOTDSection();
};

function getRankedSOTDCandidates() {
  const requireStars = shouldEnforceStarEligibility();
  const basePool = (IS_SUPER ? LIVE.singers : LIVE.singers.filter(s => s.eligible))
    .filter(s => s && s.name && !isPreviousDaySotd(s.name));
  const pool = requireStars ? basePool.filter(s => hasGivenStarsForSinger(s.name)) : basePool;
  const voteWeight = getSotdVoteWeight();
  return pool
    .map(s => computeSingerSotdMetrics(s, voteWeight))
    .sort((a, b) => b.finalScore - a.finalScore || b.starPts - a.starPts || b.votes - a.votes || b.starTotalPts - a.starTotalPts || b.songsSung - a.songsSung);
}

window.inspectSotdAudienceBallots = () => {
  const allActive = getAllActiveSOTDCandidates(true);
  const log = (SOTD_30S_VOTE && Array.isArray(SOTD_30S_VOTE.ballotLog)) ? SOTD_30S_VOTE.ballotLog : [];
  const counted = log.filter(b => b.counted);
  const bySinger = {};
  allActive.forEach(c => {
    bySinger[c.name] = {
      remote: (SOTD_30S_VOTE && SOTD_30S_VOTE.remoteCounts && SOTD_30S_VOTE.remoteCounts[c.name]) || 0,
      local: (SOTD_30S_VOTE && SOTD_30S_VOTE.localCounts && SOTD_30S_VOTE.localCounts[c.name]) || 0
    };
  });
  const summaryRows = Object.entries(bySinger)
    .map(([nm, v]) => ({ name: nm, remote: v.remote, local: v.local, total: v.remote + v.local }))
    .sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));

  const fmtT = ts => {
    if (!ts) return '—';
    try { return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true }); }
    catch (_e) { return '—'; }
  };

  const m = $('#custom-modal');
  $('#custom-modal-body').innerHTML = `
    <h3>🔍 SOTD Audience Ballots Breakdown</h3>
    <p class="m" style="margin:2px 0 8px">
      Session: <b>${e(fd(LIVE.date))}</b> · Counted Audience Ballots: <b>${counted.length}</b> / ${log.length} received
    </p>
    ${summaryRows.length ? `
      <div class="tbl" style="margin-bottom:10px"><table>
        <tr><th>Singer</th><th class="n">Audience</th><th class="n">Manual +1</th><th class="n">Total</th></tr>
        ${summaryRows.map(r => `<tr>
          <td><b>${e(r.name)}</b></td>
          <td class="n">${r.remote}</td>
          <td class="n">${r.local}</td>
          <td class="n"><b>${r.total}</b></td>
        </tr>`).join('')}
      </table></div>
    ` : ''}
    <b style="font-size:12.5px">Individual Audience Ballots (${log.length})</b>
    ${log.length ? `
      <div class="tbl" style="max-height:260px;overflow:auto;margin-top:6px"><table>
        <tr><th class="n">#</th><th>Voter</th><th>Voted For</th><th>Time</th><th>Status</th></tr>
        ${log.map((b, idx) => `<tr>
          <td class="n">${idx + 1}</td>
          <td><b>${e(b.voter)}</b></td>
          <td>${e(b.pick)}</td>
          <td style="white-space:nowrap;font-size:11.5px">${e(fmtT(b.ts))}</td>
          <td><span style="font-size:11px;font-weight:700;color:${b.counted ? '#15803d' : '#b45309'}">${e(b.status)}</span></td>
        </tr>`).join('')}
      </table></div>
    ` : '<p class="m" style="margin:6px 0">No audience SOTD ballots received yet for today.</p>'}
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="pri" onclick="closeModal()">Close</button>
    </div>
  `;
  m.style.display = 'flex';
};

function getSOTMComputedStandings() {
  return SOTM_PANEL.finalists.map(f => {
    const jTotal = (parseFloat(f.sur)||0) + (parseFloat(f.taal)||0) + (parseFloat(f.sel)||0) + (parseFloat(f.perf)||0);
    const aud = parseFloat(f.audience) || 0;
    const gTotal = parseFloat((jTotal + aud).toFixed(1));
    return {
      ...f,
      judgeTotal: parseFloat(jTotal.toFixed(1)),
      grandTotal: gTotal
    };
  }).sort((a, b) => b.grandTotal - a.grandTotal || b.judgeTotal - a.judgeTotal);
}

window.triggerSOTM30sVote = async (singerName) => {
  if (sotmBlindInterval) clearInterval(sotmBlindInterval);
  SOTM_PANEL.activeBlindVote = { singer: singerName, remaining: 30, endsAt: Date.now() + 30000 };
  drawSOTMPanel();
  await pushLiveSessionNow();
  sotmBlindInterval = setInterval(async () => {
    if (!SOTM_PANEL.activeBlindVote) return;
    SOTM_PANEL.activeBlindVote.remaining--;
    if (SOTM_PANEL.activeBlindVote.remaining <= 0) {
      clearInterval(sotmBlindInterval);
      sotmBlindInterval = null;
      SOTM_PANEL.activeBlindVote = null;
      await pushLiveSessionNow();
    }
    drawSOTMPanel();
  }, 1000);
};

async function buildAndSaveMasterBackup(songsSnapshot, pDataSnapshot, sotmSnapshot, isOfflinePractice = false) {
  const now = new Date();
  const stamp = LIVE.date + '_' + String(now.getHours()).padStart(2,'0') + '-' + String(now.getMinutes()).padStart(2,'0');
  const fileName = isOfflinePractice ? `SFH_Offline_Practice_${stamp}.json` : `SFH_Master_Backup_${stamp}.json`;

  const sMetaMerged = { ...((pDataSnapshot && pDataSnapshot.sessionMeta) || (PUB_CACHE && PUB_CACHE.sessionMeta) || {}) };
  const liveTh = (LIVE.theme || '').trim();
  const liveHo = (LIVE.host || '').trim().toUpperCase();
  if (liveTh || liveHo) sMetaMerged[LIVE.date] = { theme: liveTh, host: liveHo };

  const masterObj = {
    kind: isOfflinePractice ? 'sfh-offline-practice' : 'sfh-master-backup',
    version: 'v42',
    generatedAt: now.toISOString(),
    ts: LIVE.date + ' ' + curTime(),
    songs: (songsSnapshot || []).slice().sort(cmpBySongId),
    singers: (pDataSnapshot && pDataSnapshot.singers) || KNOWN_SINGERS,
    sotd: (pDataSnapshot && pDataSnapshot.sotd) || [],
    som: (pDataSnapshot && pDataSnapshot.som) || {},
    somd: (pDataSnapshot && pDataSnapshot.somd) || {},
    stars: (pDataSnapshot && pDataSnapshot.stars) || {},
    songMeta: mergeAllSongMeta((pDataSnapshot && pDataSnapshot.songMeta) || {}),
    sessionMeta: sMetaMerged,
    holidays: CONF_CACHE.holidays || [],
    schedule: SCHEDULE,
    starScoring: STAR_SCORING,
    sotmResult: sotmSnapshot || null
  };

  const jsonStr = JSON.stringify(masterObj, null, 2);

  try {
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (_e) {}
    }, 1500);
  } catch (dlErr) {
    console.warn('Download fallback warning:', dlErr);
  }

  return { fileName, jsonStr };
}

async function emailBackupToSuperadmin({ fileName, jsonStr, performedCount, theme, host, sotdList }) {
  const superEmail = (CFG.superadmins && CFG.superadmins[0]) || 'musicsnsounds@gmail.com';
  const sotdSummary = (sotdList || []).map(w => `${w.n}${w.h && w.h !== 'Score' ? ' (' + w.h + ')' : ''}`).join(', ');
  let emailed = false;
  let configured = false;

  try {
    const resp = await fetch('/api/email-backup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fileName,
        jsonContent: jsonStr,
        date: fd(LIVE.date),
        theme: theme || '',
        host: host || '',
        performedCount: performedCount || 0,
        sotdSummary,
        triggeredBy: (U && U.email) || host || 'Live Console'
      })
    });
    const ct = resp.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        emailed = true;
        configured = true;
      } else if (data && data.configured === false) {
        configured = false;
      }
    }
  } catch (_emailErr) {}

  // Log automatic session backup receipt to Superadmin inbox only when a Host (non-Superadmin) ends a session
  if (!IS_SUPER) {
    try {
      await addDoc(collection(fs, 'inbox'), {
        uid: (U && U.uid) || 'host-session',
        email: (U && U.email) || '',
        name: `Host Backup (${host || (U && U.displayName) || 'Host'})`,
        singer: host || (U && U.displayName) || 'HOST',
        text: `[AUTO BACKUP] Session ${fd(LIVE.date)} ended by Host. Backup file: ${fileName} | Songs: ${performedCount || 0} | Theme: ${theme || '—'} | Host: ${host || '—'}${sotdSummary ? ' | SOTD: ' + sotdSummary : ''}${emailed ? ' (Emailed to ' + superEmail + ')' : ''}`,
        ts: Date.now(),
        date: LIVE.date,
        backupFileName: fileName,
        emailed
      });
    } catch (_inbErr) {}
  }

  return { emailed, configured, recipient: superEmail };
}

async function commitSessionDataToFirestore() {
  const performed = LIVE.performances.filter(p => p.song).slice().sort(cmpBySongId);
  const mo = LIVE.date.slice(0, 7);

  const mDocRef = doc(fs, 'pub', 'songs_' + mo);
  const mDoc = await getDoc(mDocRef);
  let mSongs = mDoc.exists() ? JSON.parse(mDoc.data().json || '[]') : [];

  mSongs = mSongs.filter(r => r[1] !== LIVE.date);
  performed.forEach(p => {
    mSongs.push([p.songId, LIVE.date, canonSinger(p.singer), p.song]);
  });
  mSongs.sort(cmpBySongId);

  const mJson = JSON.stringify(mSongs);
  const hashStr = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h >>> 0); };
  const mHash = hashStr(mJson);
  await setDoc(mDocRef, {
    json: mJson,
    n: mSongs.length,
    h: mHash,
    ts: LIVE.date
  });

  // Ensure pub/idx includes this month so Home always loads newly published months
  try {
    const idxRef = doc(fs, 'pub', 'idx');
    const idxSnap = await getDoc(idxRef);
    const idxData = idxSnap.exists() ? idxSnap.data() : { months: {}, total: 0 };
    const monthsMap = { ...(idxData.months || {}) };
    monthsMap[mo] = { n: mSongs.length, h: mHash };
    await setDoc(idxRef, { ...idxData, months: monthsMap, ts: LIVE.date });
  } catch (_idxErr) {}

  // Auto-capture any singer selected in the SOTD dropdown/override box if the user forgot to tap "+ Add SOTD"
  if (!SOTD_LIST.length) {
    const pendingSel = $('#sotd_winner') ? String($('#sotd_winner').value || '').trim() : '';
    const pendingOver = (IS_SUPER && $('#sotd_override_singer')) ? String($('#sotd_override_singer').value || '').trim().toUpperCase() : '';
    const pendingName = pendingOver ? resolveCanonicalSingerName(pendingOver) : canonSinger(pendingSel);
    if (pendingName) {
      const mVal = $('#sotd_mode') ? $('#sotd_mode').value : 'score';
      const rVal = $('#sotd_reason') ? $('#sotd_reason').value.trim() : '';
      const modeLabel = mVal === 'score' ? 'Score' : (mVal === 'special' ? 'Special' : 'Quiz');
      SOTD_LIST.push({ n: pendingName, h: modeLabel, reason: rVal });
      SOTD_TOUCHED = true;
    }
  }

  const dataDocRef = doc(fs, 'pub', 'data');
  const dataDoc = await getDoc(dataDocRef);
  let pData = dataDoc.exists() ? dataDoc.data() : { singers: [], sotd: [], stars: {} };
  if (!Array.isArray(pData.singers)) pData.singers = [];
  if (!Array.isArray(pData.sotd)) pData.sotd = [];
  if (!pData.stars || typeof pData.stars !== 'object') pData.stars = {};

  let sotdArr = pData.sotd.slice();
  if (SOTD_LIST.length) {
    sotdArr = sotdArr.filter(x => x && x.d !== LIVE.date);
    sotdArr.push({
      d: LIVE.date,
      l: SOTD_LIST.map(x => ({ n: canonSinger(x.n), h: x.h || 'Score' })).filter(x => x.n)
    });
    sotdArr.sort((a, b) => String(a.d || '').localeCompare(String(b.d || '')));
  } else if (SOTD_TOUCHED) {
    sotdArr = sotdArr.filter(x => x && x.d !== LIVE.date);
  }

  let starsObj = { ...pData.stars };
  SOTD_LIST.forEach(sWinner => {
    const sk = canonSinger(sWinner && sWinner.n);
    if (!sk) return;
    const prev = (starsObj[sk] && typeof starsObj[sk] === 'object') ? { ...starsObj[sk] } : { t: 0, d: [], m: {} };
    if (!Array.isArray(prev.d)) prev.d = [];
    if (!prev.m || typeof prev.m !== 'object') prev.m = {};
    if (!prev.d.includes(LIVE.date)) {
      prev.d = [...prev.d, LIVE.date];
      prev.t = (Number(prev.t) || 0) + 1;
    }
    starsObj[sk] = prev;
  });

  (LIVE.singers || []).forEach(s => {
    const cn = canonSinger(s && s.name);
    if (cn && !pData.singers.includes(cn)) pData.singers.push(cn);
  });
  pData.singers.sort();
  pData.sotd = sotdArr;
  pData.stars = starsObj;
  pData.songMeta = mergeAllSongMeta(pData.songMeta || {});
  const sMeta = { ...(pData.sessionMeta || {}) };
  const themeVal = (LIVE.theme || '').trim();
  const hostVal = (LIVE.host || '').trim().toUpperCase();
  if (themeVal || hostVal) sMeta[LIVE.date] = { theme: themeVal, host: hostVal };
  else delete sMeta[LIVE.date];
  pData.sessionMeta = sMeta;
  pData.ts = LIVE.date;
  SONG_META_ARCHIVE = { ...pData.songMeta };
  if (PUB_CACHE) {
    PUB_CACHE.sotd = sotdArr;
    PUB_CACHE.stars = starsObj;
    PUB_CACHE.songMeta = { ...pData.songMeta };
    PUB_CACHE.sessionMeta = { ...sMeta };
  }

  const fullSongs = ALL_SONGS.filter(r => r[1] !== LIVE.date);
  performed.forEach(p => fullSongs.push([p.songId, LIVE.date, canonSinger(p.singer), p.song]));
  fullSongs.sort(cmpBySongId);

  await setDoc(dataDocRef, pData);
  return { performed, pData, fullSongs };
}

let PARTICIPANT_PREVIEW_OPEN = false;
let PREVIEW_SINGER_LIVE = '';
let PREVIEW_SOTD_PICKS = {};
let PREVIEW_SOTM_SCORES = {};

window.setLivePreviewSinger = (val) => {
  PREVIEW_SINGER_LIVE = (val || '').trim().toUpperCase();
  renderLiveParticipantPreview();
};

window.previewCastSOTDVote = (singerName) => {
  if (!SOTD_30S_VOTE || !SOTD_30S_VOTE.active) return;
  const voterKey = PREVIEW_SINGER_LIVE || '_PREVIEW_';
  if (PREVIEW_SOTD_PICKS[voterKey]) return;
  if (PREVIEW_SINGER_LIVE && isSelfOrFamily(PREVIEW_SINGER_LIVE, singerName)) return;
  if (!SOTD_30S_VOTE.localCounts) SOTD_30S_VOTE.localCounts = {};
  PREVIEW_SOTD_PICKS[voterKey] = singerName;
  SOTD_30S_VOTE.localCounts[singerName] = (SOTD_30S_VOTE.localCounts[singerName] || 0) + 1;
  drawSOTDSection();
};

window.previewCastSOTMBallot = async (targetSinger, score) => {
  if (!SOTM_PANEL || !SOTM_PANEL.activeBlindVote) return;
  const prev = PREVIEW_SOTM_SCORES[targetSinger];
  const f = (SOTM_PANEL.finalists || []).find(x => x.name === targetSinger);
  if (f) {
    if (typeof prev === 'number') {
      f.audience = Math.max(0, parseFloat(((parseFloat(f.audience) || 0) - prev + score).toFixed(1)));
    } else {
      f.audience = parseFloat(((parseFloat(f.audience) || 0) + score).toFixed(1));
      SOTM_PANEL.votersCount = (SOTM_PANEL.votersCount || 0) + 1;
    }
  }
  PREVIEW_SOTM_SCORES[targetSinger] = score;
  drawSOTMPanel();
};

window.previewTestZoomJoin = () => {
  const singer = PREVIEW_SINGER_LIVE || (KNOWN_SINGERS[0] || 'TEST SINGER');
  if (!singer) return;
  if (LIVE.singers.some(s => s.name === singer)) {
    showNotice(`${singer} is already in today's singing queue.`);
    return;
  }
  const now = new Date();
  const joinTime = format12HourTime(now);
  const eligible = isBeforeCutoff(now);
  LIVE.singers.push({ name: singer, joinTime, eligible, viaZoomBtn: true });
  getOrCreatePerf(singer, 1);
  enforceReservedFirstPosition();
  saveLocal();
  draw();
};

window.toggleLiveParticipantPreview = () => {

  if (pane) pane.classList.toggle('open', PARTICIPANT_PREVIEW_OPEN);

    renderLiveParticipantPreview();

window.setSessionThemeHost = (field, val) => {
  if (field !== 'theme' && field !== 'host') return;
  if (IS_HOST && field === 'host') {
    LIVE.host = HOST_SINGER_NAME;
    return;
  }
  LIVE[field] = field === 'host' ? String(val || '').toUpperCase() : String(val || '');
  saveLocal();
  if (typeof renderLiveParticipantPreview === 'function' && PARTICIPANT_PREVIEW_OPEN) {
    renderLiveParticipantPreview();
  }
};

window.applyHostFirstPosition = () => {
  if (IS_HOST && HOST_SINGER_NAME) {

  LIVE._firstSlotDismissed = '';
  if (LIVE.singers.length > 0 && enforceReservedFirstPosition()) {

    draw();

};

              <div style="display:flex;align-items:center;white-space:nowrap">
                <div class="song-ac-wrap">
                  <input id="sg_${sKey}" autocomplete="off" value="${e(p.song || '')}" placeholder="Type song..." style="width:195px;text-transform:uppercase" oninput="onSongInput('${safeSinger}', ${currentRound}, true)" onfocus="onSongInput('${safeSinger}', ${currentRound}, true)" onblur="onSongBlur('${safeSinger}', ${currentRound})" onkeydown="if(event.key==='Escape')closeAllSongDropdowns();if(event.key==='Enter'){closeAllSongDropdowns();onSongBlur('${safeSinger}', ${currentRound});}">
                </div>
                <button id="ai_btn_${sKey}" class="btn-meta ${isAiLoading ? 'loading' : (hasMeta ? 'filled' : '')}" style="margin-left:6px" onclick="openMeta('${safeSinger}', ${currentRound})" title="${e(formatMetaTooltip(p.meta))}">${isAiLoading ? 'AI…' : 'AI'}</button>
              </div>
            </td>
            <td id="id_${sKey}">
              ${p.song ? `<b>${p.songId}</b>` : '<span class="m">-</span>'}
            </td>
            ${IS_SUPER ? `<td>
              <div class="score-box" title="★1: Ready (1pt) | ★2: <=30s (1pt) | ★3: Clean (1pt) [★1+2=4, ★2+3=4.5, ★1+3=5, ★1+2+3=6] | ★4: Good (1pt) | ★5: Better (2pts) [★4+5=5]">
                ${[0,1,2,3,4].map(sIdx => `<span id="star_${sKey}_${sIdx}" class="score-star ${p.stars[sIdx]?'active':''}" onclick="toggleStar('${safeSinger}', ${currentRound}, ${sIdx})">★</span>`).join('')}
              </div>
              <span id="score_txt_${sKey}" class="m" style="font-size:11px;margin-left:4px">(${pts} pts)</span>
            </td>` : ''}
            <td style="text-align:center">
              <button onclick="removeSinger(${idx})" title="Remove singer from queue" style="padding:3px 9px;font-weight:700">R</button>
            </td>
          </tr>`;
        }).join('')}
      </table></div>
    ` : `<p class="m">Waiting for singers to tap Start Zoom in the app, or add singers manually above. Position #1 is automatically reserved for <b>${e(reservedFirst)}</b>.</p>`}
    
    
  </div>`;

  h += `<div class="c" id="sotd_section_card">${renderSOTDHTML()}</div>`;

  // Always-On SOTM Judge Panel & 30s Blind Voting Card (Superadmin Only)
  if (IS_SUPER) {
    h += `<div class="c" id="sotm_always_on_panel">${renderSOTMPanelHTML()}</div>`;
  }

  if (IS_SUPER) {
    h += `<div class="c">
      <b>5-Star Point & Bonus Logic Reference (Superadmin Only)</b>
      <div class="m" style="margin-top:4px;line-height:1.6">
        • <b>★1 Ready on Turn:</b> ${STAR_SCORING.s1} pt &nbsp;|&nbsp; <b>★2 Start ≤ 30 sec:</b> ${STAR_SCORING.s2} pt &nbsp;|&nbsp; <b>★3 Cleanliness (No Noise):</b> ${STAR_SCORING.s3} pt<br>
        • <b>Group A Combos:</b> <b>★1+★2 = ${STAR_SCORING.s1+STAR_SCORING.s2+STAR_SCORING.b12} pts</b> (+${STAR_SCORING.b12}) &nbsp;|&nbsp; <b>★2+★3 = ${STAR_SCORING.s2+STAR_SCORING.s3+STAR_SCORING.b23} pts</b> (+${STAR_SCORING.b23}) &nbsp;|&nbsp; <b>★1+★3 = ${STAR_SCORING.s1+STAR_SCORING.s3+STAR_SCORING.b13} pts</b> (+${STAR_SCORING.b13}) &nbsp;|&nbsp; <b>★1+★2+★3 = ${STAR_SCORING.s1+STAR_SCORING.s2+STAR_SCORING.s3+STAR_SCORING.b123} pts</b> (+${STAR_SCORING.b123})<br>
        • <b>★4 Good Singing:</b> ${STAR_SCORING.s4} pt &nbsp;|&nbsp; <b>★5 Better Singing:</b> ${STAR_SCORING.s5} pts &nbsp;→&nbsp; <b>★4+★5 = ${STAR_SCORING.s4+STAR_SCORING.s5+STAR_SCORING.b45} pts</b> (+${STAR_SCORING.b45})<br>
        • <b>Auto-Queue via Zoom Button:</b> Singers tapping <b>Start Zoom</b> in the app are automatically added to the queue with their exact entry timestamp.
      </div>
    </div>`;
  }

  $('#app').innerHTML = h;
  if (PARTICIPANT_PREVIEW_OPEN) {
    renderLiveParticipantPreview();
  }
}
</script></body></html>
