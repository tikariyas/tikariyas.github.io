window.saveHomeSotdEdits = async () => {
  if (!IS_SUPER) return;
  const dt = HOME_SOTD_EDIT_DATE;
  if (!dt) return;
  const pendingNm = canonSinger($('#hs_singer') ? $('#hs_singer').value : '');
  if (pendingNm && !HOME_SOTD_EDIT_LIST.some(x => x.n === pendingNm)) {
    HOME_SOTD_EDIT_LIST.push({ n: pendingNm, h: ($('#hs_mode') && $('#hs_mode').value) || 'Score' });
  }
  try {
    const dataRef = doc(fs, 'pub', 'data');
    const snap = await getDoc(dataRef);
    const pData = snap.exists() ? snap.data() : { singers: [], sotd: [], stars: {} };
    if (!Array.isArray(pData.singers)) pData.singers = [];
    if (!Array.isArray(pData.sotd)) pData.sotd = [];
    const starsObj = (pData.stars && typeof pData.stars === 'object') ? { ...pData.stars } : {};

    const prevEntry = pData.sotd.find(x => x && normDate(x.d) === dt);
    const prevWinners = new Set(((prevEntry && prevEntry.l) || []).map(w => canonSinger(typeof w === 'string' ? w : (w && w.n))).filter(Boolean));
    const newWinners = new Set(HOME_SOTD_EDIT_LIST.map(w => canonSinger(w.n)).filter(Boolean));

    // Remove star for anyone removed from this date's SOTD
    prevWinners.forEach(nm => {
      if (!newWinners.has(nm) && starsObj[nm]) {
        const cur = { ...starsObj[nm] };
        const arr = Array.isArray(cur.d) ? cur.d.filter(x => normDate(x) !== dt) : [];
        if (Array.isArray(cur.d) && arr.length !== cur.d.length) {
          cur.d = arr;
          cur.t = Math.max(0, (Number(cur.t) || 0) - 1);
          starsObj[nm] = cur;
        }
      }
    });

    // Add star for each declared SOTD on this date
    newWinners.forEach(nm => {
      const cur = (starsObj[nm] && typeof starsObj[nm] === 'object') ? { ...starsObj[nm] } : { t: 0, d: [], m: {} };
      if (!Array.isArray(cur.d)) cur.d = [];
      if (!cur.m || typeof cur.m !== 'object') cur.m = {};
      if (!cur.d.some(x => normDate(x) === dt)) {
        cur.d = [...cur.d, dt];
        cur.t = (Number(cur.t) || 0) + 1;
      }
      starsObj[nm] = cur;
      if (!pData.singers.includes(nm)) pData.singers.push(nm);
    });

    let sotdArr = pData.sotd.filter(x => x && normDate(x.d) !== dt);
    if (HOME_SOTD_EDIT_LIST.length) {
      sotdArr.push({ d: dt, l: HOME_SOTD_EDIT_LIST.map(w => ({ n: canonSinger(w.n), h: w.h || 'Score' })) });
      sotdArr.sort((a, b) => String(a.d || '').localeCompare(String(b.d || '')));
    }

    pData.sotd = sotdArr;
    pData.stars = starsObj;
    pData.singers.sort();
    pData.ts = tdy();

    await setDoc(dataRef, pData);
    closeModal();
    await load();
    draw();
    showNotice(HOME_SOTD_EDIT_LIST.length
      ? `Updated Singer of the Day for ${fd(dt)}: ${HOME_SOTD_EDIT_LIST.map(w => w.n).join(', ')}`
      : `Cleared Singer of the Day for ${fd(dt)}.`, 'SOTD Saved');
  } catch (err) {
    showNotice('Failed to save SOTD: ' + (err.code || err.message), 'Error');
  }
};

window.syncHistoricalSOTD = async () => {

      const existingDates = new Set(curSotd.map(x => x.d));
      let added = 0;
      HISTORICAL_SOTD_PRE_OCT26.forEach(item => {

          curSotd.push(item);

      draw();
      showNotice(`Synced ${added} historical SOTD date(s) permanently to Firestore!`, "SOTD History Saved");

      showNotice("Failed to sync historical SOTD: " + (err.code || err.message));

  }, "Save Past SOTD History");
};

  const L=PUB.sotd||[],somd=PUB.somd||{},somE=Object.entries(PUB.som||{}).sort().reverse(),lm=somE.length?somE[0][0]:'',ld=somd[lm]||'';
  const cyc=L.filter(x=>ld?x.d>ld:(!lm||x.d.slice(0,7)>lm)).slice().reverse();
  const sk=(curP().singer||'').toUpperCase();

        if (!rec.specialDates.includes(entry.d)) rec.specialDates.push(entry.d);
      } else {
        if (!rec.scoreDates.includes(entry.d)) rec.scoreDates.push(entry.d);
      }
    });
  });

  Object.entries(PUB.stars || {}).forEach(([rawName, o]) => {
    const name = String(rawName || '').trim().toUpperCase();
    if (!name) return;
    if (!singerMap.has(name)) {
      singerMap.set(name, { name, dates: [], scoreDates: [], specialDates: [], genuineStars: 0 });
    }
    const rec = singerMap.get(name);
    rec.genuineStars = Math.max(0, o.t || 0);
    (o.d || []).forEach(dt => {
      if (!rec.dates.some(x => x.d === dt)) {
        rec.dates.push({ d: dt, h: 'Score' });
      }
      if (!rec.scoreDates.includes(dt)) rec.scoreDates.push(dt);
    });
  });

  const mergedList = Array.from(singerMap.values()).map(rec => {
    rec.dates.sort((a, b) => a.d.localeCompare(b.d));
    const totalEarned = Math.max(rec.scoreDates.length, rec.genuineStars);
    const lostCount = Math.max(0, totalEarned - rec.genuineStars);
    return {
      ...rec,
      totalEarned,
      lostCount
    };
  }).sort((a, b) => b.genuineStars - a.genuineStars || b.totalEarned - a.totalEarned || a.name.localeCompare(b.name));

  let h=`<div class="c" style="border-left:4px solid #f59e0b;background:var(--ac-light)">
    <b>Singer of the Month Award Announcement</b>
    <p class="m" style="margin:3px 0 0;line-height:1.5">Qualify with 4 stars to enter the monthly SOTM competition. Winner receives a custom-crafted stainless steel <b>G-Clef Memento Award</b> by Tikariya’s School of Music.</p>
  </div>`;

  h+=`<div class="c"><b>Singer of the Month</b>${somE.length?`<div class="tbl"><table><tr><th style="width:110px">Month</th><th>Winner</th><th>Declared</th></tr>${somE.slice(0,6).map(([m,n])=>`<tr><td><b>${e(fm(m))}</b></td><td><b>${e(n)}</b></td><td><span class="m">${somd[m]?fd(somd[m]):'-'}</span></td></tr>`).join('')}</table></div>`:'<p class="m">Not declared yet.</p>'}</div>`;

  h+=`<div class="c"><b>Singers of the Day${lm?' since the Singer of the Month '+e(fm(lm))+(ld?' ('+fd(ld)+')':''):''}</b><p class="m" style="margin:2px 0 6px">Current SOTM qualification cycle.</p>${cyc.length?`<div class="tbl"><table><tr><th style="width:95px;min-width:95px">Date</th><th>Singer</th></tr>${cyc.map(x=>`<tr><td style="width:95px;min-width:95px"><span class="m">${fd(x.d)}</span></td><td>${nmL(x.l)}</td></tr>`).join('')}</table></div>`:'<p class="m">None yet in this new round.</p>'}</div>`;

  // Merged Star Singers & All Past SOTD Table (4 Columns)
  h+=`<div class="c">
    <div class="row" style="justify-content:space-between">
      <b>Star Singers & SOTD History (${mergedList.length})</b>
      ${effSuper() ? `<button class="pri" style="font-size:11px;padding:3px 8px" onclick="syncHistoricalSOTD()">Save History to Cloud</button>` : ''}
    </div>
    <p class="m" style="margin:2px 0 6px">
      <span style="color:#f59e0b;font-weight:700">★</span> Genuine Active Star &nbsp;·&nbsp;
      <span style="color:#94a3b8;opacity:0.42;font-weight:700">★</span> Lost / Reset Star
    </p>
    ${mergedList.length?`<div class="tbl"><table>
      <tr>
        <th>Singer</th>
        <th>Dates</th>
        <th style="min-width:110px">Stars</th>
        <th class="n" style="width:85px">Genuine</th>
      </tr>
      ${mergedList.map(rec => {
        const activeStarsHTML = '<span style="color:#f59e0b;letter-spacing:1px">' + '★'.repeat(Math.min(rec.genuineStars, 10)) + '</span>';
        const lostStarsHTML = rec.lostCount > 0 ? '<span style="color:#94a3b8;opacity:0.42;letter-spacing:1px" title="' + rec.lostCount + ' star(s) lost or reset">' + '★'.repeat(Math.min(rec.lostCount, 10)) + '</span>' : '';
        const datesFormatted = rec.dates.length
          ? rec.dates.map(x => `<span style="white-space:nowrap">${fd(x.d)}${x.h === 'Special' ? ' <span class="m">(Spl)</span>' : x.h === 'Quiz' ? ' <span class="m">(Quiz)</span>' : ''}</span>`).join(', ')
          : '<span class="m">-</span>';
        return `<tr class="${rec.name === sk ? 'me' : ''}">
          <td><b>${e(rec.name)}</b>${rec.genuineStars >= 4 ? ' <span class="badge-ok">Finalist</span>' : ''}</td>
          <td style="white-space:normal;min-width:160px;font-size:12px;line-height:1.4">${datesFormatted}</td>
          <td>${activeStarsHTML}${lostStarsHTML}${(!rec.genuineStars && !rec.lostCount) ? '<span class="m">-</span>' : ''}</td>
          <td class="n"><b>${rec.genuineStars}</b></td>
        </tr>`;
      }).join('')}
    </table></div>`:'<p class="m">No SOTD or star records yet.</p>'}
  </div>`;

  return h;
}

function getMondayOfWeek(dateStr) {
  const d = new Date((dateStr || tdy()) + 'T00:00:00');
  const day = d.getDay(); // 0=Sun, 1=Mon...
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.setDate(diff));
  return mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0');
}

function getWeekDatesMonToFri(mondayStr) {
  const base = new Date(mondayStr + 'T00:00:00');
  const dates = [];
  for (let i = 0; i < 5; i++) {
    const dt = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    dates.push(dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'));
  }
  return dates;
}

window.previewWeeklyAttendanceRule = () => {
  if (!PUB || !PUB.stars) { showNotice('Published star records not loaded.'); return; }
  const mon = ruleEvalWeekStart || getMondayOfWeek(tdy());
  ruleEvalWeekStart = mon;
  const weekDates = getWeekDatesMonToFri(mon); // Mon-Fri
  const weekHolidays = weekDates.filter(d => HOLIDAYS.includes(d));
  const requiredDays = Math.max(1, 3 - weekHolidays.length); // 3 normally, 2 if 1 holiday in week

  // Map first ever appearance date for every singer in SONGS to detect mid-week new joiners
  const firstSongDateMap = {};
  SONGS.forEach(r => {
    const sg = String(r[2] || '').trim().toUpperCase();
    const dt = String(r[1] || '');
    if (sg && dt) {
      if (!firstSongDateMap[sg] || dt < firstSongDateMap[sg]) {
        firstSongDateMap[sg] = dt;
      }
    }
  });

  const results = [];
  Object.entries(PUB.stars).forEach(([singerName, starObj]) => {
    const currentStars = starObj.t || 0;
    if (currentStars <= 0) return; // Rule applies to singers holding stars (1 to 4+)

    // Count distinct session dates attended by this singer in this Mon-Fri week
    const attendedDates = new Set();
    SONGS.forEach(r => {
      if (String(r[2] || '').trim().toUpperCase() === singerName && weekDates.includes(r[1])) {
        attendedDates.add(r[1]);
      }
    });
    const daysAttended = attendedDates.size;

    // Check New Joiner Exemption: Joined during this specific week (first song ever is in weekDates after Monday)
    const firstDate = firstSongDateMap[singerName] || '';
    const isNewJoinerThisWeek = firstDate && weekDates.includes(firstDate) && firstDate > weekDates[0];

    let status = 'SAFE';
    let newStars = currentStars;
    let reason = `Attended ${daysAttended}/${requiredDays} required days`;

    if (daysAttended >= requiredDays) {
      status = 'SAFE';
      reason = `Attended ${daysAttended}/${requiredDays} required days — Star(s) safe`;
    } else if (isNewJoinerThisWeek) {
      status = 'EXEMPT';
      reason = `New participant exemption (joined ${fd(firstDate)}) — Star(s) safe`;
    } else {
      status = 'DEDUCT';
      newStars = Math.max(0, currentStars - 1);
      reason = `Attended ${daysAttended}/${requiredDays} required days — 1 star deducted (${currentStars} → ${newStars})`;
    }

    // Find user UID to send clear notification message
    const userRec = AU.find(u => String(u.singer || '').trim().toUpperCase() === singerName);

    results.push({
      singer: singerName,
      uid: userRec ? userRec.id : '',
      currentStars,
      newStars,
      daysAttended,
      requiredDays,
      status,
      reason
    });
  });

  results.sort((a, b) => a.singer.localeCompare(b.singer));
  ruleEvalPreview = {
    mon,
    weekDates,
    weekHolidays,
    requiredDays,
    results
  };
  draw();
};

// Shared IndexedDB Helper for Offline Backup Folder Handle (configured in Rules tab, used on End Session)
function openSFHSettingsDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('sfh_settings_db', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveBackupDirHandleToIDB(handle) {
  const db = await openSFHSettingsDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(handle, 'backupDirHandle');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getBackupDirHandleFromIDB() {
  try {
    const db = await openSFHSettingsDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get('backupDirHandle');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}
async function clearBackupDirHandleFromIDB() {
  try {
    const db = await openSFHSettingsDB();
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').delete('backupDirHandle');
  } catch (e) {}
}

    s3: cfg.s3 !== undefined ? parseFloat(cfg.s3) : DEFAULT_STAR_SCORING.s3,

    b13: cfg.b13 !== undefined ? parseFloat(cfg.b13) : DEFAULT_STAR_SCORING.b13,

    b45: cfg.b45 !== undefined ? parseFloat(cfg.b45) : DEFAULT_STAR_SCORING.b45
  };
}

function calcMaxPossibleStarPoints(sc) {
  const maxA = Math.max(
    sc.s1, sc.s2, sc.s3,
    sc.s1 + sc.s2 + sc.b12,
    sc.s2 + sc.s3 + sc.b23,
    sc.s1 + sc.s3 + sc.b13,
    sc.s1 + sc.s2 + sc.s3 + sc.b123
  );
  const maxB = Math.max(sc.s4, sc.s5, sc.s4 + sc.s5 + sc.b45);
  return parseFloat((maxA + maxB).toFixed(2));
}

function formatScheduleText(sc) {
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const sortedDays = [...sc.days].sort();
  let dayLabel = sortedDays.map(d => dayNames[d]).join(', ');
  if (JSON.stringify(sortedDays) === JSON.stringify([1,2,3,4,5])) dayLabel = 'Monday to Friday';
  const [hh, mm] = sc.startTime.split(':').map(Number);
  const ampm = hh >= 12 ? 'pm' : 'am';
  const h12 = hh % 12 || 12;
  return `${dayLabel}, from ${h12}:${String(mm).padStart(2,'0')} ${ampm} onwards`;
}

window.pic=el=>{const f=el.files[0];if(!f)return;grab();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const S=240,c=document.createElement('canvas');c.width=c.height=S;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)*0.2,m,m,0,0,S,S);P.photo=c.toDataURL('image/jpeg',0.75);draw();try{await updateDoc(doc(fs,'users',U.uid),{photo:P.photo,updatedAt:Date.now()});showNotice('Photo updated!')}catch(_pe){showNotice('Photo preview ready — tap Save profile to save.')}};im.src=r.result};r.readAsDataURL(f)};

  d.autoTable({startY:y+2,head:[['Order','Song ID','Date','Singer name','Song name']],body:rows.map((r,i)=>[String(i+1),r[0],fmtDtCell(r[1]),r[2],r[3]].map(a)),styles:{fontSize:8,cellPadding:1.5,minCellHeight:8,valign:'middle'},columnStyles:{0:{cellWidth:14,halign:'center'},1:{cellWidth:22},2:{cellWidth:32},3:{cellWidth:44},4:{cellWidth:70}},headStyles:{fillColor:[15,52,96]},didDrawPage:()=>{d.setFontSize(8);d.text('Page '+d.internal.getNumberOfPages(),105,291,{align:'center'})}});

const phoneDigits=id=>{const dg=(id||'').replace(/\D/g,'').slice(-10);return dg.length==10?dg:''};
const emailsFor=id=>{id=(id||'').trim();if(id.includes('@'))return [id.toLowerCase()];const dg=phoneDigits(id);return dg?[dg+'@singfromhome-phone.app',dg+'-2@singfromhome-phone.app',dg+'-3@singfromhome-phone.app']:[]};
const authMsg=x=>({'auth/invalid-credential':'Wrong phone/email or password.','auth/wrong-password':'Wrong password.','auth/user-not-found':'No account found. Tap Create account.','auth/email-already-in-use':'This phone number or email already has an account. Tap Sign in.','auth/weak-password':'The password must have at least 6 characters.','auth/operation-not-allowed':'Email/password login is not turned on in Firebase yet.','auth/invalid-email':'Enter a valid 10-digit phone number or an email.','auth/network-request-failed':'No internet. Please try again.','auth/too-many-requests':'Too many attempts. Please wait a few minutes and try again.'}[x.code]||('Failed ('+(x.code||'error')+')'));
const needConsent=()=>{if(!$('#cs')||!$('#cs').checked){showNotice('Please tick the consent box first.');return true}return false};
window.loginPw=async()=>{if(needConsent())return;const ems=emailsFor($('#lid').value),pw=$('#lpw').value;
  if(!ems.length||pw.length<6){showNotice('Enter a 10-digit phone number or an email, and a password of at least 6 characters.');return}
  let last=null;
  for(const em of ems){try{await signInWithEmailAndPassword(auth,em,pw);return}catch(x){last=x;if(!['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(x.code))break}}
  showNotice(authMsg(last)+(ems.length>1?' If you forgot your password, type your name and a new password above and tap Forgot password.':''))};
window.signupPw=async()=>{if(needConsent())return;const nm=$('#lnm').value.trim(),ems=emailsFor($('#lid').value),pw=$('#lpw').value;
  if(!nm){showNotice('Please type your name.');return}
  if(!ems.length||pw.length<6){showNotice('Enter a 10-digit phone number or an email, and a password of at least 6 characters.');return}
  pendingName=nm;
  try{const c=await createUserWithEmailAndPassword(auth,ems[0],pw);try{await updateProfile(c.user,{displayName:nm})}catch(y){}}
  catch(x){showNotice(authMsg(x))}};
window.forgotPw=async()=>{const raw=($('#lid').value||'').trim();
  if(raw.includes('@')){try{await sendPasswordResetEmail(auth,raw);showNotice('A reset link has been sent to '+raw+'. Check your inbox and spam folder.');}catch(x){showNotice(authMsg(x))}return}
  const ems=emailsFor(raw);if(!ems.length){showNotice('Type your 10-digit phone number first.');return}
  if(needConsent())return;
  const nm=$('#lnm').value.trim(),pw=$('#lpw').value;
  if(!nm||pw.length<6){showNotice('Type your name and a NEW password (at least 6 characters) in the boxes above, then tap Forgot password again.');return}
  showConfirm('A reset link cannot be sent to a phone number. A new login will be created for this number with the new password you typed, and the host must approve you again. Continue?', async () => {
    pendingName=nm;
    for(const em of ems.slice(1)){
      try{const c=await createUserWithEmailAndPassword(auth,em,pw);try{await updateProfile(c.user,{displayName:nm})}catch(y){}return}
      catch(x){if(x.code!='auth/email-already-in-use'){showNotice(authMsg(x));return}}
    }
    showNotice('Too many resets for this number. Please contact the host.');
  });
};

function renderApprovedParticipantCards(okList, queryStr) {
  const q = String(queryStr || '').trim().toUpperCase();
  const filtered = q
    ? okList.filter(u =>
        String(u.singer || '').toUpperCase().includes(q) ||
        String(u.name || '').toUpperCase().includes(q) ||
        String(idOf(u.email) || '').toUpperCase().includes(q)
      )
    : okList;
  if (!filtered.length) return '<p class="m" style="margin:4px 0">No matching participants.</p>';
  return filtered.map(u => {
    const isSup = (CFG.superadmins || []).map(x => x.toLowerCase()).includes((u.email || '').toLowerCase());
    const isAdm = u.role == 'admin';
    const isJdg = isUserJudge(u);
    const isHst = isUserHost(u);
    const rolesList = [];
    if (isAdm) rolesList.push('Admin');
    if (isHst) rolesList.push('Host');
    if (isJdg) rolesList.push('Judge');
    const roleTxt = isSup ? 'Superadmin' : (rolesList.length ? rolesList.join(' · ') : 'Participant');
    const roleStyle = isSup
      ? 'color:var(--ac);font-weight:800'
      : (isAdm ? 'color:var(--ac);font-weight:700' : (isHst ? 'color:#0284c7;font-weight:700' : (isJdg ? 'color:#b45309;font-weight:700' : 'color:var(--mut)')));
    const dispName = String(u.singer || u.name || idOf(u.email) || '').replace(/'/g, "\\'");
    return `<div style="border:1px solid var(--bd);border-radius:10px;padding:9px 11px;background:var(--bg)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
        <div style="min-width:0">
          <b style="font-size:14px">${e(u.singer || '(not linked)')}</b>
          <div class="m" style="font-size:12px;word-break:break-all">${e(idOf(u.email))}</div>
        </div>
        <span style="font-size:11.5px;${roleStyle}">${roleTxt}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
        ${isSup ? `<button style="font-size:12px;padding:4px 9px" onclick="editU('${e(u.id)}')">Profile</button>` : `
          ${IS_SUPER ? (
            isAdm
              ? `<button style="font-size:12px;padding:4px 9px" onclick="revokeAdmin('${e(u.id)}','${e(dispName)}')">Revoke Admin</button>`
              : `<button style="font-size:12px;padding:4px 9px" onclick="makeAdmin('${e(u.id)}','${e(dispName)}')">Make Admin</button>`
          ) : ''}
          ${IS_SUPER ? (
            isHst
              ? `<button style="font-size:12px;padding:4px 9px;border-color:#0284c7;color:#0284c7" onclick="revokeHost('${e(u.id)}','${e(dispName)}')">Revoke Host</button>`
              : `<button style="font-size:12px;padding:4px 9px" onclick="makeHost('${e(u.id)}','${e(dispName)}')">Make Host</button>`
          ) : ''}
          ${IS_SUPER ? (
            isJdg
              ? `<button style="font-size:12px;padding:4px 9px;border-color:#d97706;color:#b45309" onclick="revokeJudge('${e(u.id)}','${e(dispName)}')">Revoke Judge</button>`
              : `<button style="font-size:12px;padding:4px 9px" onclick="makeJudge('${e(u.id)}','${e(dispName)}')">Make Judge</button>`
          ) : ''}
          <button style="font-size:12px;padding:4px 9px" onclick="editU('${e(u.id)}')">Profile</button>
          <button style="font-size:12px;padding:4px 9px;border-color:#d97706;color:#b45309" onclick="rej('${e(u.id)}')">Revoke</button>
          <button style="font-size:12px;padding:4px 9px;border-color:#dc2626;color:#dc2626" onclick="deleteUserAccount('${e(u.id)}','${e(dispName)}')">Remove</button>
        `}
      </div>
    </div>`;
  }).join('');
}

window.filterResidualList = (val) => {
  residualSearch = String(val || '').trim();
  const tb = document.getElementById('residual_tbody');
  if (!tb) return;
  const q = residualSearch.toUpperCase();
  const names = (PUB && PUB.singers) || [];
  const allRaw = [...new Set([
    ...RAW_SINGERS_BEFORE_ALIAS,
    ...names,
    ...AU.map(u => String(u.singer || '').trim().toUpperCase()).filter(Boolean)
  ])].sort();
  const songCount = {};
  SONGS.forEach(r => { const nm = String(r[2] || '').trim().toUpperCase(); if (nm) songCount[nm] = (songCount[nm] || 0) + 1; });
  const sotdCount = {};
  ((PUB && PUB.sotd) || []).forEach(entry => {
    (entry.l || []).forEach(w => {
      const nm = canonSinger((w && w.n) || w);
      if (nm) sotdCount[nm] = (sotdCount[nm] || 0) + 1;
    });
  });
  const acctCount = {};
  AU.forEach(u => { const nm = String(u.singer || '').trim().toUpperCase(); if (nm) acctCount[nm] = (acctCount[nm] || 0) + 1; });
  const rows = allRaw
    .filter(nm => !q || nm.includes(q))
    .map(nm => {
      const cn = canonSinger(nm);
      const starObj = (PUB && PUB.stars && (PUB.stars[nm] || PUB.stars[cn])) || null;
      return { name: nm, songs: songCount[nm] || 0, sotd: sotdCount[nm] || 0, stars: starObj ? (Number(starObj.t) || 0) : 0, accts: acctCount[nm] || 0 };
    })
    .sort((a, b) => (a.songs - b.songs) || (a.sotd - b.sotd) || a.name.localeCompare(b.name));
  tb.innerHTML = rows.length ? rows.map(r => `<tr>
    <td><b>${e(r.name)}</b>${r.accts ? ` <span class="m" style="font-size:11px">(${r.accts} acct)</span>` : ''}</td>
    <td class="n">${r.songs}</td>
    <td class="n">${r.sotd}</td>
    <td class="n">${r.stars}</td>
    <td style="text-align:center"><button class="danger" style="padding:3px 9px;font-size:11.5px" onclick="deleteResidualSinger('${e(r.name).replace(/'/g, "\\'")}')">Delete</button></td>
  </tr>`).join('') : '<tr><td colspan="5" class="m">No matching singers found.</td></tr>';
};

window.deleteResidualSinger = async (rawName) => {
  if (!IS_SUPER) return;
  const target = String(rawName || '').trim().toUpperCase();
  const targetCanon = canonSinger(target);
  if (!target) return;
  const isMatch = nm => {
    const up = String(nm || '').trim().toUpperCase();
    return Boolean(up && (up === target || canonSinger(up) === targetCanon));
  };
  const sCnt = SONGS.filter(r => isMatch(r[2])).length;
  const sotdCnt = ((PUB && PUB.sotd) || []).reduce((acc, entry) => acc + (entry.l || []).filter(w => isMatch((w && w.n) || w)).length, 0);
  const starObj = (PUB && PUB.stars && (PUB.stars[target] || PUB.stars[targetCanon])) || null;
  const starCnt = starObj ? (Number(starObj.t) || 0) : 0;
  const acctCnt = AU.filter(u => isMatch(u.singer)).length;

  showConfirm(
    `Permanently remove "${target}" everywhere?\n\n` +
    `• Songs to delete: ${sCnt}\n` +
    `• SOTD entries to remove: ${sotdCnt}\n` +
    `• Stars to remove: ${starCnt}\n` +
    `• Linked accounts to unlink: ${acctCnt}\n` +
    `• Will also be added to permanent Removed Singers blocklist so it never returns.`,
    async () => {
      try {
        let songsRemoved = 0;
        let monthsUpdated = 0;

        // 1. Clean monthly song archives & pub/idx
        const ixRef = doc(fs, 'pub', 'idx');
        const ixSnap = await getDoc(ixRef);
        if (ixSnap.exists()) {
          const ixData = ixSnap.data();
          const monthsObj = { ...(ixData.months || {}) };
          const ms = Object.keys(monthsObj).sort();
          let totalBytes = 0;
          for (const m of ms) {
            const mRef = doc(fs, 'pub', 'songs_' + m);
            const mSnap = await getDoc(mRef);
            if (!mSnap.exists()) continue;
            const rows = JSON.parse(mSnap.data().json || '[]');
            const filtered = rows.filter(r => !isMatch(r[2]));
            const diff = rows.length - filtered.length;
            if (diff > 0) {
              songsRemoved += diff;
              monthsUpdated++;
              if (filtered.length === 0) {
                await deleteDoc(mRef);
                delete monthsObj[m];
              } else {
                const js = JSON.stringify(filtered);
                const hh = hsh(js);
                await setDoc(mRef, { json: js, n: filtered.length, h: hh, ts: tdy() });
                monthsObj[m] = { n: filtered.length, h: hh };
                totalBytes += js.length;
              }
            } else {
              totalBytes += String(mSnap.data().json || '').length;
            }
          }
          if (monthsUpdated > 0) {
            await setDoc(ixRef, { ...ixData, months: monthsObj, total: totalBytes, ts: tdy() });
          }
        }

        // 2. Clean pub/data (singers, sotd, stars, som)
        const pubRef = doc(fs, 'pub', 'data');
        const pubSnap = await getDoc(pubRef);
        let sotdRemoved = 0;
        if (pubSnap.exists()) {
          const pd = pubSnap.data();
          const nextSingers = (pd.singers || []).filter(nm => !isMatch(nm));
          const nextStars = {};
          Object.entries(pd.stars || {}).forEach(([k, v]) => {
            if (!isMatch(k)) nextStars[k] = v;
          });
          const nextSotd = (pd.sotd || []).map(entry => {
            const before = (entry.l || []).length;
            const kept = (entry.l || []).filter(w => !isMatch((w && w.n) || w));
            sotdRemoved += (before - kept.length);
            return { ...entry, l: kept };
          }).filter(entry => entry.l.length > 0);
          const nextSom = {};
          Object.entries(pd.som || {}).forEach(([k, v]) => {
            if (!isMatch(v)) nextSom[k] = v;
          });
          await setDoc(pubRef, { ...pd, singers: nextSingers, stars: nextStars, sotd: nextSotd, som: nextSom, ts: tdy() });
        }

        // 3. Unlink users, delete matching birthdays & plans
        let usersUnlinked = 0;
        try {
          const uSnap = await getDocs(collection(fs, 'users'));
          for (const d of uSnap.docs) {
            if (isMatch(d.data().singer)) {
              await updateDoc(doc(fs, 'users', d.id), { singer: '' });
              usersUnlinked++;
            }
          }
        } catch (_ue) {}

        try {
          const bdSnap = await getDocs(collection(fs, 'birthdays'));
          for (const d of bdSnap.docs) {
            if (isMatch(d.data().singer)) {
              await deleteDoc(doc(fs, 'birthdays', d.id));
            }
          }
        } catch (_bde) {}

        try {
          const plSnap = await getDocs(collection(fs, 'plans'));
          for (const d of plSnap.docs) {
            if (isMatch(d.data().singer)) {
              await deleteDoc(doc(fs, 'plans', d.id));
            }
          }
        } catch (_ple) {}

        // 4. Clean vote/sotm_panel if present
        try {
          const spRef = doc(fs, 'vote', 'sotm_panel');
          const spSnap = await getDoc(spRef);
          if (spSnap.exists()) {
            const sp = spSnap.data();
            const nf = (sp.finalists || []).filter(f => !isMatch(f && f.name));
            const nj = (sp.judges || []).filter(j => !isMatch(j));
            await setDoc(spRef, { ...sp, finalists: nf, judges: nj, updatedAt: Date.now() }, { merge: true });
          }
        } catch (_spe) {}

        // 5. Save to permanent removedSingers blocklist & clean aliases/sotmJudges in config/app
        const nextRemoved = [...new Set([...(CONF.removedSingers || []).map(x => String(x || '').trim().toUpperCase()), target, targetCanon].filter(Boolean))].sort();
        const nextAliases = {};
        Object.entries(CONF.singerAliases || {}).forEach(([k, v]) => {
          if (!isMatch(k) && !isMatch(v)) nextAliases[k] = v;
        });
        const nextJudges = (CONF.sotmJudges || []).filter(j => !isMatch(j));
        await setDoc(doc(fs, 'config', 'app'), { removedSingers: nextRemoved, singerAliases: nextAliases, sotmJudges: nextJudges }, { merge: true });
        CONF.removedSingers = nextRemoved;
        CONF.singerAliases = nextAliases;
        CONF.sotmJudges = nextJudges;

        await load();
        await loadAdm();
        draw();
        showNotice(
          `Permanently removed "${target}"!\n\n` +
          `• Songs deleted: ${songsRemoved} (${monthsUpdated} month(s) updated)\n` +
          `• SOTD records removed: ${sotdRemoved}\n` +
          `• Linked accounts unlinked: ${usersUnlinked}\n` +
          `• Added to permanent blocklist`,
          'Singer Permanently Removed'
        );
      } catch (err) {
        showNotice('Removal failed: ' + (err.code || err.message), 'Error');
      }
    },
    'Permanently Remove Singer'
  );
};

window.mergeSingersInCloud = async (fromArg, toArg) => {
  if (!IS_SUPER) return;
  const fromName = String(fromArg || ($('#merge_from') ? $('#merge_from').value : '') || '').trim().toUpperCase();
  const toName = String(toArg || ($('#merge_to') ? $('#merge_to').value : '') || '').trim().toUpperCase();
  if (!fromName || !toName) {
    showNotice("Please select both the duplicate singer name and the primary singer name to keep.");
    return;
  }
  if (fromName === toName) {
    showNotice("Duplicate name and Primary name must be different.");
    return;
  }

  showConfirm(
    `Permanently merge "${fromName}" into "${toName}" across all cloud records?\n\n` +
    `• All songs by ${fromName} will be reassigned to ${toName}\n` +
    `• SOTD history, SOM records & stars will be merged without double-counting dates\n` +
    `• Linked participant accounts & birthdays will point to ${toName}\n` +
    `• Future entries as ${fromName} will automatically resolve to ${toName}`,
    async () => {
      try {
        let songsMoved = 0;
        let monthsUpdated = 0;

        // 1. Update all monthly song docs (or legacy pub/songs)
        const ixRef = doc(fs, 'pub', 'idx');
        const ixSnap = await getDoc(ixRef);
        if (ixSnap.exists()) {
          const idxData = ixSnap.data();
          const monthsMap = { ...(idxData.months || {}) };
          const ms = Object.keys(monthsMap).sort();
          for (const m of ms) {
            const mRef = doc(fs, 'pub', 'songs_' + m);
            const mSnap = await getDoc(mRef);
            if (!mSnap.exists()) continue;
            const list = JSON.parse(mSnap.data().json || '[]');
            let changed = false;
            list.forEach(row => {
              if (String(row[2] || '').trim().toUpperCase() === fromName) {
                row[2] = toName;
                songsMoved++;
                changed = true;
              }
            });
            if (changed) {
              const mJson = JSON.stringify(list);
              const mHash = hsh(mJson);
              await setDoc(mRef, { ...mSnap.data(), json: mJson, n: list.length, h: mHash, ts: tdy() });
              monthsMap[m] = { n: list.length, h: mHash };
              monthsUpdated++;
            }
          }
          if (monthsUpdated > 0) {
            await setDoc(ixRef, { ...idxData, months: monthsMap, ts: tdy() });
          }
        } else {
          const bRef = doc(fs, 'pub', 'songs');
          const bSnap = await getDoc(bRef);
          if (bSnap.exists()) {
            const list = bSnap.data().json ? JSON.parse(bSnap.data().json) : (bSnap.data().list || []);
            let changed = false;
            list.forEach(row => {
              if (String(row[2] || '').trim().toUpperCase() === fromName) {
                row[2] = toName;
                songsMoved++;
                changed = true;
              }
            });
            if (changed) {
              await setDoc(bRef, { ...bSnap.data(), json: JSON.stringify(list), ts: tdy() });
              monthsUpdated++;
            }
          }
        }

        // 2. Update pub/data (singers, sotd, som, stars)
        const dataRef = doc(fs, 'pub', 'data');
        const dataSnap = await getDoc(dataRef);
        let sotdMoved = 0;
        let starsMerged = false;
        if (dataSnap.exists()) {
          const pData = dataSnap.data();
          const singersSet = new Set((pData.singers || []).map(s => {
            const u = String(s || '').trim().toUpperCase();
            return u === fromName ? toName : u;
          }).filter(Boolean));
          singersSet.add(toName);

          const sotdOut = (pData.sotd || []).map(entry => {
            const dedup = [];
            (entry.l || []).forEach(w => {
              const rawN = String((w && w.n) || w || '').trim().toUpperCase();
              const finalN = rawN === fromName ? toName : rawN;
              if (rawN === fromName) sotdMoved++;
              if (finalN && !dedup.some(x => x.n === finalN)) {
                dedup.push({ n: finalN, h: (w && w.h) || 'Score' });
              }
            });
            return { d: entry.d, l: dedup };
          });

          const somOut = { ...(pData.som || {}) };
          Object.keys(somOut).forEach(k => {
            if (String(somOut[k] || '').trim().toUpperCase() === fromName) somOut[k] = toName;
          });

          const starsOut = { ...(pData.stars || {}) };
          const matchingFromKeys = Object.keys(starsOut).filter(k => k.trim().toUpperCase() === fromName);
          if (matchingFromKeys.length) {
            let targetRec = starsOut[toName] || null;
            matchingFromKeys.forEach(k => {
              targetRec = mergeStarRecords(targetRec, starsOut[k]);
              delete starsOut[k];
            });
            starsOut[toName] = targetRec;
            starsMerged = true;
          }

          await setDoc(dataRef, {
            ...pData,
            singers: [...singersSet].sort(),
            sotd: sotdOut,
            som: somOut,
            stars: starsOut,
            ts: tdy()
          });
        }

        // 3. Update linked users & birthdays
        let usersUpdated = 0;
        try {
          const uSnap = await getDocs(collection(fs, 'users'));
          for (const d of uSnap.docs) {
            if (String(d.data().singer || '').trim().toUpperCase() === fromName) {
              await updateDoc(doc(fs, 'users', d.id), { singer: toName });
              usersUpdated++;
            }
          }
        } catch (_ue) {}

        try {
          const bdSnap = await getDocs(collection(fs, 'birthdays'));
          for (const d of bdSnap.docs) {
            if (String(d.data().singer || '').trim().toUpperCase() === fromName) {
              await updateDoc(doc(fs, 'birthdays', d.id), { singer: toName });
            }
          }
        } catch (_bde) {}

        // 4. Save permanent alias in config/app so future entries/backups auto-resolve
        const nextAliases = { ...(CONF.singerAliases || {}), [fromName]: toName };
        await setDoc(doc(fs, 'config', 'app'), { singerAliases: nextAliases }, { merge: true });
        CONF.singerAliases = nextAliases;

        await load();
        await loadAdm();
        draw();
        showNotice(
          `Merged "${fromName}" → "${toName}" successfully!\n\n` +
          `• Songs updated: ${songsMoved} (${monthsUpdated} month archive(s))\n` +
          `• SOTD records updated: ${sotdMoved}\n` +
          `• Stars merged: ${starsMerged ? 'Yes' : 'No separate record'}\n` +
          `• Participant accounts updated: ${usersUpdated}\n` +
          `• Auto-merge alias saved permanently`,
          "Singers Merged"
        );
      } catch (err) {
        showNotice("Merge failed: " + (err.code || err.message), "Error");
      }
    },
    "Merge Duplicate Singers"
  );
};

function getSOTMJudgeFinalists() {

    ? SOTM_PANEL_CACHE.finalists.map(f => canonSinger(f.name)).filter(Boolean)
    : [];
  if (fromPanel.length) return [...new Set(fromPanel)];

    .filter(([, o]) => (o && o.t >= 4))
    .map(([nm]) => canonSinger(nm))

}

function renderJudgeScorecardList(finalists, panelFinalists, savedScores, isSuper) {
  const fields = [
    ['sur', 'Sur'],
    ['taal', 'Taal'],
    ['sel', 'Choice'],
    ['perf', 'Perf']
  ];
  return finalists.map((nm, idx) => {
    const panelRec = panelFinalists.find(f => canonSinger(f.name) === nm);
    const cur = isSuper
      ? (panelRec ? { sur: panelRec.sur, taal: panelRec.taal, sel: panelRec.sel, perf: panelRec.perf } : { sur: 0, taal: 0, sel: 0, perf: 0 })
      : (savedScores[nm] || { sur: '', taal: '', sel: '', perf: '' });
    const tot = parseFloat(((Number(cur.sur)||0)+(Number(cur.taal)||0)+(Number(cur.sel)||0)+(Number(cur.perf)||0)).toFixed(1));
    const aud = panelRec ? (Number(panelRec.audience) || 0) : 0;
    const grand = parseFloat((tot + aud).toFixed(1));
    return `<div class="jdg-item">
      <div class="jdg-head">
        <div class="jdg-name"><span style="color:var(--mut);font-weight:700;margin-right:4px">${idx + 1}.</span>${e(nm)}</div>
        ${isSuper ? `<div style="font-size:11.5px;white-space:nowrap;flex:none"><span style="color:#0369a1;font-weight:700">Votes: ${aud}</span> · <span style="color:#15803d;font-weight:900">Grand: <span id="jdg_grand_${idx}">${grand}</span></span></div>` : ''}
      </div>
      <div class="jdg-grid">
        ${fields.map(([fk, lbl]) => {
          const v = cur[fk] !== '' && cur[fk] != null ? cur[fk] : '';
          return `<div class="jdg-col">
            <span class="jdg-lbl">${lbl}</span>
            <div class="jdg-step">
              <button type="button" class="jdg-btn jdg-btn-m" aria-label="Decrease ${lbl}" onclick="stepJudgeScore('${fk}',${idx},-0.5,${aud})">−</button>
              <input id="jdg_${fk}_${idx}" class="jdg-inp" type="number" inputmode="decimal" step="0.5" min="0" max="10" value="${e(v)}" oninput="recalcJudgeRow(${idx},${aud})">
              <button type="button" class="jdg-btn jdg-btn-p" aria-label="Increase ${lbl}" onclick="stepJudgeScore('${fk}',${idx},0.5,${aud})">+</button>
            </div>
          </div>`;
        }).join('')}
        <div class="jdg-col">
          <span class="jdg-lbl">Total</span>
          <div class="jdg-tot-box" id="jdg_tot_${idx}">${tot}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.stepJudgeScore = (field, idx, delta, aud = 0) => {
  const el = $('#jdg_' + field + '_' + idx);
  if (!el) return;
  const raw = parseFloat(el.value);
  const cur = isNaN(raw) ? 0 : raw;
  const next = Math.max(0, Math.min(10, Math.round((cur + delta) * 2) / 2));
  el.value = String(next);
  window.recalcJudgeRow(idx, aud);
};

window.recalcJudgeRow = (idx, aud = 0) => {
  const g = id => {
    const n = parseFloat(($('#' + id) && $('#' + id).value) || '0');
    return isNaN(n) ? 0 : Math.max(0, Math.min(10, n));
  };
  const tot = parseFloat((g('jdg_sur_' + idx) + g('jdg_taal_' + idx) + g('jdg_sel_' + idx) + g('jdg_perf_' + idx)).toFixed(1));
  const el = $('#jdg_tot_' + idx);
  if (el) el.textContent = String(tot);
  const gr = $('#jdg_grand_' + idx);
  if (gr) gr.textContent = String(parseFloat((tot + (Number(aud) || 0)).toFixed(1)));
};

          : ((SOTM_PANEL_CACHE && Array.isArray(SOTM_PANEL_CACHE.judges)) ? SOTM_PANEL_CACHE.judges : []),

      SOTM_PANEL_CACHE = nextPanel;
      draw();
      showNotice('SOTM Judge Panel scores saved and synced to Live Console!', 'Panel Updated');
    } else {
      const planRef = doc(fs, 'plans', `${todayStr}_${U.uid}`);
      await setDoc(planRef, {
        uid: U.uid,
        date: todayStr,
        singer: judgeName,
        isJudge: true,
        sotmJudgeScores: scoresMap,
        upd: Date.now()
      }, { merge: true });
      if (!PLAN) PLAN = { uid: U.uid, date: todayStr, singer: judgeName, songs: [] };
      PLAN.sotmJudgeScores = scoresMap;
      draw();
      showNotice('Your SOTM Judge scores have been submitted to the Live Console!', 'Judge Scores Saved');
    }
  } catch (err) {
    showNotice('Could not submit judge scores: ' + (err.code || err.message));
  }
};

async function syncAppointedJudgesToCloud() {
  try {
    const q = await getDocs(collection(fs, 'users'));
    const allUsers = q.docs.map(x => ({ id: x.id, ...x.data() }));
    const judgeNames = [...new Set(
      allUsers
        .filter(u => u.status === 'approved' && isUserJudge(u))
        .map(u => canonSinger(u.singer || u.name || idOf(u.email)))
        .filter(Boolean)
    )].sort();
    await setDoc(doc(fs, 'config', 'app'), { sotmJudges: judgeNames }, { merge: true });
    CONF.sotmJudges = judgeNames;
    await setDoc(doc(fs, 'vote', 'sotm_panel'), { judges: judgeNames, updatedAt: Date.now() }, { merge: true });
  } catch (_je) {}
}

const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h>>>0)};
window.pubUp=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{
  try{const x=JSON.parse(r.result);if((x.kind!='sfh-pub'&&x.kind!='sfh-master-backup')||!Array.isArray(x.songs))throw 0;
    const by={};x.songs.sort(cmpBySongId).forEach(sg=>{const m=String(sg[1]).slice(0,7);(by[m]=by[m]||[]).push(sg)});
    const ms=Object.keys(by).sort(),js={};let tot=0;
    ms.forEach(m=>{js[m]=JSON.stringify(by[m]);tot+=js[m].length;if(js[m].length>900000)throw 'size'});
    const isFullBackup = x.kind === 'sfh-master-backup';
    const label = isFullBackup ? 'Restore Full Master Backup' : 'Publish Data';
    showConfirm(`${label}: ${x.songs.length} songs (${Math.round(tot/1024)} KB across ${ms.length} month(s)), ${(x.sotd||[]).length} SOTD dates, and ${(x.singers||[]).length} singers?`, async () => {
      const ix=await getDoc(doc(fs,'pub','idx')),old=ix.exists()?(ix.data().months||{}):{},nw={};let wr=0;
      for(const m of ms){const hh=hsh(js[m]);nw[m]={n:by[m].length,h:hh};if(!old[m]||old[m].h!==hh){await setDoc(doc(fs,'pub','songs_'+m),{json:js[m],n:by[m].length,h:hh,ts:x.ts||''});wr++}}
      await setDoc(doc(fs,'pub','data'),{singers:x.singers||[],sotd:x.sotd||[],som:x.som||{},somd:x.somd||{},stars:x.stars||{},songMeta:x.songMeta||(PUB&&PUB.songMeta)||{},sessionMeta:x.sessionMeta||(PUB&&PUB.sessionMeta)||{},ts:x.ts||''});
      await setDoc(doc(fs,'pub','idx'),{months:nw,total:tot,ts:x.ts||''});
      if(isFullBackup && x.sotmResult){try{await setDoc(doc(fs,'pub','sotm'),x.sotmResult)}catch(y){}}
      if(isFullBackup && (x.holidays || x.schedule || x.starScoring)){
        try{
          const cfgPatch = { ...CONF };
          if(Array.isArray(x.holidays)) cfgPatch.holidays = x.holidays;
          if(x.schedule) cfgPatch.schedule = x.schedule;
          if(x.starScoring) cfgPatch.starScoring = x.starScoring;
          await setDoc(doc(fs,'config','app'), cfgPatch);
        }catch(y){}
      }
      for(const m of Object.keys(old))if(!nw[m]){try{await deleteDoc(doc(fs,'pub','songs_'+m))}catch(y){}}
      try{await deleteDoc(doc(fs,'pub','songs'))}catch(y){}
      await load();draw();showNotice(`${isFullBackup ? 'Full Master Backup restored!' : 'Published.'} ${wr} of ${ms.length} month(s) updated.`);
    }, label);
  }catch(z){showNotice(z=='size'?'One month of songs is too large for a single document.':(z&&z.code?'Restore/Publish failed ('+z.code+'). Check Firebase rules.':'That is not a valid SFH backup or participants file.'))}};r.readAsText(f)};

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=43').then(r=>r.update()).catch(()=>{});}
