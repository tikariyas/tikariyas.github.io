const parseSongNum = id => {
  if (!id) return 0;
  const num = parseInt(String(id).replace(/\D/g, ''), 10);
  return isNaN(num) ? 0 : num;
};

const cmpBySongId = (a, b) => {
  const idA = Array.isArray(a) ? a[0] : (a.songId || a[0] || '');
  const idB = Array.isArray(b) ? b[0] : (b.songId || b[0] || '');
  return parseSongNum(idA) - parseSongNum(idB);
};

const DEFAULT_SINGER_ALIASES = {
  'NANDU GHADSING': 'SURESH GHADSING'
};

function getSingerAliases() {
  const map = { ...DEFAULT_SINGER_ALIASES };
  const saved = (CONF && CONF.singerAliases) || {};
  Object.entries(saved).forEach(([k, v]) => {
    const fk = String(k || '').trim().toUpperCase();
    const fv = String(v || '').trim().toUpperCase();
    if (fk && fv && fk !== fv) map[fk] = fv;
  });
  return map;
}

function canonSinger(rawName) {
  let cur = String(rawName || '').trim().toUpperCase();
  if (!cur) return '';
  const aliases = getSingerAliases();
  for (let i = 0; i < 5 && aliases[cur]; i++) {
    cur = aliases[cur];
  }
  return cur;
}

function normDate(val) {
  const s = String(val || '').trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const dmY = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (dmY) {
    return `${dmY[3]}-${dmY[2].padStart(2, '0')}-${dmY[1].padStart(2, '0')}`;
  }
  const yMd = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (yMd) {
    return `${yMd[1]}-${yMd[2].padStart(2, '0')}-${yMd[3].padStart(2, '0')}`;
  }
  return s;
}

function mergeStarRecords(a, b) {
  const recA = a || { t: 0, d: [], m: {} };
  const recB = b || { t: 0, d: [], m: {} };
  const datesA = [...new Set((recA.d || []).map(normDate).filter(Boolean))];
  const datesB = [...new Set((recB.d || []).map(normDate).filter(Boolean))];
  const overlap = datesA.filter(dt => datesB.includes(dt)).length;
  const combinedDates = [...new Set([...datesA, ...datesB])].sort();
  const tA = Math.max(0, Number(recA.t) || 0);
  const tB = Math.max(0, Number(recB.t) || 0);
  const dedupOverlap = Math.min(overlap, Math.min(tA, tB));
  const combinedT = Math.max(0, tA + tB - dedupOverlap);
  const mOut = { ...(recA.m && typeof recA.m === 'object' ? recA.m : {}) };
  if (recB.m && typeof recB.m === 'object') {
    Object.entries(recB.m).forEach(([k, v]) => {
      if (typeof v === 'number') mOut[k] = (Number(mOut[k]) || 0) + v;
      else if (mOut[k] == null) mOut[k] = v;
    });
  }
  return { t: combinedT, d: combinedDates, m: mOut };
}

function isWithinLiveScheduleNow(now = new Date()) {
  const sc = (typeof getSchedule === 'function')
    ? getSchedule()
    : { days: [1,2,3,4,5], startTime: '20:20', endTime: '23:30', cutoffMins: 26, forceLiveOverride: false };
  if (sc.forceLiveOverride) return true;
  const day = now.getDay();
  const prevDay = (day + 6) % 7;
  const [sh, sm] = (sc.startTime || '20:20').split(':').map(Number);
  const [eh, em] = (sc.endTime || '23:30').split(':').map(Number);
  const curMins = now.getHours() * 60 + now.getMinutes();
  const startMins = sh * 60 + sm;
  let endMins = eh * 60 + em;
  if (endMins <= startMins) {
    endMins = Math.max(endMins + 1440, startMins + 120);
  }
  if (sc.days.includes(day) && curMins >= startMins && curMins <= endMins) return true;
  if (sc.days.includes(prevDay) && (curMins + 1440) >= startMins && (curMins + 1440) <= endMins) return true;
  return false;
}

async function load(){
  loadErr='';PUB=null;SONGS=[];CONF={};SOTM_RESULT=null;HOLIDAYS=[];RAW_SINGERS_BEFORE_ALIAS=[];
  try{
    const r=doc(fs,'users',U.uid);let s=await getDoc(r);
    if(!s.exists()&&!ADM){
      await setDoc(r,{email:U.email||'',name:U.displayName||pendingName||'',status:'pending',photo:'',phone:'',city:'',note:'',updatedAt:Date.now()});
      s=await getDoc(r);
    }
    P=s.exists()?s.data():{status:'approved',name:U.displayName||'',singer:''};
    if(ADM||P.status=='approved'){
      const [a,ix,c]=await Promise.all([getDoc(doc(fs,'pub','data')),getDoc(doc(fs,'pub','idx')),getDoc(doc(fs,'config','app'))]);
      PUB=a.exists()?a.data():null;CONF=c.exists()?c.data():{};
      HOLIDAYS = Array.isArray(CONF.holidays) ? CONF.holidays : [];
      if(ix.exists()){const ms=Object.keys(ix.data().months||{}).sort();const ds=await Promise.all(ms.map(m=>getDoc(doc(fs,'pub','songs_'+m))));SONGS=[].concat(...ds.map(d=>d.exists()?JSON.parse(d.data().json):[]))}
      else{const b=await getDoc(doc(fs,'pub','songs'));SONGS=b.exists()?(b.data().json?JSON.parse(b.data().json):(b.data().list||[])):[]}

      const existingIds = new Set(SONGS.map(r => r[0]));
      NOV16_SONGS.forEach(row => {
        if (!existingIds.has(row[0])) SONGS.push(row);
      });

      // Capture raw singer names BEFORE alias normalization (for Superadmin Merge tool)
      const rawSet = new Set();
      SONGS.forEach(row => { const nm = String(row[2] || '').trim().toUpperCase(); if (nm) rawSet.add(nm); });
      if (PUB) {
        (PUB.singers || []).forEach(nm => { const u = String(nm || '').trim().toUpperCase(); if (u) rawSet.add(u); });
        (PUB.sotd || []).forEach(x => (x.l || []).forEach(w => { const u = String((w && w.n) || w || '').trim().toUpperCase(); if (u) rawSet.add(u); }));
        Object.keys(PUB.stars || {}).forEach(nm => { const u = String(nm || '').trim().toUpperCase(); if (u) rawSet.add(u); });
      }
      RAW_SINGERS_BEFORE_ALIAS = [...rawSet].sort();

      // Normalize songs (date + canonical singer alias)
      SONGS = SONGS.map(row => [row[0], normDate(row[1]), canonSinger(row[2]), row[3]]);
      SONGS.sort(cmpBySongId);

      if (P && P.singer) {
        P = { ...P, singer: canonSinger(P.singer) };
      }

      if (PUB) {
        // Normalize & merge stars by canonical singer name
        const mergedStars = {};
        Object.entries(PUB.stars || {}).forEach(([rawName, rec]) => {
          const cn = canonSinger(rawName);
          if (!cn) return;
          mergedStars[cn] = mergedStars[cn] ? mergeStarRecords(mergedStars[cn], rec) : mergeStarRecords(null, rec);
        });
        PUB.stars = mergedStars;

        // Normalize & unify SOTD across PUB.sotd, HISTORICAL_SOTD_PRE_OCT26, and PUB.stars dates
        const sotdByDate = new Map();
        const addSotdWinner = (dtRaw, nameRaw, howRaw) => {
          const dt = normDate(dtRaw);
          const nm = canonSinger(nameRaw);
          if (!dt || !nm) return;
          if (!sotdByDate.has(dt)) sotdByDate.set(dt, []);
          const arr = sotdByDate.get(dt);
          if (!arr.some(x => x.n === nm)) {
            arr.push({ n: nm, h: howRaw || 'Score' });
          }
        };

        (Array.isArray(PUB.sotd) ? PUB.sotd : []).forEach(entry => {
          if (!entry || !entry.d) return;
          (Array.isArray(entry.l) ? entry.l : []).forEach(w => {
            if (typeof w === 'string') addSotdWinner(entry.d, w, 'Score');
            else if (w && w.n) addSotdWinner(entry.d, w.n, w.h || 'Score');
          });
        });

        HISTORICAL_SOTD_PRE_OCT26.forEach(item => {
          if (!sotdByDate.has(item.d) || !sotdByDate.get(item.d).length) {
            (item.l || []).forEach(w => addSotdWinner(item.d, w.n, w.h || 'Score'));
          }
        });

        Object.entries(PUB.stars || {}).forEach(([nm, rec]) => {
          (rec.d || []).forEach(dt => addSotdWinner(dt, nm, 'Score'));
        });

        PUB.sotd = [...sotdByDate.entries()]
          .filter(([, l]) => l.length > 0)
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([d, l]) => ({ d, l }));

        // Normalize SOM values & singers list
        if (PUB.som && typeof PUB.som === 'object') {
          const normSom = {};
          Object.entries(PUB.som).forEach(([k, v]) => { normSom[k] = canonSinger(v); });
          PUB.som = normSom;
        }
        PUB.singers = [...new Set([...(PUB.singers || []).map(canonSinger), ...SONGS.map(r => r[2])].filter(Boolean))].sort();
      }

      try {
        const [sotmSnap, voteResSnap, voteSessSnap, sotmPanelSnap] = await Promise.all([
          getDoc(doc(fs, 'pub', 'sotm')),
          getDoc(doc(fs, 'vote', 'result')),
          getDoc(doc(fs, 'vote', 'session')),
          getDoc(doc(fs, 'vote', 'sotm_panel')).catch(() => ({ exists: () => false }))
        ]);
        SOTM_PANEL_CACHE = (sotmPanelSnap && sotmPanelSnap.exists()) ? sotmPanelSnap.data() : null;
        if (sotmSnap.exists()) {
          SOTM_RESULT = sotmSnap.data();
        } else if (voteResSnap.exists()) {
          SOTM_RESULT = voteResSnap.data();
        } else if (voteSessSnap.exists() && voteSessSnap.data().winner) {
          SOTM_RESULT = voteSessSnap.data();
        } else if (PUB && PUB.sotmResult) {
          SOTM_RESULT = PUB.sotmResult;
        }
      } catch(se) {}

      await loadBd();
      if(!ADM){await loadMsgs();await loadPlan()}
    }
  }catch(x){loadErr=x.code||x.message}
}

onAuthStateChanged(auth, async u => {
  try {
    U = u;
    if (!u) {
      P = null;
      IS_SUPER = false;
      IS_ADMIN = false;
      ADM = false;
      PREVIEW_PARTICIPANT = false;
      PREVIEW_SINGER = '';
      draw();
      return;
    }
    const em = (u.email || '').toLowerCase();
    const verified = u.emailVerified === true;
    IS_SUPER = (CFG.superadmins || []).map(x => x.toLowerCase()).includes(em) && verified;
    ADM = IS_SUPER;

    await load();

    IS_ADMIN = IS_SUPER || (P && P.status == 'approved' && P.role == 'admin');
    IS_JUDGE = Boolean(P && P.status == 'approved' && isUserJudge(P));
    ADM = IS_ADMIN;

    if (IS_SUPER && AUTO_PREVIEW_PARTICIPANT) {
      PREVIEW_PARTICIPANT = true;
      try {
        const q = await getDocs(collection(fs, 'users'));
        AU = q.docs.map(x => ({ id: x.id, ...x.data() }));
      } catch (_e) {}
      await Promise.all([loadMsgs(), loadPlan()]);
    }

    let _lsFromLiveDoc = null;
    let _lsFromCfgDoc = null;
    const applyMergedLiveSession = () => {
      const candidates = [_lsFromLiveDoc, _lsFromCfgDoc].filter(Boolean);
      if (!candidates.length) {
        LIVE_SESSION = null;
      } else {
        candidates.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        const latest = candidates[0];
        const isFresh = (Date.now() - (latest.updatedAt || 0)) < (5 * 3600 * 1000);
        const isToday = normDate(latest.date) === tdy();
        const inSchedule = isWithinLiveScheduleNow();
        const hasContent = Boolean(
          (Array.isArray(latest.singers) && latest.singers.length > 0) ||
          (Array.isArray(latest.sotdList) && latest.sotdList.length > 0) ||
          (latest.sotdVote && latest.sotdVote.active) ||
          (latest.sotmVote && latest.sotmVote.active)
        );
        if (latest.active === true && latest.practice !== true && isToday && isFresh && inSchedule && hasContent) {
          LIVE_SESSION = {
            ...latest,
            singers: (latest.singers || []).map(sg => ({ ...sg, name: canonSinger(sg.name) })),
            performances: (latest.performances || []).map(p => ({ ...p, singer: canonSinger(p.singer) })),
            sotdList: (latest.sotdList || []).map(w => ({ ...w, n: canonSinger(w.n) }))
          };
        } else {
          LIVE_SESSION = null;
        }
      }
      if (tab === 'home') draw();
    };

    onSnapshot(doc(fs, 'live', 'session'), snap => {
      _lsFromLiveDoc = snap.exists() ? snap.data() : null;
      applyMergedLiveSession();
    }, () => {});

    onSnapshot(doc(fs, 'config', 'app'), snap => {
      if (snap.exists()) {
        const cfgData = snap.data();
        CONF = cfgData;
        _lsFromCfgDoc = cfgData.liveSession || null;
      } else {
        _lsFromCfgDoc = null;
      }
      applyMergedLiveSession();
    }, () => {});

    draw();
    setTimeout(runCards, 400);
    setInterval(() => {
      if (tab === 'home' && LIVE_SESSION && ((LIVE_SESSION.sotdVote && LIVE_SESSION.sotdVote.active) || (LIVE_SESSION.sotmVote && LIVE_SESSION.sotmVote.active))) {
        draw();
      }
    }, 1000);
    setInterval(() => {
      applyMergedLiveSession();
    }, 60000);
  } catch (err) {
    $('#app').innerHTML = `<div class="c"><b>Could not initialize view</b><p class="m">${e(err && (err.message || err.code) || 'Unexpected error')}</p><p><button class="pri" onclick="location.reload()">↻ Reload</button></p></div>`;
  }
});

  try {

        uid: U.uid,

      draw();
      showNotice(`Your SOTD vote for ${targetSinger} has been recorded!`);

        target: targetSinger,
        score: Number(score),
        voter: voterName,

        ts: Date.now()
      };

        uid: U.uid,
        date: todayStr,

window.joinZoom = async () => {
  if (!CONF.zoom) return;
  const singerName = ((P && P.singer) || (P && P.name) || (U && U.displayName) || '').trim().toUpperCase();
  const todayStr = (LIVE_SESSION && LIVE_SESSION.active && LIVE_SESSION.date) ? LIVE_SESSION.date : tdy();
  const now = new Date();
  const sc = getSchedule();
  const [sh, sm] = (sc.startTime || '20:20').split(':').map(Number);
  const schedStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0, 0);
  if (now.getHours() < 6 && sh >= 12) {
    schedStart.setDate(schedStart.getDate() - 1);
  }
  const cutoffMs = schedStart.getTime() + ((sc.cutoffMins ?? 26) * 60000);
  const preOpenMs = schedStart.getTime() - (5 * 60000);
  const schedDays = Array.isArray(sc.days) ? sc.days : [1, 2, 3, 4, 5];
  const isSchedDay = schedDays.includes(schedStart.getDay());
  const canAutoQueue = Boolean(sc.forceLiveOverride || (LIVE_SESSION && LIVE_SESSION.active) || (isSchedDay && now.getTime() >= preOpenMs));

  if (singerName && U && canAutoQueue) {
    const entryTimeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    const eligible = (sc.forceLiveOverride || now.getTime() < schedStart.getTime()) ? true : (now.getTime() <= cutoffMs);
    const entryDocId = `${todayStr}_${U.uid}`;
    const clearedCutoff = Math.max(
      (LIVE_SESSION && LIVE_SESSION.sessionClearedAt) || 0,
      (CONF && CONF.liveSession && CONF.liveSession.sessionClearedAt) || 0
    );
    try {
      const planRef = doc(fs, 'plans', entryDocId);
      const planSnap = await getDoc(planRef);
      const existingPlan = planSnap.exists() ? planSnap.data() : {};
      const prevZoomTs = existingPlan.zoomTs || 0;
      if (!existingPlan.zoomEntered || prevZoomTs <= clearedCutoff) {
        await setDoc(planRef, {
          uid: U.uid,
          date: todayStr,
          singer: singerName,
          songs: Array.isArray(existingPlan.songs) ? existingPlan.songs : [],
          note: existingPlan.note || '',
          ts: existingPlan.ts || now.getTime(),
          upd: now.getTime(),
          zoomEntered: true,
          zoomEntryTime: entryTimeStr,
          zoomTs: now.getTime(),
          zoomEligible: eligible
        }, { merge: true });
      }
      try {
        const entryRef = doc(fs, 'zoom_entries', entryDocId);
        const existingSnap = await getDoc(entryRef);
        const prevZDocTs = existingSnap.exists() ? (existingSnap.data().ts || 0) : 0;
        if (!existingSnap.exists() || prevZDocTs <= clearedCutoff) {
          await setDoc(entryRef, {
            uid: U.uid,
            date: todayStr,
            singer: singerName,
            entryTime: entryTimeStr,
            ts: now.getTime(),
            eligible
          });
        }
      } catch (_ze) {}
    } catch (ze) {
      console.warn('Zoom entry auto-queue warning:', ze);
    }
  }
  window.open(CONF.zoom, '_blank', 'noopener');
};

function getSOTDForDate(d) {
  const target = normDate(d);
  if (!target) return [];
  const winners = [];
  const pushW = (nameRaw, howRaw) => {
    const nm = canonSinger(nameRaw);
    if (!nm) return;
    if (!winners.some(w => w.n === nm)) {
      winners.push({ n: nm, h: howRaw || 'Score' });
    }
  };
  ((PUB && PUB.sotd) || []).forEach(entry => {
    if (normDate(entry.d) === target) {
      (entry.l || []).forEach(w => {
        if (typeof w === 'string') pushW(w, 'Score');
        else if (w && w.n) pushW(w.n, w.h || 'Score');
      });
    }
  });
  Object.entries((PUB && PUB.stars) || {}).forEach(([nm, rec]) => {
    if (rec && Array.isArray(rec.d) && rec.d.some(dt => normDate(dt) === target)) {
      pushW(nm, 'Score');
    }
  });
  if (LIVE_SESSION && normDate(LIVE_SESSION.date) === target && Array.isArray(LIVE_SESSION.sotdList)) {
    LIVE_SESSION.sotdList.forEach(w => pushW(w && w.n, w && w.h));
  }
  return winners;
}

function getLatestDeclaredSOTD(maxDate) {
  const cap = normDate(maxDate);
  const dates = [...new Set([
    ...((PUB && PUB.sotd) || []).filter(x => x.l && x.l.length).map(x => normDate(x.d)),
    ...Object.values((PUB && PUB.stars) || {}).flatMap(rec => (rec && rec.d ? rec.d.map(normDate) : []))
  ].filter(dt => /^\d{4}-\d{2}-\d{2}$/.test(dt) && (!cap || dt <= cap)))].sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    const l = getSOTDForDate(dates[i]);
    if (l.length) return { d: dates[i], l };
  }
  return null;
}

function sdates(){
  const st = new Set();
  SONGS.forEach(r => { const dt = normDate(r[1]); if (/^\d{4}-\d{2}-\d{2}$/.test(dt)) st.add(dt); });

  return [...st].sort();
}

function getSOTMData() {
  if (SOTM_RESULT && (SOTM_RESULT.winner || (SOTM_RESULT.rows && SOTM_RESULT.rows.length) || (SOTM_RESULT.results && SOTM_RESULT.results.length))) {
    const rawRows = SOTM_RESULT.rows || SOTM_RESULT.results || SOTM_RESULT.standings || [];
    const mappedRows = rawRows.map((r, idx) => {
      const sur = r.sur ?? r.SUR ?? r.surScore ?? '-';
      const taal = r.taal ?? r.TAAL ?? r.taalScore ?? '-';
      const selections = r.selections ?? r.SELECTIONS ?? r.selection ?? r.songSelection ?? r.bhav ?? '-';
      const performance = r.performance ?? r.PERFORMANCE ?? r.perf ?? r.presentation ?? '-';
      const judgeTotal = r.judgeTotal ?? r.judgeScore ?? r.totalJudge ?? (
        (parseFloat(sur) || 0) +
        (parseFloat(taal) || 0) +
        (selections !== '-' ? (parseFloat(selections) || 0) : 0) +
        (performance !== '-' ? (parseFloat(performance) || 0) : 0)
      );
      const votes = r.votes ?? r.audienceVotes ?? r.voteCount ?? r.meter ?? r.voteAvg ?? 0;
      const votePct = r.votePct ?? r.votePercent ?? r.meterPct ?? '';
      const grandTotal = r.grandTotal ?? r.finalScore ?? r.total ?? ((parseFloat(judgeTotal) || 0) + (parseFloat(votes) || 0));
      const remarks = r.remarks ?? r.opinion ?? r.judgeOpinion ?? r.comment ?? '';
      return {
        rank: r.rank || (idx + 1),
        name: r.name || r.singer || '',
        sur,
        taal,
        selections,
        performance,
        judgeTotal,
        votes,
        votePct,
        grandTotal,
        remarks
      };
    });

    return {
      monthLabel: SOTM_RESULT.monthLabel || 'NOVEMBER 2026',

function hasSongMeta(m) {
  return !!(m && ['orig', 'comp', 'lyr', 'mov', 'yr', 'act'].some(k => String(m[k] || '').trim()));
}

function getSongMeta(title) {
  const key = String(title || '').trim().toUpperCase();
  if (!key) return null;
  if (PUB && PUB.songMeta && hasSongMeta(PUB.songMeta[key])) return PUB.songMeta[key];
  if (LIVE_SESSION && Array.isArray(LIVE_SESSION.performances)) {
    const lp = LIVE_SESSION.performances.find(p => String(p.song || '').trim().toUpperCase() === key && hasSongMeta(p.meta));
    if (lp) return lp.meta;
  }
  return null;
}

function formatSongMetaSummary(m) {
  if (!hasSongMeta(m)) return '';
  const parts = [];
  if (m.mov || m.yr) parts.push(`${m.mov || ''}${m.mov && m.yr ? ' (' + m.yr + ')' : (m.yr || '')}`.trim());
  if (m.orig) parts.push(m.orig);
  if (m.comp) parts.push(m.comp);
  return parts.join(' · ');
}

function songMetaMatchesKeyword(title, kw) {
  const m = getSongMeta(title);
  if (!m) return false;
  return ['orig', 'comp', 'lyr', 'mov', 'yr', 'act'].some(k => String(m[k] || '').toUpperCase().includes(kw));
}

let STATIC_HOST_NO_API_IDX = false;

function stripWikiHtmlIdx(html) {
  return String(html || '')
    .replace(/<sup[\s\S]*?<\/sup>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<(?:br|li|p|div)[^>]*>/gi, ', ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ').replace(/&#\d+;/g, ' ').replace(/&quot;/g, '"')
    .replace(/\b(?:Songs|Score)\s*:\s*/gi, '')
    .replace(/\s*\([^)]*(?:soundtrack|film|song|composer|singer|actor|lyricist|lyrics|score|songs)[^)]*\)/gi, '')
    .replace(/\s*,\s*(?:,\s*)+/g, ', ')
    .replace(/\s*,\s*/g, ', ')
    .replace(/\s+/g, ' ')
    .replace(/^[\s,•–-]+|[\s,•–-]+$/g, '');
}

function parseWikiInfoboxHtmlIdx(html) {
  const boxM = String(html || '').match(/<table[^>]*class="[^"]*infobox[^"]*"[\s\S]*?<\/table>/i);
  if (!boxM) return null;
  const rows = {};
  const headers = [];
  const trRe = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  let m;
  while ((m = trRe.exec(boxM[0])) !== null) {
    const th = m[1].match(/<th[^>]*>([\s\S]*?)<\/th>/i);
    const td = m[1].match(/<td[^>]*>([\s\S]*?)<\/td>/i);
    if (th && td) {
      const k = stripWikiHtmlIdx(th[1]).toLowerCase();
      const v = stripWikiHtmlIdx(td[1]);
      if (k && v) rows[k] = v;
    } else if (th) {
      headers.push(stripWikiHtmlIdx(th[1]));
    }
  }
  rows._headers = headers.join(' | ');
  return rows;
}

async function fetchWikiInfoboxIdx(pageTitle) {
  try {
    const url = 'https://en.wikipedia.org/w/api.php?action=parse&page=' + encodeURIComponent(pageTitle) + '&prop=text&section=0&redirects=1&format=json&origin=*';
    const r = await fetch(url);
    if (!r.ok) return null;
    const j = await r.json();
    const html = j && j.parse && j.parse.text && j.parse.text['*'];
    return html ? parseWikiInfoboxHtmlIdx(html) : null;
  } catch (_) {
    return null;
  }
}

async function fetchPublicSongMetaIdx(songTitle) {
  const title = String(songTitle || '').trim();
  const meta = { orig: '', comp: '', lyr: '', mov: '', yr: '', act: '' };
  if (!title) return meta;
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const titleNorm = norm(title);

  const [itRes, wpRes] = await Promise.all([
    fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(title) + '&entity=song&country=IN&limit=8').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(title + ' song') + '&srlimit=5&format=json&origin=*').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);

  const hits = (wpRes?.query?.search || []).filter(h => !/\((?:tv series|television|serial)\)/i.test(h.title));
  for (const hit of hits.slice(0, 3)) {
    const box = await fetchWikiInfoboxIdx(hit.title);
    if (!box) continue;
    const hdr = box._headers || '';
    const isSongBox = Boolean(
      box['artist'] || box['composer(s)'] || box['composer'] || box['lyricist(s)'] || box['lyricist'] ||
      box['songwriter(s)'] || box['album'] || /\b(?:song|single)\s+by\b/i.test(hdr)
    );
    if (!isSongBox) continue;
    const byMatch = hdr.match(/\b(?:song|single)\s+by\s+([^|]+?)(?:\s+from\s+the\s+(?:album|film)\s+([^|]+))?(?:\||$)/i);
    meta.orig = box['artist'] || box['singer(s)'] || box['singer'] || (byMatch && byMatch[1] ? byMatch[1].trim() : '') || meta.orig;
    meta.comp = box['composer(s)'] || box['composer'] || box['music'] || meta.comp;
    meta.lyr = box['lyricist(s)'] || box['lyricist'] || box['songwriter(s)'] || meta.lyr;
    meta.mov = box['film'] || box['album'] || (byMatch && byMatch[2] ? byMatch[2].trim() : '') || meta.mov;
    const yrM = String(box['released'] || box['recorded'] || '').match(/\b(19\d{2}|20\d{2})\b/);
    if (yrM) meta.yr = yrM[1];
    break;
  }

  const itAll = (itRes?.results || []).filter(x => !/\b(remix|drill|lofi|lo-fi|cover|karaoke|instrumental|mashup)\b/i.test((x.trackName || '') + ' ' + (x.collectionName || '')));
  const bestIt = itAll.find(x => norm(x.trackName).includes(titleNorm) || titleNorm.includes(norm(x.trackName).slice(0, 8))) || itAll[0];
  if (bestIt) {
    if (!meta.orig && bestIt.artistName) meta.orig = String(bestIt.artistName).trim();
    if (!meta.mov) {
      const fromMatch = String(bestIt.trackName || '').match(/\(From\s+["'\u201c]([^"'\u201d]+)["'\u201d]\)/i);
      const albClean = String(bestIt.collectionName || '').replace(/\s*\([^)]*(?:Soundtrack|Motion Picture|EP|Single)[^)]*\)/gi, '').trim();
      meta.mov = (fromMatch && fromMatch[1]) ? fromMatch[1].trim() : albClean;
    }
    if (!meta.yr && bestIt.releaseDate) {
      const y = String(bestIt.releaseDate).slice(0, 4);
      if (/^(19|20)\d{2}$/.test(y)) meta.yr = y;
    }
  }

  if (meta.mov && (!meta.act || !meta.comp || !meta.yr)) {
    const mvSrch = await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(meta.mov + ' film ' + (meta.yr || '')) + '&srlimit=4&format=json&origin=*').then(r => r.ok ? r.json() : null).catch(() => null);
    const mvHits = (mvSrch?.query?.search || []).filter(h => !/\((?:tv series|television|serial|soundtrack)\)/i.test(h.title));
    for (const mh of mvHits.slice(0, 2)) {
      const mbox = await fetchWikiInfoboxIdx(mh.title);
      if (!mbox || (!mbox['directed by'] && !mbox['starring'])) continue;
      if (!meta.act && mbox['starring']) {
        meta.act = mbox['starring'].split(',').map(x => x.trim()).filter(Boolean).slice(0, 3).join(', ');
      }
      if (!meta.comp && mbox['music by']) meta.comp = mbox['music by'].split(',').map(x => x.trim()).filter(Boolean).slice(0, 3).join(', ');
      if (!meta.yr && (mbox['release date'] || mbox['release dates'])) {
        const my = String(mbox['release date'] || mbox['release dates']).match(/\b(19\d{2}|20\d{2})\b/);
        if (my) meta.yr = my[1];
      }
      break;
    }
  }
  return meta;
}

window.fetchArchiveMetaAI = async (songTitle) => {
  const statusEl = $('#arch_meta_status');
  const btnEl = $('#btn_arch_meta_ai');
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'AI Loading…'; }
  if (statusEl) { statusEl.style.color = 'var(--ac)'; statusEl.textContent = `Fetching metadata for "${songTitle}"…`; }
  try {
    let aiMeta = null;
    if (!STATIC_HOST_NO_API_IDX) {
      try {
        const resp = await fetch('/api/song-metadata', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ songTitle }),
        });
        const ct = resp.headers.get('content-type') || '';
        if (resp.status === 405 || resp.status === 404 || (!ct.includes('application/json') && !resp.ok)) {
          STATIC_HOST_NO_API_IDX = true;
        } else if (resp.ok) {
          const data = await resp.json().catch(() => ({}));
          if (data && data.meta) aiMeta = data.meta;
        }
      } catch (_) {}
    }
    if (!aiMeta) {
      aiMeta = await fetchPublicSongMetaIdx(songTitle);
    }
    let filled = 0;
    ['orig', 'comp', 'lyr', 'mov', 'yr', 'act'].forEach(k => {
      const inp = $('#arch_meta_' + k);
      if (inp && aiMeta[k]) { inp.value = String(aiMeta[k]).trim(); filled++; }
    });
    if (statusEl) {
      statusEl.style.color = filled ? '#15803d' : '#d97706';
      statusEl.textContent = filled ? `✓ Filled ${filled} field${filled === 1 ? '' : 's'} — click Save to Archive.` : 'Could not find verified details for this title. You can enter them manually.';
    }
  } catch (err) {
    if (statusEl) { statusEl.style.color = '#dc2626'; statusEl.textContent = err?.message || 'Metadata lookup failed.'; }
  } finally {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '✨ AI Fill'; }
  }
};

window.downloadSongListPDF = () => {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    showNotice('PDF engine loading, please wait a moment.');
    return;
  }

  const allArchive = getAllArchiveSongs();
  const curMo = nowM();
  const t = tdy();
  const asc = v => String(v == null ? '' : v).replace(/[^\x20-\xff]/g, '');
  const songPdf = s => {
    const sub = formatSongMetaSummary(getSongMeta(s));
    return sub ? `${asc(s)}\n${asc(sub)}` : asc(s);
  };
  const datePdf = dt => {
    const sm = getSessionMetaForDate(dt);
    const parts = [];
    if (sm.theme) parts.push(`Theme: ${asc(sm.theme)}`);
    if (sm.host) parts.push(`Host: ${asc(sm.host)}`);
    return parts.length ? `${fd(dt)}\n${parts.join(' | ')}` : fd(dt);
  };

  let title = 'Song List';
  let head = [['#', 'Song ID', 'Date', 'Singer Name', 'Song Title']];
  let body = [];
  let headerMetaLine = '';

  if (songListTab === 'today') {
    title = `Songs Performed Today (${fd(t)})`;
    const smToday = getSessionMetaForDate(t);
    headerMetaLine = `Theme: ${asc(smToday.theme || '-')}   |   Host: ${asc(smToday.host || '-')}`;
    head = [['#', 'Song ID', 'Round', 'Singer Name', 'Song Title']];
    let todayRows = [];
    if (LIVE_SESSION && LIVE_SESSION.date === t && LIVE_SESSION.performances) {
      todayRows = LIVE_SESSION.performances.filter(p => p.song).map(p => ({
        round: p.round ? 'Round ' + p.round : '-',
        singer: p.singer,
        song: p.song,
        id: p.songId || '-'
      }));
    } else {
      todayRows = allArchive.filter(r => r[1] === t).map(r => ({
        round: '-',
        singer: r[2],
        song: r[3],
        id: r[0]
      }));
    }
    todayRows.sort((a, b) => cmpBySongId([a.id], [b.id]));
    body = todayRows.map((r, i) => [String(i + 1), asc(r.id), asc(r.round), asc(r.singer), songPdf(r.song)]);
  } else if (songListTab === 'month') {
    title = `Songs Performed in Month (${curMo})`;
    const rows = allArchive.filter(r => r[1] && r[1].startsWith(curMo));
    body = rows.map((r, i) => [String(i + 1), asc(r[0]), datePdf(r[1]), asc(r[2]), songPdf(r[3])]);
  } else if (songListTab === 'singer') {
    const singersList = [...new Set(allArchive.map(r => r[2]))].filter(Boolean).sort();
    const activeSinger = selectedSingerFilter || singersList[0] || '';
    title = `Song Record: ${activeSinger || 'All'}`;
    const rows = activeSinger ? allArchive.filter(r => r[2] === activeSinger) : [];
    body = rows.map((r, i) => [String(i + 1), asc(r[0]), datePdf(r[1]), asc(r[2]), songPdf(r[3])]);
  } else if (songListTab === 'unique') {
    title = 'Unique Song List (No Repetition)';
    head = [['#', 'First Song ID', 'Song Title', 'Sung By', 'Times Sung']];
    const songMap = new Map();
    allArchive.forEach(r => {
      const k = (r[3] || '').trim().toUpperCase();
      if (!k) return;
      if (!songMap.has(k)) {
        songMap.set(k, { firstId: r[0], title: k, count: 1, singers: new Set([r[2]]) });
      } else {
        const entry = songMap.get(k);
        entry.count++;
        entry.singers.add(r[2]);
      }
    });
    const uniqueRows = [...songMap.values()].sort((a, b) => a.title.localeCompare(b.title));
    body = uniqueRows.map((u, i) => [String(i + 1), asc(u.firstId), songPdf(u.title), asc([...u.singers].join(', ')), `${u.count}x`]);
  } else {
    title = 'Full Master Song Directory';
    const kw = (typeof searchSongKeyword !== 'undefined' && searchSongKeyword) ? searchSongKeyword : '';
    const rows = kw ? allArchive.filter(r => (r[0]||'').includes(kw) || (r[2]||'').includes(kw) || (r[3]||'').includes(kw) || songMetaMatchesKeyword(r[3], kw)) : allArchive;
    body = rows.map((r, i) => [String(i + 1), asc(r[0]), datePdf(r[1]), asc(r[2]), songPdf(r[3])]);
  }

window.syncHistoricalSOTD = async () => {

    try {
      const dataRef = doc(fs, 'pub', 'data');

      if (!snap.exists()) return;
      const pData = snap.data();
      const curSotd = Array.isArray(pData.sotd) ? pData.sotd.slice() : [];
      const existingDates = new Set(curSotd.map(x => x.d));
      let added = 0;
      HISTORICAL_SOTD_PRE_OCT26.forEach(item => {
        if (!existingDates.has(item.d)) {
          curSotd.push(item);
          added++;
        }
      });

function getMondayOfWeek(dateStr) {
  const d = new Date((dateStr || tdy()) + 'T00:00:00');
  const day = d.getDay(); // 0=Sun, 1=Mon...
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.setDate(diff));
  return mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0');
}

function getWeekDatesMonToFri(mondayStr) {
  const base = new Date(mondayStr + 'T00:00:00');
  const dates = [];
  for (let i = 0; i < 5; i++) {
    const dt = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    dates.push(dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'));
  }
  return dates;
}

window.previewWeeklyAttendanceRule = () => {
  if (!PUB || !PUB.stars) { showNotice('Published star records not loaded.'); return; }
  const mon = ruleEvalWeekStart || getMondayOfWeek(tdy());
  ruleEvalWeekStart = mon;
  const weekDates = getWeekDatesMonToFri(mon); // Mon-Fri
  const weekHolidays = weekDates.filter(d => HOLIDAYS.includes(d));
  const requiredDays = Math.max(1, 3 - weekHolidays.length); // 3 normally, 2 if 1 holiday in week

  // Map first ever appearance date for every singer in SONGS to detect mid-week new joiners
  const firstSongDateMap = {};
  SONGS.forEach(r => {
    const sg = String(r[2] || '').trim().toUpperCase();
    const dt = String(r[1] || '');
    if (sg && dt) {
      if (!firstSongDateMap[sg] || dt < firstSongDateMap[sg]) {
        firstSongDateMap[sg] = dt;
      }
    }
  });

  const results = [];
  Object.entries(PUB.stars).forEach(([singerName, starObj]) => {
    const currentStars = starObj.t || 0;
    if (currentStars <= 0) return; // Rule applies to singers holding stars (1 to 4+)

    // Count distinct session dates attended by this singer in this Mon-Fri week
    const attendedDates = new Set();
    SONGS.forEach(r => {
      if (String(r[2] || '').trim().toUpperCase() === singerName && weekDates.includes(r[1])) {
        attendedDates.add(r[1]);
      }
    });
    const daysAttended = attendedDates.size;

    // Check New Joiner Exemption: Joined during this specific week (first song ever is in weekDates after Monday)
    const firstDate = firstSongDateMap[singerName] || '';
    const isNewJoinerThisWeek = firstDate && weekDates.includes(firstDate) && firstDate > weekDates[0];

    let status = 'SAFE';
    let newStars = currentStars;
    let reason = `Attended ${daysAttended}/${requiredDays} required days`;

    if (daysAttended >= requiredDays) {
      status = 'SAFE';
      reason = `Attended ${daysAttended}/${requiredDays} required days — Star(s) safe`;
    } else if (isNewJoinerThisWeek) {
      status = 'EXEMPT';
      reason = `New participant exemption (joined ${fd(firstDate)}) — Star(s) safe`;
    } else {
      status = 'DEDUCT';
      newStars = Math.max(0, currentStars - 1);
      reason = `Attended ${daysAttended}/${requiredDays} required days — 1 star deducted (${currentStars} → ${newStars})`;
    }

    // Find user UID to send clear notification message
    const userRec = AU.find(u => String(u.singer || '').trim().toUpperCase() === singerName);

    results.push({
      singer: singerName,
      uid: userRec ? userRec.id : '',
      currentStars,
      newStars,
      daysAttended,
      requiredDays,
      status,
      reason
    });
  });

  results.sort((a, b) => a.singer.localeCompare(b.singer));
  ruleEvalPreview = {
    mon,
    weekDates,
    weekHolidays,
    requiredDays,
    results
  };
  draw();
};

// Shared IndexedDB Helper for Offline Backup Folder Handle (configured in Rules tab, used on End Session)
function openSFHSettingsDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('sfh_settings_db', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveBackupDirHandleToIDB(handle) {
  const db = await openSFHSettingsDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(handle, 'backupDirHandle');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getBackupDirHandleFromIDB() {
  try {
    const db = await openSFHSettingsDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get('backupDirHandle');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}
async function clearBackupDirHandleFromIDB() {
  try {
    const db = await openSFHSettingsDB();
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').delete('backupDirHandle');
  } catch (e) {}
}

    b45: cfg.b45 !== undefined ? parseFloat(cfg.b45) : DEFAULT_STAR_SCORING.b45
  };
}

function calcMaxPossibleStarPoints(sc) {
  const maxA = Math.max(
    sc.s1, sc.s2, sc.s3,
    sc.s1 + sc.s2 + sc.b12,
    sc.s2 + sc.s3 + sc.b23,
    sc.s1 + sc.s3 + sc.b13,
    sc.s1 + sc.s2 + sc.s3 + sc.b123
  );
  const maxB = Math.max(sc.s4, sc.s5, sc.s4 + sc.s5 + sc.b45);
  return parseFloat((maxA + maxB).toFixed(2));
}

function formatCutoffTime(sc) {
  const [sh, sm] = (sc.startTime || '20:20').split(':').map(Number);
  const totalMins = sh * 60 + sm + (sc.cutoffMins ?? 26);
  const hh = Math.floor(totalMins / 60) % 24;
  const mm = totalMins % 60;
  const ampm = hh >= 12 ? 'pm' : 'am';
  const h12 = hh % 12 || 12;
  return `${h12}:${String(mm).padStart(2, '0')} ${ampm}`;
}
function formatScheduleText(sc) {
  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const sortedDays = [...sc.days].sort();
  let dayLabel = sortedDays.map(d => dayNames[d]).join(', ');
  if (JSON.stringify(sortedDays) === JSON.stringify([1,2,3,4,5])) dayLabel = 'Monday to Friday';
  const [hh, mm] = sc.startTime.split(':').map(Number);
  const ampm = hh >= 12 ? 'pm' : 'am';
  const h12 = hh % 12 || 12;
  return `${dayLabel}, from ${h12}:${String(mm).padStart(2,'0')} ${ampm} onwards`;
}

window.saveScheduleConfig = async () => {
  if (!IS_SUPER) return;
  const days = [0,1,2,3,4,5,6].filter(d => $('#sc_day_' + d) && $('#sc_day_' + d).checked);
  if (!days.length) { showNotice('Select at least one active day of the week.'); return; }
  const startTime = $('#sc_start').value || '20:30';
  const endTime = $('#sc_end').value || '23:30';
  const cutoffMins = Math.max(0, parseInt($('#sc_cutoff').value || '15', 10) || 15);
  const forceLiveOverride = !!($('#sc_override') && $('#sc_override').checked);

  const schedule = { days, startTime, endTime, cutoffMins, forceLiveOverride };
  try {
    await setDoc(doc(fs, 'config', 'app'), { ...CONF, schedule });
    CONF.schedule = schedule;
    draw();
    showNotice('Session schedule updated! Both the live console and About page now follow: ' + formatScheduleText(schedule), 'Schedule Saved');
  } catch (err) {
    showNotice('Failed to save schedule: ' + (err.code || err.message));
  }
};

function vRules() {

  const ss = getStarScoringConfig();
  const maxPts = calcMaxPossibleStarPoints(ss);
  h += `<div class="c" style="border-left:4px solid #f59e0b">
    <div class="row" style="justify-content:space-between">
      <b>Customizable 5-Star Point & Bonus Logic</b>
      <span class="badge-ok">Max Total: ${maxPts} pts</span>
    </div>
    <p class="m" style="margin:3px 0 8px">Customize individual star points and combination bonuses used in the Live Session Console.</p>

      <label>★1 Ready on Turn (pts)<input type="number" step="0.5" id="sc_s1" value="${ss.s1}"></label>
      <label>★2 Start ≤ 30 sec (pts)<input type="number" step="0.5" id="sc_s2" value="${ss.s2}"></label>
      <label>★3 Clean / No Noise (pts)<input type="number" step="0.5" id="sc_s3" value="${ss.s3}"></label>
      <label>★4 Good Singing (pts)<input type="number" step="0.5" id="sc_s4" value="${ss.s4}"></label>

    </div>

      <button class="pri" onclick="saveStarScoringConfig()">Save Scoring Rules</button>
      <button onclick="resetStarScoringDefaults()">Reset Defaults</button>

  h += `<div class="c" style="border-left:4px solid var(--ac)">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Star & SOTM Governance Rules</h2>
      <button class="pri" onclick="location.href='stars_editor.html'">★ Stars / SOTD Editor</button>
    </div>
    <div class="m" style="line-height:1.7;margin-top:6px">

      3. <b>Post-SOTM Reset:</b> After an SOTM winner is declared, all participants with <b>4 stars reset to 0 stars</b>. Participants with <b>1 to 3 stars are unaffected</b> and keep their exact stars.<br>
      4. <b>Weekly Attendance Rule (Mon–Fri):</b> Attending fewer than <b>3 sessions</b> in a week deducts <b>1 star</b> (with a clear automated message sent to the participant). Missing 4 consecutive weeks (1 month) reduces 4 stars down to 0.<br>

      &nbsp;&nbsp;• <i>New Participant Exemption:</i> A new singer joining mid-week (e.g., on Friday for 1 day) keeps their earned star safe for that joining week.<br>

  h += `<div class="c">

          ${fd(hd)} <a href="#" onclick="removeHolidayDate('${hd}');return false" style="color:#64748b;text-decoration:none;font-weight:900">✕</a>
        </span>`).join('')}
      </div>
    ` : '<p class="m" style="margin-top:8px">No holidays declared yet.</p>'}
  </div>`;

  // Card 4: Weekly Attendance Evaluator & Star Deduction
  h += `<div class="c">
    <b>3. Weekly Attendance Check & Star Deduction</b>
    <p class="m" style="margin:4px 0 8px">Select any date in the target week (Mon–Fri) to evaluate attendance, apply exemptions, deduct 1 star where applicable, and notify participants.</p>
    <div class="row">
      <label class="m">Week Starting (Monday)

    ${ruleEvalPreview ? `
      <div style="margin-top:12px;padding:10px;background:var(--ac-light);border-radius:8px;border:1px solid var(--bd)">
        <div style="font-size:13px;font-weight:700;color:var(--ac)">
          Week: ${fd(ruleEvalPreview.weekDates[0])} to ${fd(ruleEvalPreview.weekDates[4])}
          ${ruleEvalPreview.weekHolidays.length ? ` · Holiday(s): ${ruleEvalPreview.weekHolidays.map(fd).join(', ')}` : ''}

        </div>
        ${ruleEvalPreview.results.length ? `
          <div class="tbl" style="background:var(--card);margin-top:8px"><table>
            <tr>
              <th>Singer</th>
              <th class="n">Stars</th>
              <th class="n">Attended</th>
              <th>Outcome</th>
            </tr>
            ${ruleEvalPreview.results.map(r => `
              <tr>
                <td><b>${e(r.singer)}</b></td>
                <td class="n">${r.currentStars}★</td>
                <td class="n">${r.daysAttended}/${r.requiredDays}</td>

                  ${r.status === 'EXEMPT' ? `<span class="badge-warn">Exempt</span> ` : ''}
                  ${r.status === 'DEDUCT' ? `<span class="badge-ded">-1 Star (${r.currentStars}→${r.newStars})</span> ` : ''}
                  <span class="m" style="font-size:12px">${e(r.reason)}</span>
                </td>
              </tr>
            `).join('')}
          </table></div>
          ${ruleEvalPreview.results.some(r => r.status === 'DEDUCT') ? `
            <p style="margin:10px 0 0;text-align:right">
              <button class="danger" onclick="applyWeeklyAttendanceRule()">Apply Deductions & Send Messages</button>

        ` : '<p class="m" style="margin-top:8px">No participants currently hold stars to evaluate.</p>'}
      </div>
    ` : ''}
  </div>`;

  return h;
}

const phoneDigits=id=>{const dg=(id||'').replace(/\D/g,'').slice(-10);return dg.length==10?dg:''};
const emailsFor=id=>{id=(id||'').trim();if(id.includes('@'))return [id.toLowerCase()];const dg=phoneDigits(id);return dg?[dg+'@singfromhome-phone.app',dg+'-2@singfromhome-phone.app',dg+'-3@singfromhome-phone.app']:[]};
const authMsg=x=>({'auth/invalid-credential':'Wrong phone/email or password.','auth/wrong-password':'Wrong password.','auth/user-not-found':'No account found. Tap Create account.','auth/email-already-in-use':'This phone number or email already has an account. Tap Sign in.','auth/weak-password':'The password must have at least 6 characters.','auth/operation-not-allowed':'Email/password login is not turned on in Firebase yet.','auth/invalid-email':'Enter a valid 10-digit phone number or an email.','auth/network-request-failed':'No internet. Please try again.','auth/too-many-requests':'Too many attempts. Please wait a few minutes and try again.'}[x.code]||('Failed ('+(x.code||'error')+')'));
const needConsent=()=>{if(!$('#cs')||!$('#cs').checked){showNotice('Please tick the consent box first.');return true}return false};
window.loginPw=async()=>{if(needConsent())return;const ems=emailsFor($('#lid').value),pw=$('#lpw').value;
  if(!ems.length||pw.length<6){showNotice('Enter a 10-digit phone number or an email, and a password of at least 6 characters.');return}
  let last=null;
  for(const em of ems){try{await signInWithEmailAndPassword(auth,em,pw);return}catch(x){last=x;if(!['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(x.code))break}}
  showNotice(authMsg(last)+(ems.length>1?' If you forgot your password, type your name and a new password above and tap Forgot password.':''))};
window.signupPw=async()=>{if(needConsent())return;const nm=$('#lnm').value.trim(),ems=emailsFor($('#lid').value),pw=$('#lpw').value;
  if(!nm){showNotice('Please type your name.');return}
  if(!ems.length||pw.length<6){showNotice('Enter a 10-digit phone number or an email, and a password of at least 6 characters.');return}
  pendingName=nm;
  try{const c=await createUserWithEmailAndPassword(auth,ems[0],pw);try{await updateProfile(c.user,{displayName:nm})}catch(y){}}
  catch(x){showNotice(authMsg(x))}};
window.forgotPw=async()=>{const raw=($('#lid').value||'').trim();
  if(raw.includes('@')){try{await sendPasswordResetEmail(auth,raw);showNotice('A reset link has been sent to '+raw+'. Check your inbox and spam folder.');}catch(x){showNotice(authMsg(x))}return}
  const ems=emailsFor(raw);if(!ems.length){showNotice('Type your 10-digit phone number first.');return}
  if(needConsent())return;
  const nm=$('#lnm').value.trim(),pw=$('#lpw').value;
  if(!nm||pw.length<6){showNotice('Type your name and a NEW password (at least 6 characters) in the boxes above, then tap Forgot password again.');return}
  showConfirm('A reset link cannot be sent to a phone number. A new login will be created for this number with the new password you typed, and the host must approve you again. Continue?', async () => {
    pendingName=nm;
    for(const em of ems.slice(1)){
      try{const c=await createUserWithEmailAndPassword(auth,em,pw);try{await updateProfile(c.user,{displayName:nm})}catch(y){}return}
      catch(x){if(x.code!='auth/email-already-in-use'){showNotice(authMsg(x));return}}
    }
    showNotice('Too many resets for this number. Please contact the host.');
  });
};

function vAbout(pub){

  return (pub?'<div class="c"><button onclick="closeAbout()">← Back</button></div>':'')

  +sec('Our agenda',A.agenda,A.agendaPoints)+sec('How we work',A.how,A.howPoints)+sec('Registrations',null,A.registrations)
  +((S.intro||S.schedule||(S.rules&&S.rules.length)||(S.committee&&S.committee.length))?`<div class="c"><b>SING FRO<span style="color:#8b0000;font-weight:900">M</span> HO<span style="color:#8b0000;font-weight:900">M</span>E</b>${PP(S.intro)}${'<p><b>When:</b> '+e(formatScheduleText(getSchedule()))+'</p>'}${UL(S.rules)}${(S.committee&&S.committee.length)?`<p style="font-size:12px;line-height:1.6;margin:10px 0 0"><b>Core Committee:</b> ${S.committee.map(x=>e(x)).join(' · ')}</p>`:''}</div>`:'')
  +(SP.upi?`<div class="c"><b>Support our work (voluntary)</b>${PP(SP.intro)}<p style="margin:6px 0"><b>UPI ID:</b> ${e(SP.upi)}</p>${SP.qrImage?`<p><img src="${e(SP.qrImage)}" alt="UPI QR code" style="width:200px;max-width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff"></p>`:''}<p><a class="zm" style="background:var(--ac);border-color:var(--ac);color:#ffffff;font-weight:700" href="upi://pay?pa=${encodeURIComponent(SP.upi)}&amp;pn=${encodeURIComponent(SP.payeeName||F.name)}&amp;cu=INR">Pay with a UPI app</a></p>${SP.note?'<p class="m">'+e(SP.note)+'</p>':''}</div>`:'')
  +sec('Message from the Director',A.message)

function showCard(o){const old=document.getElementById('dw');if(old)old.remove();
  const d=document.createElement('div');d.id='dw';
  d.innerHTML=`<div class="card"${o.bg?` style="background:${o.bg}"`:''}><button class="x" onclick="closeDw()" aria-label="Close">✕</button><div class="diya">${o.icon}</div><h2>${e(o.title)}</h2>${o.sub?`<p style="font-size:20px;font-weight:600;margin:4px 0">${e(o.sub)}</p>`:''}<p style="font-size:15px;line-height:1.6;margin:12px 0;white-space:pre-line">${e(o.text)}</p>${o.sig?`<p style="margin:12px 0 16px;font-size:13px;opacity:0.95">${o.sig}</p>`:''}<button style="background:#fff;color:#0f3460;border:0;border-radius:10px;padding:11px 34px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.2)" onclick="closeDw()">Close</button></div>`;
  d.onclick=ev=>{if(ev.target===d)closeDw()};document.body.appendChild(d)}
function seenMap(){try{return JSON.parse(localStorage.getItem('sfh_cards')||'{}')}catch(x){return {}}}
function nextCard(){if(document.getElementById('dw'))return;const c=GQ.shift();if(!c)return;const m=seenMap();m[c.key]=tdy();try{localStorage.setItem('sfh_cards',JSON.stringify(m))}catch(x){}showCard(c)}
window.closeDw=()=>{const d=document.getElementById('dw');if(d)d.remove();nextCard()};
function runCards(){const t=tdy(),m=seenMap(),due=[];
  [...BUILTIN,...GRT].forEach(g=>{const k='g-'+(g.id||g.title);if(g.from<=t&&t<=g.to&&m[k]!==t)due.push({key:k,icon:g.icon||'🎉',title:g.title,sub:g.hi,text:g.text,sig:SIGN})});
  if(U&&P&&(ADM||P.status=='approved')){const md=t.slice(5),bl=BD.filter(b=>b.md==md);
    if(bl.length&&m['bd-'+t]!==t){const mine=bl.some(b=>b.id==U.uid),names=bl.map(b=>b.singer).join(', ');
      due.push({key:'bd-'+t,icon:'🎂',title:mine?'Happy Birthday!':'Birthday today',sub:mine?'':names,
        text:mine?'Wishing you a wonderful birthday'+(bl.find(b=>b.id==U.uid).singer?', '+bl.find(b=>b.id==U.uid).singer:'')+'! May your year be full of music, health and joy.':'Let us wish '+names+' a very happy birthday today!',
        sig:mine?'– The SING FROM HOME family':'',bg:'linear-gradient(150deg,#0f3460 0%,#1e4a7a 50%,#2563eb 100%)'})}}
  GQ=due;nextCard()}
function bdCard(){const out=[],b0=new Date(tdy()+'T00:00');
  for(let i=0;i<=7;i++){const d=new Date(b0.getFullYear(),b0.getMonth(),b0.getDate()+i),md=mdOf(d);BD.filter(b=>b.md==md).forEach(b=>out.push({n:b.singer,i,d}))}
  return out.length?`<div class="c"><b>Birthdays</b>${out.map(o=>`<p style="margin:5px 0"><b>${e(o.n)}</b> <span class="m">${o.i==0?'today':o.d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span></p>`).join('')}</div>`:''}

  const allRawSingers = [...new Set([
    ...RAW_SINGERS_BEFORE_ALIAS,
    ...names,

window.mergeSingersInCloud = async (fromArg, toArg) => {
  if (!IS_SUPER) return;
  const fromName = String(fromArg || ($('#merge_from') ? $('#merge_from').value : '') || '').trim().toUpperCase();
  const toName = String(toArg || ($('#merge_to') ? $('#merge_to').value : '') || '').trim().toUpperCase();
  if (!fromName || !toName) {
    showNotice("Please select both the duplicate singer name and the primary singer name to keep.");
    return;
  }
  if (fromName === toName) {
    showNotice("Duplicate name and Primary name must be different.");
    return;
  }

  showConfirm(
    `Permanently merge "${fromName}" into "${toName}" across all cloud records?\n\n` +
    `• All songs by ${fromName} will be reassigned to ${toName}\n` +
    `• SOTD history, SOM records & stars will be merged without double-counting dates\n` +
    `• Linked participant accounts & birthdays will point to ${toName}\n` +
    `• Future entries as ${fromName} will automatically resolve to ${toName}`,
    async () => {
      try {
        let songsMoved = 0;
        let monthsUpdated = 0;

        // 1. Update all monthly song docs (or legacy pub/songs)
        const ixRef = doc(fs, 'pub', 'idx');
        const ixSnap = await getDoc(ixRef);
        if (ixSnap.exists()) {
          const idxData = ixSnap.data();
          const monthsMap = { ...(idxData.months || {}) };
          const ms = Object.keys(monthsMap).sort();
          for (const m of ms) {
            const mRef = doc(fs, 'pub', 'songs_' + m);
            const mSnap = await getDoc(mRef);
            if (!mSnap.exists()) continue;
            const list = JSON.parse(mSnap.data().json || '[]');
            let changed = false;
            list.forEach(row => {
              if (String(row[2] || '').trim().toUpperCase() === fromName) {
                row[2] = toName;
                songsMoved++;
                changed = true;
              }
            });
            if (changed) {
              const mJson = JSON.stringify(list);
              const mHash = hsh(mJson);
              await setDoc(mRef, { ...mSnap.data(), json: mJson, n: list.length, h: mHash, ts: tdy() });
              monthsMap[m] = { n: list.length, h: mHash };
              monthsUpdated++;
            }
          }
          if (monthsUpdated > 0) {
            await setDoc(ixRef, { ...idxData, months: monthsMap, ts: tdy() });
          }
        } else {
          const bRef = doc(fs, 'pub', 'songs');
          const bSnap = await getDoc(bRef);
          if (bSnap.exists()) {
            const list = bSnap.data().json ? JSON.parse(bSnap.data().json) : (bSnap.data().list || []);
            let changed = false;
            list.forEach(row => {
              if (String(row[2] || '').trim().toUpperCase() === fromName) {
                row[2] = toName;
                songsMoved++;
                changed = true;
              }
            });
            if (changed) {
              await setDoc(bRef, { ...bSnap.data(), json: JSON.stringify(list), ts: tdy() });
              monthsUpdated++;
            }
          }
        }

        // 2. Update pub/data (singers, sotd, som, stars)
        const dataRef = doc(fs, 'pub', 'data');
        const dataSnap = await getDoc(dataRef);
        let sotdMoved = 0;
        let starsMerged = false;
        if (dataSnap.exists()) {
          const pData = dataSnap.data();
          const singersSet = new Set((pData.singers || []).map(s => {
            const u = String(s || '').trim().toUpperCase();
            return u === fromName ? toName : u;
          }).filter(Boolean));
          singersSet.add(toName);

          const sotdOut = (pData.sotd || []).map(entry => {
            const dedup = [];
            (entry.l || []).forEach(w => {
              const rawN = String((w && w.n) || w || '').trim().toUpperCase();
              const finalN = rawN === fromName ? toName : rawN;
              if (rawN === fromName) sotdMoved++;
              if (finalN && !dedup.some(x => x.n === finalN)) {
                dedup.push({ n: finalN, h: (w && w.h) || 'Score' });
              }
            });
            return { d: entry.d, l: dedup };
          });

          const somOut = { ...(pData.som || {}) };
          Object.keys(somOut).forEach(k => {
            if (String(somOut[k] || '').trim().toUpperCase() === fromName) somOut[k] = toName;
          });

          const starsOut = { ...(pData.stars || {}) };
          const matchingFromKeys = Object.keys(starsOut).filter(k => k.trim().toUpperCase() === fromName);
          if (matchingFromKeys.length) {
            let targetRec = starsOut[toName] || null;
            matchingFromKeys.forEach(k => {
              targetRec = mergeStarRecords(targetRec, starsOut[k]);
              delete starsOut[k];
            });
            starsOut[toName] = targetRec;
            starsMerged = true;
          }

          await setDoc(dataRef, {
            ...pData,
            singers: [...singersSet].sort(),
            sotd: sotdOut,
            som: somOut,
            stars: starsOut,
            ts: tdy()
          });
        }

        // 3. Update linked users & birthdays
        let usersUpdated = 0;
        try {
          const uSnap = await getDocs(collection(fs, 'users'));
          for (const d of uSnap.docs) {
            if (String(d.data().singer || '').trim().toUpperCase() === fromName) {
              await updateDoc(doc(fs, 'users', d.id), { singer: toName });
              usersUpdated++;
            }
          }
        } catch (_ue) {}

        try {
          const bdSnap = await getDocs(collection(fs, 'birthdays'));
          for (const d of bdSnap.docs) {
            if (String(d.data().singer || '').trim().toUpperCase() === fromName) {
              await updateDoc(doc(fs, 'birthdays', d.id), { singer: toName });
            }
          }
        } catch (_bde) {}

        // 4. Save permanent alias in config/app so future entries/backups auto-resolve
        const nextAliases = { ...(CONF.singerAliases || {}), [fromName]: toName };
        await setDoc(doc(fs, 'config', 'app'), { singerAliases: nextAliases }, { merge: true });
        CONF.singerAliases = nextAliases;

        await load();
        await loadAdm();
        draw();
        showNotice(
          `Merged "${fromName}" → "${toName}" successfully!\n\n` +
          `• Songs updated: ${songsMoved} (${monthsUpdated} month archive(s))\n` +
          `• SOTD records updated: ${sotdMoved}\n` +
          `• Stars merged: ${starsMerged ? 'Yes' : 'No separate record'}\n` +
          `• Participant accounts updated: ${usersUpdated}\n` +
          `• Auto-merge alias saved permanently`,
          "Singers Merged"
        );
      } catch (err) {
        showNotice("Merge failed: " + (err.code || err.message), "Error");
      }
    },
    "Merge Duplicate Singers"
  );
};

function getSOTMJudgeFinalists() {
  const fromPanel = (SOTM_PANEL_CACHE && Array.isArray(SOTM_PANEL_CACHE.finalists) && SOTM_PANEL_CACHE.finalists.length)
    ? SOTM_PANEL_CACHE.finalists.map(f => canonSinger(f.name)).filter(Boolean)
    : [];
  if (fromPanel.length) return [...new Set(fromPanel)];
  const fourStar = Object.entries((PUB && PUB.stars) || {})
    .filter(([, o]) => (o && o.t >= 4))
    .map(([nm]) => canonSinger(nm))
    .filter(Boolean)
    .sort();
  return [...new Set(fourStar)];
}

    .filter(([, o]) => (o && o.t >= 4))
    .map(([nm]) => canonSinger(nm))

          <td class="n"><input id="jdg_perf_${idx}" type="number" step="0.5" min="0" max="10" value="${cur.perf !== '' && cur.perf != null ? e(cur.perf) : ''}" oninput="recalcJudgeRow(${idx},${aud})" style="width:56px;padding:4px 6px;text-align:center"></td>
          <td class="n"><b id="jdg_tot_${idx}" style="color:var(--ac)">${tot}</b></td>
          ${effSuper() ? `<td class="n" style="color:#0369a1;font-weight:700">${aud}</td><td class="n" id="jdg_grand_${idx}" style="color:#15803d;font-weight:900">${grand}</td>` : ''}
        </tr>`;
      }).join('')}
    </table></div>
    <p style="margin-top:12px"><button class="pri" onclick="submitJudgeScores()">${effSuper() ? 'Save Judge Scores to Panel' : 'Submit Judge Scores'}</button></p>` : '<p class="m">No SOTM finalists are currently listed. Tap <b>↻ Sync 4★</b> above to load current 4-Star qualifiers.</p>'}
  </div>
  ${effSuper() ? `<div class="c">
    <b>Submitted Judge Ballots (${submittedJudgeDocs.length})</b>
    ${submittedJudgeDocs.length ? submittedJudgeDocs.map(docItem => {
      const entries = Object.entries(docItem.sotmJudgeScores || {});
      return `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)">
        <b>${e(canonSinger(docItem.singer || 'JUDGE'))}</b> <span class="m">· ${fdt(docItem.upd || docItem.ts)}</span>
        <div class="tbl" style="margin-top:6px"><table>
          <tr><th>Singer</th><th class="n">Sur</th><th class="n">Taal</th><th class="n">Choice</th><th class="n">Perf</th><th class="n">Total</th></tr>
          ${entries.map(([sn, sc]) => {
            const t = parseFloat(((Number(sc.sur)||0)+(Number(sc.taal)||0)+(Number(sc.sel)||0)+(Number(sc.perf)||0)).toFixed(1));
            return `<tr><td><b>${e(canonSinger(sn))}</b></td><td class="n">${sc.sur}</td><td class="n">${sc.taal}</td><td class="n">${sc.sel}</td><td class="n">${sc.perf}</td><td class="n"><b>${t}</b></td></tr>`;
          }).join('')}
        </table></div>
      </div>`;
    }).join('') : '<p class="m" style="margin:4px 0 0">No remote Judge scorecards submitted today yet. Appointed judges see the <b>Judge</b> tab in their window once logged in.</p>'}
  </div>` : ''}`;
}

window.recalcJudgeRow = (idx, aud = 0) => {
  const g = id => parseFloat(($('#' + id) && $('#' + id).value) || '0') || 0;
  const tot = parseFloat((g('jdg_sur_' + idx) + g('jdg_taal_' + idx) + g('jdg_sel_' + idx) + g('jdg_perf_' + idx)).toFixed(1));
  const el = $('#jdg_tot_' + idx);
  if (el) el.textContent = String(tot);
  const gr = $('#jdg_grand_' + idx);
  if (gr) gr.textContent = String(parseFloat((tot + (Number(aud) || 0)).toFixed(1)));
};

window.submitJudgeScores = async () => {
  if (!U || (!effJudge() && !effSuper())) return;
  const finalists = getSOTMJudgeFinalists();
  if (!finalists.length) return;
  const vp = curP();
  const judgeName = canonSinger(vp.singer || vp.name || (U && U.displayName) || 'JUDGE');
  const todayStr = (LIVE_SESSION && LIVE_SESSION.date) ? LIVE_SESSION.date : tdy();
  const scoresMap = {};
  const panelFinalists = (SOTM_PANEL_CACHE && Array.isArray(SOTM_PANEL_CACHE.finalists)) ? SOTM_PANEL_CACHE.finalists : [];
  const nextFinalists = [];
  finalists.forEach((nm, idx) => {
    const readVal = id => {
      const raw = $('#' + id) ? $('#' + id).value : '';
      if (raw === '') return 0;
      const n = parseFloat(raw);
      return isNaN(n) ? 0 : Math.max(0, Math.min(10, n));
    };
    const sur = readVal('jdg_sur_' + idx);
    const taal = readVal('jdg_taal_' + idx);
    const sel = readVal('jdg_sel_' + idx);
    const perf = readVal('jdg_perf_' + idx);
    scoresMap[nm] = { sur, taal, sel, perf, judge: judgeName, ts: Date.now() };
    const existing = panelFinalists.find(f => canonSinger(f.name) === nm);
    nextFinalists.push({
      name: nm,
      sur,
      taal,
      sel,
      perf,
      audience: existing ? (Number(existing.audience) || 0) : 0
    });
  });
  try {
    if (effSuper()) {
      const nextPanel = {
        ...(SOTM_PANEL_CACHE || {}),
        monthLabel: (SOTM_PANEL_CACHE && SOTM_PANEL_CACHE.monthLabel) || fm(nowM()).toUpperCase(),
        judges: (CONF && Array.isArray(CONF.sotmJudges) && CONF.sotmJudges.length)
          ? CONF.sotmJudges.slice()
          : ((SOTM_PANEL_CACHE && SOTM_PANEL_CACHE.judges) || ['SOHAN KUMAR']),
        finalists: nextFinalists,
        updatedAt: Date.now()
      };
      await setDoc(doc(fs, 'vote', 'sotm_panel'), nextPanel, { merge: true });
      SOTM_PANEL_CACHE = nextPanel;
      draw();
      showNotice('SOTM Judge Panel scores saved and synced to Live Console!', 'Panel Updated');
    } else {
      const planRef = doc(fs, 'plans', `${todayStr}_${U.uid}`);
      await setDoc(planRef, {
        uid: U.uid,
        date: todayStr,
        singer: judgeName,
        isJudge: true,
        sotmJudgeScores: scoresMap,
        upd: Date.now()
      }, { merge: true });
      if (!PLAN) PLAN = { uid: U.uid, date: todayStr, singer: judgeName, songs: [] };
      PLAN.sotmJudgeScores = scoresMap;
      draw();
      showNotice('Your SOTM Judge scores have been submitted to the Live Console!', 'Judge Scores Saved');
    }
  } catch (err) {
    showNotice('Could not submit judge scores: ' + (err.code || err.message));
  }
};

async function syncAppointedJudgesToCloud() {
  try {
    const q = await getDocs(collection(fs, 'users'));
    const allUsers = q.docs.map(x => ({ id: x.id, ...x.data() }));
    const judgeNames = [...new Set(
      allUsers
        .filter(u => u.status === 'approved' && isUserJudge(u))
        .map(u => canonSinger(u.singer || u.name || idOf(u.email)))
        .filter(Boolean)
    )].sort();
    await setDoc(doc(fs, 'config', 'app'), { sotmJudges: judgeNames }, { merge: true });
    CONF.sotmJudges = judgeNames;
    if (judgeNames.length) {
      await setDoc(doc(fs, 'vote', 'sotm_panel'), { judges: judgeNames, updatedAt: Date.now() }, { merge: true });
    }
  } catch (_je) {}
}

window.makeJudge = async (id, name) => {
  if (!IS_SUPER) return;
  const uObj = AU.find(x => x.id === id) || {};
  showConfirm(`Appoint ${name} as SOTM Judge?\n\n• Sets ${name} as the Appointed Judge in the SOTM Judge Panel\n• Gives them access to the SOTM Judge Scorecard to submit Sur, Taal, Choice & Performance marks`, async () => {
    try {
      const nextRole = uObj.role === 'admin' ? 'admin' : 'judge';
      await updateDoc(doc(fs, 'users', id), { isJudge: true, role: nextRole });
      await syncAppointedJudgesToCloud();
      await loadAdm();
      draw();
      showNotice(`${name} has been appointed as SOTM Judge.`, 'Judge Appointed');
    } catch (x) {
      showNotice('Failed (' + (x.code || 'error') + ')');
    }
  }, 'Appoint SOTM Judge');
};

window.revokeJudge = async (id, name) => {
  if (!IS_SUPER) return;

      showNotice(`SOTM Judge role removed from ${name}.`);

      showNotice('Failed (' + (x.code || 'error') + ')');
    }
  }, 'Revoke Judge');
};

window.appr=async id=>{const v=(($('#lt_'+id).value||'').trim()||$('#lk_'+id).value||'').toUpperCase();if(!v){showNotice('Choose or type the singer name to link');return}
  try{await updateDoc(doc(fs,'users',id),{status:'approved',singer:v});await loadAdm();draw()}catch(x){showNotice('Failed ('+(x.code||'error')+')')}};
window.rej=async id=>{showConfirm('Remove access for this person?', async () => {try{await updateDoc(doc(fs,'users',id),{status:'rejected'});await loadAdm();draw()}catch(x){showNotice('Failed ('+(x.code||'error')+')')}})};
window.saveZ=async()=>{try{await setDoc(doc(fs,'config','app'),{...CONF, zoom:$('#zl').value.trim()});CONF.zoom=$('#zl').value.trim();showNotice('Zoom link saved');draw()}catch(x){showNotice('Failed ('+(x.code||'error')+')')}};
const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h>>>0)};
window.pubUp=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{
  try{const x=JSON.parse(r.result);if((x.kind!='sfh-pub'&&x.kind!='sfh-master-backup')||!Array.isArray(x.songs))throw 0;
    const by={};x.songs.sort(cmpBySongId).forEach(sg=>{const m=String(sg[1]).slice(0,7);(by[m]=by[m]||[]).push(sg)});
    const ms=Object.keys(by).sort(),js={};let tot=0;
    ms.forEach(m=>{js[m]=JSON.stringify(by[m]);tot+=js[m].length;if(js[m].length>900000)throw 'size'});
    const isFullBackup = x.kind === 'sfh-master-backup';
    const label = isFullBackup ? 'Restore Full Master Backup' : 'Publish Data';
    showConfirm(`${label}: ${x.songs.length} songs (${Math.round(tot/1024)} KB across ${ms.length} month(s)), ${(x.sotd||[]).length} SOTD dates, and ${(x.singers||[]).length} singers?`, async () => {
      const ix=await getDoc(doc(fs,'pub','idx')),old=ix.exists()?(ix.data().months||{}):{},nw={};let wr=0;
      for(const m of ms){const hh=hsh(js[m]);nw[m]={n:by[m].length,h:hh};if(!old[m]||old[m].h!==hh){await setDoc(doc(fs,'pub','songs_'+m),{json:js[m],n:by[m].length,h:hh,ts:x.ts||''});wr++}}
      await setDoc(doc(fs,'pub','data'),{singers:x.singers||[],sotd:x.sotd||[],som:x.som||{},somd:x.somd||{},stars:x.stars||{},songMeta:x.songMeta||(PUB&&PUB.songMeta)||{},sessionMeta:x.sessionMeta||(PUB&&PUB.sessionMeta)||{},ts:x.ts||''});
      await setDoc(doc(fs,'pub','idx'),{months:nw,total:tot,ts:x.ts||''});
      if(isFullBackup && x.sotmResult){try{await setDoc(doc(fs,'pub','sotm'),x.sotmResult)}catch(y){}}
      if(isFullBackup && (x.holidays || x.schedule || x.starScoring)){
        try{
          const cfgPatch = { ...CONF };
          if(Array.isArray(x.holidays)) cfgPatch.holidays = x.holidays;
          if(x.schedule) cfgPatch.schedule = x.schedule;
          if(x.starScoring) cfgPatch.starScoring = x.starScoring;
          await setDoc(doc(fs,'config','app'), cfgPatch);
        }catch(y){}
      }
      for(const m of Object.keys(old))if(!nw[m]){try{await deleteDoc(doc(fs,'pub','songs_'+m))}catch(y){}}
      try{await deleteDoc(doc(fs,'pub','songs'))}catch(y){}
      await load();draw();showNotice(`${isFullBackup ? 'Full Master Backup restored!' : 'Published.'} ${wr} of ${ms.length} month(s) updated.`);
    }, label);
  }catch(z){showNotice(z=='size'?'One month of songs is too large for a single document.':(z&&z.code?'Restore/Publish failed ('+z.code+'). Check Firebase rules.':'That is not a valid SFH backup or participants file.'))}};r.readAsText(f)};

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=40').then(r=>r.update()).catch(()=>{});}
</script></body></html>
