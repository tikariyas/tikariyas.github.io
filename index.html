async function load(){
  loadErr='';PUB=null;SONGS=[];CONF={};
  try{
    const r=doc(fs,'users',U.uid);let s=await getDoc(r);
    if(!s.exists()&&!ADM){
      await setDoc(r,{email:U.email||'',name:U.displayName||pendingName||'',status:'pending',photo:'',phone:'',city:'',note:'',updatedAt:Date.now()});
      s=await getDoc(r);
    }
    P=s.exists()?s.data():{status:'approved',name:U.displayName||'',singer:''};
    if(ADM||P.status=='approved'){
      const [a,ix,c]=await Promise.all([getDoc(doc(fs,'pub','data')),getDoc(doc(fs,'pub','idx')),getDoc(doc(fs,'config','app'))]);

      else{const b=await getDoc(doc(fs,'pub','songs'));SONGS=b.exists()?(b.data().json?JSON.parse(b.data().json):(b.data().list||[])):[]}
      await loadBd();
      if(!ADM){await loadMsgs();await loadPlan()}
    }
  }catch(x){loadErr=x.code||x.message}
}

});

const phoneDigits=id=>{const dg=(id||'').replace(/\D/g,'').slice(-10);return dg.length==10?dg:''};
const emailsFor=id=>{id=(id||'').trim();if(id.includes('@'))return [id.toLowerCase()];const dg=phoneDigits(id);return dg?[dg+'@singfromhome-phone.app',dg+'-2@singfromhome-phone.app',dg+'-3@singfromhome-phone.app']:[]};
const authMsg=x=>({'auth/invalid-credential':'Wrong phone/email or password.','auth/wrong-password':'Wrong password.','auth/user-not-found':'No account found. Tap Create account.','auth/email-already-in-use':'This phone number or email already has an account. Tap Sign in.','auth/weak-password':'The password must have at least 6 characters.','auth/operation-not-allowed':'Email/password login is not turned on in Firebase yet.','auth/invalid-email':'Enter a valid 10-digit phone number or an email.','auth/network-request-failed':'No internet. Please try again.','auth/too-many-requests':'Too many attempts. Please wait a few minutes and try again.'}[x.code]||('Failed ('+(x.code||'error')+')'));
const needConsent=()=>{if(!$('#cs')||!$('#cs').checked){alert('Please tick the consent box first.');return true}return false};
window.loginPw=async()=>{if(needConsent())return;const ems=emailsFor($('#lid').value),pw=$('#lpw').value;
  if(!ems.length||pw.length<6){alert('Enter a 10-digit phone number or an email, and a password of at least 6 characters.');return}
  let last=null;
  for(const em of ems){try{await signInWithEmailAndPassword(auth,em,pw);return}catch(x){last=x;if(!['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(x.code))break}}
  alert(authMsg(last)+(ems.length>1?' If you forgot your password, type your name and a new password above and tap Forgot password.':''))};
window.signupPw=async()=>{if(needConsent())return;const nm=$('#lnm').value.trim(),ems=emailsFor($('#lid').value),pw=$('#lpw').value;
  if(!nm){alert('Please type your name.');return}
  if(!ems.length||pw.length<6){alert('Enter a 10-digit phone number or an email, and a password of at least 6 characters.');return}
  pendingName=nm;
  try{const c=await createUserWithEmailAndPassword(auth,ems[0],pw);try{await updateProfile(c.user,{displayName:nm})}catch(y){}}
  catch(x){alert(authMsg(x))}};
window.forgotPw=async()=>{const raw=($('#lid').value||'').trim();
  if(raw.includes('@')){try{await sendPasswordResetEmail(auth,raw);alert('A reset link has been sent to '+raw+'. Check your inbox and spam folder.')}catch(x){alert(authMsg(x))}return}
  const ems=emailsFor(raw);if(!ems.length){alert('Type your 10-digit phone number first.');return}
  if(needConsent())return;
  const nm=$('#lnm').value.trim(),pw=$('#lpw').value;
  if(!nm||pw.length<6){alert('Type your name and a NEW password (at least 6 characters) in the boxes above, then tap Forgot password again.');return}
  if(!confirm('A reset link cannot be sent to a phone number. A new login will be created for this number with the new password you typed, and the host must approve you again. Continue?'))return;
  pendingName=nm;
  for(const em of ems.slice(1)){
    try{const c=await createUserWithEmailAndPassword(auth,em,pw);try{await updateProfile(c.user,{displayName:nm})}catch(y){}return}
    catch(x){if(x.code!='auth/email-already-in-use'){alert(authMsg(x));return}}
  }
  alert('Too many resets for this number. Please contact the host.')};

function vEdU(){const u=AU.find(x=>x.id==EDU);if(!u)return '';
  return `<div class="c"><b>Profile – ${e(u.name||idOf(u.email))}</b><p class="m">${e(idOf(u.email))} · ${e(u.status||'')}</p>
<div class="row" style="margin:8px 0"><div class="ph">${okImg(u.photo)?`<img src="${u.photo}">`:'<span class="m">No photo</span>'}</div><div><label class="up">📷 Change photo<input type="file" accept="image/*" hidden onchange="picU(this)"></label> ${u.photo?'<button onclick="rmPicU()">Remove</button>':''}</div></div>
<div class="f"><label>Name<input id="eu_n" value="${e(u.name||'')}"></label><label>Linked singer<input id="eu_s" list="eul" value="${e(u.singer||'')}"><datalist id="eul">${((PUB&&PUB.singers)||[]).map(n=>`<option value="${e(n)}">`).join('')}</datalist></label><label>Phone<input id="eu_p" value="${e(u.phone||'')}"></label><label>City<input id="eu_c" value="${e(u.city||'')}"></label>${bdSel('eb',u.dob)}</div>
<label class="m" style="flex-direction:row;align-items:center;gap:10px;margin:6px 0"><input type="checkbox" id="ebs" class="chk" ${(u.bshow!==undefined?u.bshow:BD.some(b=>b.id==u.id))?'checked':''}><span>Show this birthday (day and month) to everyone in the app</span></label>
<label class="m">Notes<textarea id="eu_t" rows="3" style="width:100%">${e(u.note||'')}</textarea></label>
<p><button class="pri" onclick="saveU()">Save</button> <button onclick="closeU()">Close</button></p></div>`}
function grabU(){const u=AU.find(x=>x.id==EDU);if(!u||!$('#eu_n'))return u;u.name=$('#eu_n').value;u.singer=$('#eu_s').value.trim().toUpperCase();u.phone=$('#eu_p').value;u.city=$('#eu_c').value;u.note=$('#eu_t').value;u.dob=bdRead('eb');u.bshow=$('#ebs').checked;return u}
window.editU=id=>{EDU=id;draw();scrollTo(0,0)};
window.closeU=()=>{EDU='';draw()};
window.rmPicU=()=>{const u=grabU();if(u){u.photo='';draw()}};
window.picU=el=>{const f=el.files[0];if(!f)return;const u=grabU();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const S=240,c=document.createElement('canvas');c.width=c.height=S;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)*0.2,m,m,0,0,S,S);u.photo=c.toDataURL('image/jpeg',0.75);draw()};im.src=r.result};r.readAsDataURL(f)};
window.saveU=async()=>{const u=grabU();if(!u)return;try{await updateDoc(doc(fs,'users',u.id),{name:u.name||'',singer:u.singer||'',phone:u.phone||'',city:u.city||'',note:u.note||'',photo:u.photo||'',dob:u.dob||'',updatedAt:Date.now()});await setBd(u.id,u.singer||u.name||'',u.dob,u.bshow);alert('Saved');EDU='';await loadAdm();draw()}catch(x){alert('Could not save ('+(x.code||'error')+')')}};

async function loadGreet(){try{const q=await getDocs(collection(fs,'greet'));GRT=q.docs.map(x=>({id:x.id,...x.data()}))}catch(x){GRT=[]}}

const mdOf=d=>String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function showCard(o){const old=document.getElementById('dw');if(old)old.remove();
  const d=document.createElement('div');d.id='dw';
  d.innerHTML=`<div class="card"${o.bg?` style="background:${o.bg}"`:''}><button class="x" onclick="closeDw()" aria-label="Close">✕</button><div class="diya">${o.icon}</div><h2>${e(o.title)}</h2>${o.sub?`<p style="font-size:21px;margin:4px 0">${e(o.sub)}</p>`:''}<p style="font-size:15px;line-height:1.55;margin:12px 0;white-space:pre-line">${e(o.text)}</p>${o.sig?`<p style="margin:12px 0 16px;font-size:14px">${o.sig}</p>`:''}<button style="background:#fff;color:#b4531a;border:0;border-radius:10px;padding:11px 34px;font-size:16px;font-weight:bold;cursor:pointer" onclick="closeDw()">Close</button></div>`;
  d.onclick=ev=>{if(ev.target===d)closeDw()};document.body.appendChild(d)}
function seenMap(){try{return JSON.parse(localStorage.getItem('sfh_cards')||'{}')}catch(x){return {}}}
function nextCard(){if(document.getElementById('dw'))return;const c=GQ.shift();if(!c)return;const m=seenMap();m[c.key]=tdy();try{localStorage.setItem('sfh_cards',JSON.stringify(m))}catch(x){}showCard(c)}
window.closeDw=()=>{const d=document.getElementById('dw');if(d)d.remove();nextCard()};
function runCards(){const t=tdy(),m=seenMap(),due=[];
  [...BUILTIN,...GRT].forEach(g=>{const k='g-'+(g.id||g.title);if(g.from<=t&&t<=g.to&&m[k]!==t)due.push({key:k,icon:g.icon||'🎉',title:g.title,sub:g.hi,text:g.text,sig:SIGN})});
  if(U&&P&&(ADM||P.status=='approved')){const md=t.slice(5),bl=BD.filter(b=>b.md==md);
    if(bl.length&&m['bd-'+t]!==t){const mine=bl.some(b=>b.id==U.uid),names=bl.map(b=>b.singer).join(', ');
      due.push({key:'bd-'+t,icon:'🎂',title:mine?'Happy Birthday!':'Birthday today',sub:mine?'':names,
        text:mine?'Wishing you a wonderful birthday'+(bl.find(b=>b.id==U.uid).singer?', '+bl.find(b=>b.id==U.uid).singer:'')+'! May your year be full of music, health and joy.':'Let us wish '+names+' a very happy birthday today!',
        sig:mine?'– The SING FROM HOME family':'',bg:'linear-gradient(160deg,#c2417a,#e8845a 55%,#f5c542)'})}}
  GQ=due;nextCard()}
function bdCard(){const out=[],b0=new Date(tdy()+'T00:00');
  for(let i=0;i<=7;i++){const d=new Date(b0.getFullYear(),b0.getMonth(),b0.getDate()+i),md=mdOf(d);BD.filter(b=>b.md==md).forEach(b=>out.push({n:b.singer,i,d}))}
  return out.length?`<div class="c"><b>🎂 Birthdays</b>${out.map(o=>`<p style="margin:5px 0"><b>${e(o.n)}</b> <span class="m">${o.i==0?'today':o.d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span></p>`).join('')}</div>`:''}
loadGreet().then(()=>setTimeout(runCards,500));
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const bdSel=(id,dob)=>{const [mm,dd]=(dob||'').split('-');return `<label>Birthday – day<select id="${id}d"><option value="">–</option>${Array.from({length:31},(_,k)=>`<option value="${String(k+1).padStart(2,'0')}"${dd==String(k+1).padStart(2,'0')?' selected':''}>${k+1}</option>`).join('')}</select></label><label>Month<select id="${id}m"><option value="">–</option>${MON.map((n,k)=>`<option value="${String(k+1).padStart(2,'0')}"${mm==String(k+1).padStart(2,'0')?' selected':''}>${n}</option>`).join('')}</select></label>`};
const bdRead=id=>{const d=$('#'+id+'d'),m=$('#'+id+'m');return d&&m&&d.value&&m.value?m.value+'-'+d.value:''};
async function setBd(uid,name,dob,show){try{if(show&&dob)await setDoc(doc(fs,'birthdays',uid),{singer:name||'',md:dob,ts:Date.now()});else await deleteDoc(doc(fs,'birthdays',uid))}catch(x){}await loadBd()}
/* admin: festival greetings */
window.fillFest=v=>{if(v==='')return;const f=FEST[+v];$('#gt').value=f.t;$('#gh').value=f.h;$('#gx').value=f.x;$('#gt').dataset.i=f.i};
window.prevGreet=()=>{const t=$('#gt').value.trim(),x=$('#gx').value.trim();if(!t||!x){alert('Write a title and a message first');return}showCard({icon:$('#gt').dataset.i||'🎉',title:t,sub:$('#gh').value.trim(),text:x,sig:SIGN})};
window.addGreet=async()=>{const t=$('#gt').value.trim(),x=$('#gx').value.trim(),fr=$('#gfrom').value,to=$('#gto').value;
  if(!t||!x||!fr||!to){alert('Fill the title, message and both dates');return}if(to<fr){alert('The end date is before the start date');return}
  try{await addDoc(collection(fs,'greet'),{title:t,hi:$('#gh').value.trim(),text:x,from:fr,to,icon:$('#gt').dataset.i||'🎉',ts:Date.now()});await loadGreet();draw();alert('Greeting added. It shows to everyone from '+fd(fr)+' to '+fd(to)+'.')}
  catch(y){alert('Could not save ('+(y.code||'error')+'). Check that the latest rules are published.')}};
window.delGreet=async id=>{if(!confirm('Delete this greeting?'))return;try{await deleteDoc(doc(fs,'greet',id));await loadGreet();draw()}catch(y){alert('Failed ('+(y.code||'error')+')')}};

/* ---------------- Admin ---------------- */
async function loadAdm(){try{const q=await getDocs(collection(fs,'users'));AU=q.docs.map(x=>({id:x.id,...x.data()}));try{const mq=await getDocs(collection(fs,'msgs'));AM=mq.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.ts-a.ts)}catch(x){AM=[]}try{const iq=await getDocs(collection(fs,'inbox'));AIN=iq.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.ts-a.ts)}catch(x){AIN=[]}await loadPlans()}catch(x){AU=[];alert('Could not load participants ('+(x.code||'error')+'). Check the admin email in firestore.rules.')}}
function vAdm(){
  const names=(PUB&&PUB.singers)||[],opt='<option value="">Link to singer…</option>'+names.map(n=>`<option>${e(n)}</option>`).join('');
  const pend=AU.filter(u=>u.status!='approved'),ok=AU.filter(u=>u.status=='approved');
  const img=u=>okImg(u.photo)?`<div class="ph" style="width:44px;height:44px"><img src="${u.photo}"></div>`:'';
  return `${EDU?vEdU():''}<div class="c"><b>1. Publish data</b><p class="m">${PUB?'Last published: '+e(PUB.ts||''):'Nothing published yet.'} (${SONGS.length} songs)</p>
<label class="up">⬆ Choose the file from the host app<input type="file" accept=".json,application/json" hidden onchange="pubUp(this)"></label></div>
<div class="c"><b>2. Zoom link</b><input id="zl" style="width:100%" value="${e(CONF.zoom||'')}"><p><button onclick="saveZ()">Save link</button></p></div>
<div class="c"><b>🎉 Festival greetings</b><p class="m" style="margin:2px 0 6px">A pop-up shown once a day to everyone who opens the app between the two dates.</p><select id="gf" onchange="fillFest(this.value)"><option value="">Choose a festival…</option>${FEST.map((f,i)=>`<option value="${i}">${e(f.t)}</option>`).join('')}</select><input id="gt" placeholder="Title" style="width:100%;margin-top:6px"><input id="gh" placeholder="Hindi / Marathi line (optional)" style="width:100%;margin-top:6px"><textarea id="gx" rows="3" placeholder="Message" style="width:100%;margin-top:6px"></textarea><div class="f"><label>Show from<input type="date" id="gfrom" value="${tdy()}"></label><label>Show until<input type="date" id="gto" value="${tdy()}"></label></div><p><button class="pri" onclick="addGreet()">Add greeting</button> <button onclick="prevGreet()">Preview</button></p>${GRT.length?GRT.slice().sort((a,b)=>a.from<b.from?1:-1).map(g=>`<p style="margin:6px 0"><b>${e(g.title)}</b> <span class="m">${fd(g.from)} – ${fd(g.to)}</span> <button onclick="delGreet('${e(g.id)}')">Delete</button></p>`).join(''):'<p class="m">No greetings added yet. The Diwali greeting for 5 to 12 Nov 2026 is built in.</p>'}</div>
<div class="c"><b>Songs declared by participants</b><div class="f"><input type="date" value="${PD||tdy()}" onchange="setPD(this.value)"></div>${PL.length?PL.map((p,i)=>`<p style="margin:6px 0"><b>${i+1}. ${e(p.singer)}</b> <span class="m">${fdt(p.ts)}</span><br>${(p.songs||[]).map(x=>e(x)).join(' / ')}</p>`).join(''):'<p class="m">Nothing declared for this date.</p>'}<button onclick="copyPlans()">Copy list</button></div>
<div class="c"><b>Messages from participants (${AIN.length})</b>${AIN.slice(0,30).map(m=>`<div style="margin:8px 0;border-top:1px solid var(--bd);padding-top:6px"><b>${e(m.name||'?')}</b> <span class="m">${fdt(m.ts)}</span>${m.ts>seenAdm?' <span class="zm" style="padding:1px 6px;font-size:11px">NEW</span>':''}<div style="white-space:pre-wrap">${e(m.text)}</div><button onclick="replyTo('${e(m.uid)}')">Reply</button> <button onclick="delIn('${e(m.id)}')">Delete</button></div>`).join('')||'<p class="m">No messages yet.</p>'}</div>
<div class="c"><b>Send a message</b><input id="mt" placeholder="Title" style="width:100%;margin-top:6px"><textarea id="mb" rows="4" placeholder="Message" style="width:100%;margin-top:6px"></textarea><div class="f"><select id="mto"><option value="all">All approved participants</option>${ok.map(u=>`<option value="${e(u.id)}">${e(u.singer||u.name)}</option>`).join('')}</select></div><button class="pri" onclick="sendMsg()">Send</button><p class="m">Participants can only read it. ${AM.length} sent so far.</p></div>
${AM.length?`<div class="c"><b>Sent messages</b>${AM.slice(0,20).map(m=>`<p style="margin:8px 0"><b>${e(m.title)}</b> <span class="m">→ ${e(m.toName||m.to)} · ${fdt(m.ts)}</span> <button onclick="delMsg('${e(m.id)}')">Delete</button></p>`).join('')}</div>`:''}
<div class="c"><b>3. Waiting for approval (${pend.length})</b></div>
${pend.map(u=>`<div class="c"><div class="row">${img(u)}<div><b>${e(u.name)}</b><br><span class="m">${e(idOf(u.email))} · ${e(u.status||'')}</span></div></div>
<div class="f"><select id="lk_${e(u.id)}">${opt}</select><input id="lt_${e(u.id)}" placeholder="or type singer name"></div>
<button class="pri" onclick="appr('${e(u.id)}')">Approve</button> <button onclick="rej('${e(u.id)}')">Reject</button> <button onclick="editU('${e(u.id)}')">Profile</button></div>`).join('')}
<div class="c"><b>4. Approved (${ok.length})</b>${ok.map(u=>`<p style="margin:6px 0">${e(u.singer||'(not linked)')} <span class="m">${e(idOf(u.email))}</span> <button onclick="rej('${e(u.id)}')">Revoke</button> <button onclick="editU('${e(u.id)}')">Profile</button></p>`).join('')}</div>`;
}
window.appr=async id=>{const v=(($('#lt_'+id).value||'').trim()||$('#lk_'+id).value||'').toUpperCase();if(!v){alert('Choose or type the singer name to link');return}
  try{await updateDoc(doc(fs,'users',id),{status:'approved',singer:v});await loadAdm();draw()}catch(x){alert('Failed ('+(x.code||'error')+')')}};
window.rej=async id=>{if(!confirm('Remove access for this person?'))return;try{await updateDoc(doc(fs,'users',id),{status:'rejected'});await loadAdm();draw()}catch(x){alert('Failed ('+(x.code||'error')+')')}};
window.saveZ=async()=>{try{await setDoc(doc(fs,'config','app'),{zoom:$('#zl').value.trim()});CONF.zoom=$('#zl').value.trim();alert('Zoom link saved');draw()}catch(x){alert('Failed ('+(x.code||'error')+')')}};
const hsh=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h>>>0)};
window.pubUp=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{
  try{const x=JSON.parse(r.result);if(x.kind!='sfh-pub'||!Array.isArray(x.songs))throw 0;
    const by={};x.songs.forEach(sg=>{const m=String(sg[1]).slice(0,7);(by[m]=by[m]||[]).push(sg)});
    const ms=Object.keys(by).sort(),js={};let tot=0;
    ms.forEach(m=>{js[m]=JSON.stringify(by[m]);tot+=js[m].length;if(js[m].length>900000)throw 'size'});
    if(!confirm('Publish '+x.songs.length+' songs ('+Math.round(tot/1024)+' KB in '+ms.length+' month'+(ms.length>1?'s':'')+'), '+(x.sotd||[]).length+' Singer of the Day dates and '+(x.singers||[]).length+' singers to participants?'+(tot>1500000?'\n\nNote: the songs list is getting large and the app may load slowly. Please tell Claude.':'')))return;
    const ix=await getDoc(doc(fs,'pub','idx')),old=ix.exists()?(ix.data().months||{}):{},nw={};let wr=0;
    for(const m of ms){const hh=hsh(js[m]);nw[m]={n:by[m].length,h:hh};if(!old[m]||old[m].h!==hh){await setDoc(doc(fs,'pub','songs_'+m),{json:js[m],n:by[m].length,h:hh,ts:x.ts||''});wr++}}
    await setDoc(doc(fs,'pub','data'),{singers:x.singers||[],sotd:x.sotd||[],som:x.som||{},somd:x.somd||{},stars:x.stars||{},ts:x.ts||''});
    await setDoc(doc(fs,'pub','idx'),{months:nw,total:tot,ts:x.ts||''});
    for(const m of Object.keys(old))if(!nw[m]){try{await deleteDoc(doc(fs,'pub','songs_'+m))}catch(y){}}
    try{await deleteDoc(doc(fs,'pub','songs'))}catch(y){}
    await load();draw();alert('Published. '+wr+' of '+ms.length+' month(s) updated.');
  }catch(z){alert(z=='size'?'One month of songs is too large for a single document. Please tell Claude.':(z&&z.code?'Publishing failed ('+z.code+'). Check the Firebase rules and the admin email.':'That is not a valid participants file.'))}};r.readAsText(f)};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
